[project]
name = "morningai"
version = "1.0.0"
description = "MorningAI Backend API"
requires-python = ">=3.12"

[tool.ruff]
# Target Python 3.12
target-version = "py312"

# Line length matching existing .flake8 config
line-length = 120

# Exclude directories (matching .flake8)
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    ".next",
    ".vercel",
    "handoff/20250928/40_App/frontend-dashboard",
    "handoff/20250928/60_Design",
]

[tool.ruff.lint]
# Start with minimal rule set (F = Pyflakes, E = pycodestyle errors)
# Can expand to include more rules later (W, I, B, UP, etc.)
select = [
    "F",   # Pyflakes - catches unused imports, undefined names, etc.
    "E",   # pycodestyle errors
]

# Ignore rules matching existing .flake8 config
# Note: E501 and E402 moved to per-file-ignores for stricter enforcement (gemini-code-assist recommendation)
ignore = [
    "E203",  # Whitespace before ':'
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py (re-exports)
"__init__.py" = ["F401", "F403"]
# Allow long lines in migrations and tests
"*/migrations/*.py" = ["E501"]
"*/tests/*.py" = ["E501"]
# Allow module level import not at top of file in main.py (due to sys.path manipulation)
# Allow unused imports in main.py (availability check pattern)
"handoff/20250928/40_App/api-backend/src/main.py" = ["E402", "F401"]
# Allow unused imports in report_generator.py (matplotlib/pandas availability check)
"handoff/20250928/40_App/api-backend/src/services/report_generator.py" = ["F401"]
# Allow module level import not at top of file in governance.py (due to sys.path manipulation)
"handoff/20250928/40_App/api-backend/src/routes/governance.py" = ["E402"]
