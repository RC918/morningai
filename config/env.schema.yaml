  MORNINGAI_REPO_PATH:
    type: string
    required: false
    description: Repository root path for production/staging deployments
    category: Deployment
    security_level: public
    notes: 'Specifies the absolute path to the MorningAI repository root.
    
      Required in production/staging environments where the repository is not located at ~/repos/morningai.
      
      If not set, the system will attempt to discover the repository root using:
      1. MORNINGAI_REPO_PATH environment variable (this variable)
      2. git rev-parse --show-toplevel (if in a git repository)
      3. Project root detection via marker files (.git, config, handoff, etc.)
      
      Example values:
      - /opt/render/project/src (Render.com deployment)
      - /app (Docker container)
      - /home/ubuntu/repos/morningai (development)
      
      IMPORTANT: This must point to the repository root directory containing the config/, handoff/, agents/, and tools/ directories.
      
      '
    environment_specific:
      production: /opt/render/project/src
      staging: /opt/render/project/src
      development: null
    example: /home/user/repos/morningai
