version: '1.1'
description: Morning AI Complete Environment Schema (Phase 11 + Missing Variables)
metadata:
  total_variables: 142
  required_variables: 20
  optional_variables: 122
  last_updated: '2025-12-07'
  notes: 'Added 54 missing variables found in codebase:

    - TOTP_ENCRYPTION_KEY (critical for 2FA)

    - ENABLE_MOCK_USERS (security flag)

    - USE_LANGGRAPH, USE_LANGGRAPH_PERCENT, USE_LLM_PLANNER, USE_CODE_GENERATION, USE_CODEGEN_WORKFLOW_PERCENT (orchestrator control)

    - Rate limiting, monitoring, testing, and infrastructure variables

    '
fields:
  JWT_SECRET_KEY:
    type: secret
    required: true
    min_length: 32
    description: JWT token signing key for authentication
    category: Authentication
    security_level: critical
  ACCESS_TOKEN_EXPIRY_MINUTES:
    type: integer
    required: false
    default: 15
    description: JWT access token expiry time in minutes (CI/E2E can override to 60)
    category: Authentication
    security_level: medium
    notes: 'Controls how long JWT access tokens remain valid before requiring refresh.
    
      - Production: 15 minutes (default, security best practice)
      
      - CI/E2E: 60 minutes (allows long-running test suites)
      
      - Development: 15 minutes (matches production behavior)
      
      Longer expiry times reduce security but improve user experience and test reliability.
      
      '
    environment_specific:
      production: 15
      development: 15
      ci: 60
  LOG_TOKEN_EXPIRY_ON_STARTUP:
    type: boolean
    required: false
    default: false
    description: Enable debug logging of JWT token expiry configuration on startup
    category: Debugging
    security_level: low
  ADMIN_PASSWORD:
    type: secret
    required: true
    description: Admin user password for system access
    category: Authentication
    security_level: critical
  FLASK_SECRET_KEY:
    type: secret
    required: true
    min_length: 32
    description: Flask application secret key for sessions
    category: Security
    security_level: critical
    notes: 'Required in production. App will fail to start without this key.

      Deprecated SECRET_KEY was removed on 2025-11-30.

      '
  ENCRYPTION_MASTER_KEY:
    type: secret
    required: true
    min_length: 32
    description: Master encryption key for sensitive data
    category: Security
    security_level: critical
    notes: 'Required in production. App will fail to start without this key.

      Deprecated MASTER_KEY was removed on 2025-11-30.

      '
  DATABASE_URL:
    type: url
    required: true
    description: PostgreSQL database connection URL
    category: Database
    security_level: secret
    example: postgresql://user:pass@host:5432/dbname
  REDIS_URL:
    type: url
    required: false
    default: redis://localhost:6379/0
    description: Redis connection URL for queue and caching. Use rediss:// (double
      's') for TLS-encrypted connections. For production, use UPSTASH_REDIS_REST_URL
      (HTTPS/TLS by default)
    category: Database
    security_level: secret
    example: redis://localhost:6379/0
    example_tls: rediss://user:pass@host:6380/0
    notes: '- Non-TLS: redis://localhost:6379/0

      - TLS: rediss://user:pass@host:6380/0

      - Recommendation: Use UPSTASH_REDIS_REST_URL for production (HTTPS/TLS by default)

      '
  REDIS_HOST:
    type: string
    required: false
    default: localhost
    description: Redis host for fallback connection when REDIS_URL is not set
    category: Database
    security_level: public
    notes: 'Fallback Redis connection settings.

      Used when REDIS_URL is not configured.

      Default: localhost

      '
  REDIS_PORT:
    type: integer
    required: false
    default: 6379
    min: 1
    max: 65535
    description: Redis port for fallback connection when REDIS_URL is not set
    category: Database
    security_level: public
    notes: 'Fallback Redis connection settings.

      Used when REDIS_URL is not configured.

      Default: 6379 (standard Redis port)

      '
  REDIS_DB:
    type: integer
    required: false
    default: 0
    min: 0
    max: 15
    description: Redis database number for fallback connection when REDIS_URL is not set
    category: Database
    security_level: public
    notes: 'Fallback Redis connection settings.

      Used when REDIS_URL is not configured.

      Default: 0 (first database)

      Range: 0-15 (Redis supports 16 databases by default)

      '
  MEMORY_TABLE:
    type: string
    required: false
    default: memory
    description: Supabase memory table name for vector storage
    category: Database
    security_level: public
  SUPABASE_URL:
    type: url
    required: true
    description: Supabase project URL
    category: Cloud Services
    security_level: public
    example: https://xxxxx.supabase.co
  SUPABASE_ANON_KEY:
    type: secret
    required: true
    description: Supabase anonymous/public key
    category: Cloud Services
    security_level: secret
  SUPABASE_SERVICE_ROLE_KEY:
    type: secret
    required: true
    description: Supabase service role key (admin access)
    category: Cloud Services
    security_level: critical
  CLOUDFLARE_API_TOKEN:
    type: secret
    required: true
    description: Cloudflare API token for DNS/CDN management
    category: Cloud Services
    security_level: secret
  CLOUDFLARE_ZONE_ID:
    type: string
    required: true
    description: Cloudflare zone ID for domain
    category: Cloud Services
    security_level: public
  VERCEL_TOKEN:
    type: secret
    required: true
    description: Vercel deployment token
    category: Cloud Services
    security_level: secret
  VERCEL_ORG_ID:
    type: string
    required: true
    description: Vercel organization ID
    category: Cloud Services
    security_level: public
  VERCEL_PROJECT_ID:
    type: string
    required: true
    description: Vercel project ID
    category: Cloud Services
    security_level: public
  RENDER_API_KEY:
    type: secret
    required: true
    description: Render API key for deployments
    category: Cloud Services
    security_level: secret
  RENDER_INSTANCE_ID:
    type: string
    required: false
    description: Render instance ID (auto-set by Render platform)
    category: Infrastructure
    security_level: public
  PYTHONPATH:
    type: string
    required: false
    description: Python module search path for importing orchestrator modules from API backend
    category: Infrastructure
    security_level: public
    notes: |
      Required for Render deployments where API backend needs to import orchestrator modules.

      Example for Render: /opt/render/project/src/handoff/20250928/40_App/orchestrator:/opt/render/project/src/handoff/20250928/40_App/api-backend/src

      This enables imports like "from orchestrator.persistence.db_client import get_client" in the API backend.
  UPSTASH_REDIS_REST_URL:
    type: url
    required: true
    description: Upstash Redis REST API URL (HTTPS/TLS enabled by default)
    category: Cloud Services
    security_level: public
    example: https://xxxxx.upstash.io
    notes: Recommended for production - HTTPS/TLS enabled by default
  UPSTASH_REDIS_REST_TOKEN:
    type: secret
    required: true
    description: Upstash Redis REST API token (HTTPS/TLS enabled by default)
    category: Cloud Services
    security_level: secret
    notes: Required when using UPSTASH_REDIS_REST_URL
  FLY_API_TOKEN:
    type: secret
    required: false
    description: Fly.io API token for sandbox deployments
    category: Infrastructure
    security_level: secret
  SENTRY_DSN:
    type: url
    required: true
    description: Sentry DSN for error tracking
    category: Monitoring
    security_level: public
    example: https://xxxxx@xxxxx.ingest.sentry.io/xxxxx
  SENTRY_AUTH_TOKEN:
    type: secret
    required: false
    description: Sentry authentication token for API access
    category: Monitoring
    security_level: secret
  DISABLE_SENTRY_FOR_TESTS:
    type: boolean
    required: false
    default: false
    description: Disable Sentry initialization in test environments (ignored in production for safety)
    category: Monitoring
    security_level: public
    notes: When true, disables Sentry error tracking in non-production environments. This flag is ignored in production to ensure error tracking remains active.
  GITHUB_TOKEN:
    type: secret
    required: true
    description: GitHub API token for repository operations (permissions repo, workflow)
    category: Integration
    security_level: critical
  GITHUB_REPO:
    type: string
    required: true
    default: RC918/morningai
    description: GitHub repository in owner/repo format
    category: Integration
    security_level: public
    example: RC918/morningai
  OPENAI_API_KEY:
    type: secret
    required: true
    description: OpenAI API key for embeddings and LLM operations
    category: Integration
    security_level: critical
  LLM_PROVIDER:
    type: string
    required: false
    default: openai
    description: LLM provider for text generation (openai, gemini, auto)
    category: Integration
    security_level: public
    choices:
    - openai
    - gemini
    - auto
    notes: 'Controls which LLM provider is used for text generation:

      - openai (default): Use OpenAI GPT-4 for text generation

      - gemini: Use Google Gemini Pro for text generation

      - auto: Automatically select available provider (OpenAI first, then Gemini)

      Requires corresponding API key (OPENAI_API_KEY or GEMINI_API_KEY) to be set.

      '
  GEMINI_API_KEY:
    type: secret
    required: false
    description: Google Gemini API key for LLM operations (Phase 2 Extra)
    category: Integration
    security_level: critical
    notes: 'Required when LLM_PROVIDER=gemini or LLM_PROVIDER=auto.

      Get your API key from: https://makersuite.google.com/app/apikey

      '
  SLACK_WEBHOOK_URL:
    type: url
    required: false
    description: Slack webhook URL for notifications
    category: Integration
    security_level: secret
  TELEGRAM_BOT_TOKEN:
    type: secret
    required: false
    description: Telegram bot token for HITL approvals
    category: Integration
    security_level: secret
  TELEGRAM_ADMIN_CHAT_ID:
    type: string
    required: false
    description: Telegram admin chat ID for notifications
    category: Integration
    security_level: public
  MCP_SERVER_URL:
    type: url
    required: false
    description: MCP (Model Context Protocol) server endpoint
    category: Integration
    security_level: public
  AGENT_ID:
    type: string
    required: false
    description: Agent identifier for MCP operations
    category: Integration
    security_level: public
  RQ_QUEUE_NAME:
    type: string
    required: false
    default: orchestrator
    description: Redis Queue name for task processing
    category: Worker
    security_level: public
  RQ_SERIALIZER:
    type: string
    required: false
    default: json
    description: RQ serializer type (json/pickle)
    category: Worker
    security_level: public
    choices:
    - json
    - pickle
  RQ_JOB_TIMEOUT:
    type: integer
    required: false
    default: 600
    description: Job timeout in seconds for orchestrator RQ worker jobs (run_orchestrator_task). Controls how long LLM Planner and other agent tasks may run before being marked as failed due to timeout. Increase for long-running tasks (e.g., 4-5 minute LLM Planner executions).
    category: Worker
    security_level: public
    notes: 'Default 600 seconds (10 minutes) allows LLM Planner tasks to complete.
    
      Lower values (180s) may cause AbandonedJobError for long-running tasks.
      
      Higher values (900s+) may be needed for complex multi-step workflows.
      
      '
  RQ_TASK_TTL:
    type: integer
    required: false
    default: 600
    description: Task enqueue TTL in seconds. Tasks not started within this time are discarded from the queue.
    category: Worker
    security_level: public
    notes: 'Default 600 seconds (10 minutes).
    
      Tasks waiting longer than this in the queue will be discarded.
      
      Increase for high-load scenarios where queue backlog is expected.
      
      '
  RQ_RESULT_TTL:
    type: integer
    required: false
    default: 86400
    description: Result retention TTL in seconds. Successful job results are kept for this duration.
    category: Worker
    security_level: public
    notes: 'Default 86400 seconds (24 hours).
    
      Results can be retrieved within this window after job completion.
      
      Increase for debugging or audit requirements.
      
      '
  RQ_FAILURE_TTL:
    type: integer
    required: false
    default: 3600
    description: Failure retention TTL in seconds. Failed job records are kept for this duration.
    category: Worker
    security_level: public
    notes: 'Default 3600 seconds (1 hour).
    
      Failed jobs can be inspected or retried within this window.
      
      Increase for debugging or manual retry scenarios.
      
      '
  FLASK_ENV:
    type: string
    required: false
    default: development
    choices:
    - development
    - staging
    - production
    - testing
    description: Flask environment mode
    category: Application
    security_level: public
  ENVIRONMENT:
    type: string
    required: false
    default: production
    description: Deployment environment (development/staging/production)
    category: Application
    security_level: public
    choices:
    - development
    - staging
    - production
  PORT:
    type: integer
    required: false
    default: 5000
    description: Application server port
    category: Application
    security_level: public
  CORS_ORIGINS:
    type: string
    required: false
    default: http://localhost:5173,http://localhost:5174
    description: CORS allowed origins (comma-separated)
    category: Application
    security_level: public
    example: http://localhost:5173,http://localhost:5174
  APP_VERSION:
    type: string
    required: false
    default: 8.0.0
    description: Application version for tracking
    category: Application
    security_level: public
    notes: Aligned with APP_PHASE (Phase 8 = 8.0.0)
  APP_PHASE:
    type: string
    required: false
    default: Phase 8
    description: Current application phase
    category: Application
    security_level: public
  HOSTNAME:
    type: string
    required: false
    description: System hostname (auto-detected)
    category: Infrastructure
    security_level: public
  PHASE7_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Phase 7 components
    category: Feature Flags
    security_level: public
  OPS_AGENT_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Ops Agent functionality
    category: Feature Flags
    security_level: public
  GROWTH_STRATEGIST_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Growth Strategist agent
    category: Feature Flags
    security_level: public
  PM_AGENT_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable PM Agent functionality
    category: Feature Flags
    security_level: public
  REFACTOR_AGENT_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Refactor Agent for automated TS strict mode fixes
    category: Feature Flags
    security_level: public
  REFACTOR_AGENT_ERRORS_PER_RUN:
    type: integer
    required: false
    default: 10
    description: Number of TS errors to fix per nightly run
    category: Feature Flags
    security_level: public
  REFACTOR_AGENT_AUTO_PR:
    type: boolean
    required: false
    default: false
    description: Automatically create PRs for refactor fixes (disabled by default, enable after staging validation)
    category: Feature Flags
    security_level: public
  HITL_APPROVAL_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable HITL (Human-in-the-Loop) approval system
    category: Feature Flags
    security_level: public
  DEMO_MODE:
    type: boolean
    required: false
    default: false
    description: Enable demo mode (limited functionality)
    category: Feature Flags
    security_level: public
  SANDBOX_ENABLED:
    type: boolean
    required: false
    default: false
    description: Enable Docker sandbox containers for agents
    category: Feature Flags
    security_level: public
  COOKIE_SECURE:
    type: boolean
    required: false
    default: true
    description: Enable Secure flag on authentication cookies (HTTPS-only)
    category: Security
    security_level: public
    notes: 'When true, cookies are only sent over HTTPS connections.

      Defaults to true in production, false in development.

      Required to be true when COOKIE_SAMESITE=None (browser requirement).

      '
  COOKIE_SAMESITE:
    type: string
    required: false
    default: Lax
    description: SameSite attribute for authentication cookies
    category: Security
    security_level: public
    choices:
    - Strict
    - Lax
    - None
    notes: 'Controls when cookies are sent on cross-site requests.

      - Strict: Cookies only sent on same-site requests (most secure)

      - Lax: Cookies sent on top-level navigation (default, balanced)

      - None: Cookies sent on all requests (requires COOKIE_SECURE=true)

      For cross-domain deployments (e.g., Staging), use None with COOKIE_SECURE=true.

      '
  FEATURE_2FA_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Two-Factor Authentication (2FA/TOTP) feature
    category: Feature Flags
    security_level: public
  FEATURE_2FA_PREAUTH:
    type: boolean
    required: false
    default: false
    description: Enable Pre-Auth Token for 2FA (Week 1 - reduces password transmission)
    category: Feature Flags
    security_level: public
    notes: 'When enabled, password is only transmitted once during login.

      2FA verification uses a short-lived pre-auth token instead of password.

      Reduces password exposure risk by 50%.

      '
  PREAUTH_TOKEN_TTL:
    type: integer
    required: false
    default: 300
    description: Pre-Auth Token TTL in seconds (5 minutes default)
    category: Feature Flags
    security_level: public
    notes: 'Time-to-live for pre-auth tokens in seconds.

      Tokens automatically expire after this duration.

      Recommended: 300 seconds (5 minutes).

      Protected by @rate_limit decorator on verify endpoint.

      '
  VITE_API_BASE_URL:
    type: string
    required: false
    default: /api
    description: Frontend API base URL (defaults to '/api' for Vercel proxy, or full URL with '/api' suffix for direct backend access)
    category: Frontend
    security_level: public
    example: /api
    notes: 'For Vercel preview/production deployments, use ''/api'' (Vercel proxy handles routing).
    
      For local development or direct backend access, use full URL with ''/api'' suffix.
      
      Examples:
      
      - Preview/Vercel: /api
      
      - Staging: https://morningai-backend-v2-stg.onrender.com/api
      
      - Production: https://morningai-backend-v2.onrender.com/api
      
      - Local: http://localhost:5001/api
      
      '
  VITE_FEATURES:
    type: string
    required: false
    default: dashboard,checkout,settings
    description: Enabled frontend features (comma-separated)
    category: Frontend
    security_level: public
    example: dashboard,checkout,settings
  VITE_SENTRY_DSN:
    type: url
    required: false
    description: Frontend Sentry DSN for error tracking
    category: Frontend
    security_level: public
  VITE_USE_MOCK:
    type: boolean
    required: false
    default: false
    description: Use mock API in frontend for development
    category: Frontend
    security_level: public
  VITE_TRACE_VIEWER_URL:
    type: url
    required: false
    description: Trace viewer URL for observability platform (Jaeger, Tempo, Grafana, etc.)
    category: Frontend
    security_level: public
    notes: 'Used to link trace IDs in Agent Execution Logs to detailed trace views. Examples: https://jaeger.gm365.me, https://tempo.gm365.me, https://grafana.gm365.me/explore. Leave empty to disable trace links.'
  VITE_FEATURE_OWNER_CONSOLE_API:
    type: boolean
    required: false
    default: true
    description: Enable real backend API for Owner Console (defaults to true in production builds)
    category: Frontend
    security_level: public
    notes: 'Controls whether Owner Console uses real backend authentication or mock data.

      - true: Use real backend API (recommended for production/staging)

      - false: Use mock authentication (development only)

      In production builds, defaults to true to prevent accidentally shipping mock auth.

      Priority order (development): URL params > localStorage > env var > default

      Priority order (production): env var > default (true) - URL/localStorage ignored for security

      '
  VITE_E2E:
    type: boolean
    required: false
    default: false
    description: Enable E2E test mode (NEVER enable in production - XSS security risk)
    category: Testing
    security_level: critical
    notes: 'Controls whether JWT tokens are stored in localStorage for E2E test persistence.

      - false (default): Tokens only stored in memory (production-safe, prevents XSS attacks)

      - true: Tokens also stored in localStorage (E2E tests only, required for Playwright storageState)

      SECURITY WARNING: NEVER set to true in production builds. This creates XSS vulnerability.

      Only set to true in CI/E2E test builds where Playwright needs token persistence across page navigations.

      Production builds must always use in-memory token storage only.

      '
    environment_specific:
      production: false
      development: false
      ci: true
  STRIPE_SECRET_KEY:
    type: secret
    required: false
    description: Stripe secret key (planned for Phase 10)
    category: Payment
    security_level: critical
  STRIPE_WEBHOOK_SECRET_KEY:
    type: secret
    required: false
    description: Stripe webhook secret key (preferred over STRIPE_WEBHOOK_SECRET)
    category: Payment
    security_level: critical
    notes: 'Preferred webhook secret key name. Use this instead of STRIPE_WEBHOOK_SECRET.

      STRIPE_WEBHOOK_SECRET is deprecated and will be removed after 30-day grace period.

      '
  STRIPE_WEBHOOK_SECRET:
    type: secret
    required: false
    description: Stripe webhook secret (DEPRECATED - use STRIPE_WEBHOOK_SECRET_KEY)
    category: Payment
    security_level: critical
    notes: 'DEPRECATED: Use STRIPE_WEBHOOK_SECRET_KEY instead.

      This key is maintained for backward compatibility during 30-day migration period.

      Support ends: 2025-11-30

      '
  TEST_ADMIN_JWT:
    type: secret
    required: false
    description: JWT token for E2E tests
    category: Testing
    security_level: secret
  RLS_TESTS_ALLOWED:
    type: boolean
    required: false
    default: false
    description: Enable RLS (Row Level Security) tests with real user JWTs (MUST be true to run RLS tests)
    category: Testing
    security_level: critical
    notes: 'WARNING: Must be explicitly set to true to run RLS tests.

      This prevents accidental execution of destructive RLS tests against production.

      Used in conjunction with TEST_SUPABASE_URL for environment validation.

      '
  TEST_SUPABASE_URL:
    type: url
    required: false
    description: Whitelisted Supabase URL for RLS testing (must match SUPABASE_URL exactly)
    category: Testing
    security_level: public
    example: https://xxxxx.supabase.co
    notes: 'Required for RLS tests. Must exactly match SUPABASE_URL.

      This whitelists the allowed test environment to prevent running against production.

      RLS tests will skip if SUPABASE_URL does not match this value.

      '
  IDEMPOTENCY_TESTS_ALLOWED:
    type: boolean
    required: false
    default: false
    description: Enable migration idempotency tests (static analysis of SQL migrations)
    category: Testing
    security_level: public
    notes: 'When set to true, allows migration idempotency tests to run.

      These tests perform static analysis of SQL migration files to verify:

      - Idempotent SQL syntax (IF NOT EXISTS, CREATE OR REPLACE, etc.)

      - No duplicate migration numbers

      - Proper transaction handling

      - Rollback documentation exists

      Does NOT connect to database or execute migrations.

      '
  TOTP_ENCRYPTION_KEY:
    type: secret
    required: true
    min_length: 32
    description: Fernet encryption key for TOTP secrets (Base64-encoded, AES-128-CBC
      + HMAC-SHA256)
    category: Security
    security_level: critical
    notes: 'Required for 2FA/TOTP functionality. Generate with:

      python -c ''from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())''

      '
  ENABLE_MOCK_USERS:
    type: boolean
    required: false
    default: false
    description: Enable mock users for development/testing (MUST be false in production)
    category: Feature Flags
    security_level: critical
    notes: 'WARNING: Must be false in production and staging environments.

      When true, allows authentication with hardcoded mock users (owner@morningai.com,
      admin@morningai.com).

      Production validation will fail if this is enabled.

      '
  ENABLE_ORCHESTRATOR:
    type: boolean
    required: false
    default: true
    description: Enable orchestrator/agent routes (set to false in CI/E2E to bypass Redis/TLS dependencies)
    category: Feature Flags
    security_level: public
    notes: 'Controls whether orchestrator/agent routes are loaded and registered.

      - true (default): Agent routes enabled for production use

      - false: Agent routes disabled (used in CI/E2E tests to avoid Redis TLS requirements)

      When disabled, only core authentication and application routes are available.

      '
  USE_LANGGRAPH:
    type: boolean
    required: false
    default: false
    description: 'Enable LangGraph orchestrator mode (default: simple mode)'
    category: Feature Flags
    security_level: public
    notes: 'Controls orchestrator execution mode:

      - false (default): Simple mode for faster response

      - true: LangGraph mode with full stateful workflow and retry logic

      '
  USE_LANGGRAPH_PERCENT:
    type: integer
    required: false
    default: 0
    min: 0
    max: 100
    description: Percentage of tasks to use LangGraph mode (0-100, for canary rollout)
    category: Feature Flags
    security_level: public
    notes: 'Canary rollout mechanism for LangGraph. Takes precedence over USE_LANGGRAPH.

      Example: 15 = 15% of tasks use LangGraph, 85% use simple mode.

      Recommended rollout phases (see ADR-005):

      - Phase 1: 5% (baseline metrics)

      - Phase 2: 15% (staging validation)

      - Phase 3: 25% (expanded canary)

      - Phase 4: 50% (majority traffic)

      - Phase 5: 100% (full rollout)

      '
    environment_specific:
      development: 0
      staging: 15
      production: 0
  USE_LANGGRAPH_FOR_FAQ:
    type: boolean
    required: false
    default: false
    description: Enable LangGraph mode for FAQ tasks (default false to preserve low latency)
    category: Feature Flags
    security_level: public
    notes: 'FAQ tasks bypass LangGraph by default due to latency requirements.

      Set to true to experiment with LangGraph for FAQ generation.

      Only effective when USE_LANGGRAPH=true or USE_LANGGRAPH_PERCENT>0.

      '
  USE_LLM_PLANNER:
    type: boolean
    required: false
    default: false
    description: Enable LLM-powered planner in LangGraph orchestrator (Phase 1)
    category: Feature Flags
    security_level: public
    notes: 'Controls whether the planner node uses LLM for dynamic planning:

      - false (default): Static planning (hardcoded steps)

      - true: LLM-powered dynamic planning (GPT-4 generates execution steps)

      Requires OPENAI_API_KEY to be set for LLM operations.

      Only effective when USE_LANGGRAPH=true or USE_LANGGRAPH_PERCENT>0.

      '
  USE_LLM_REVIEWER:
    type: boolean
    required: false
    default: false
    description: Enable LLM-powered reviewer in LangGraph orchestrator (Phase 6 PR-3)
    category: Orchestrator
    security_level: low
    notes: 'Controls whether the reviewer node uses LLM for code review:

      - false (default): CI-only review (based on CI state)

      - true: LLM-powered review with A/B testing support (OpenAI vs Gemini)

      LLM review provides risk assessment based on PR metadata and CI status.

      CI score acts as ceiling - LLM cannot claim higher quality than CI.

      Graceful fallback to CI-only review if LLM unavailable.

      '
  REASONING_MODE_ENABLED:
    type: boolean
    required: false
    default: false
    description: Enable reasoning mode (thinking_level=high) for Gemini 3 models in planner and reviewer (Phase 3)
    category: Orchestrator
    security_level: low
    notes: 'Controls the thinking_level for Gemini 3 models:

      - false (default): Use thinking_level=low for faster responses

      - true: Use thinking_level=high for deep reasoning (opt-in)

      Deep reasoning mode increases latency but may improve quality for complex tasks.

      Only affects Gemini 3 provider; OpenAI provider ignores this setting.

      '
  DISABLE_GEMINI3:
    type: boolean
    required: false
    default: false
    description: Emergency kill switch to disable all Gemini 3 experiments (Phase 4)
    category: Orchestrator
    security_level: low
    notes: 'Emergency rollback mechanism for Gemini 3 experiments:

      - false (default): Gemini 3 experiments run normally based on treatment_percent

      - true: All Gemini 3 traffic goes to control group (OpenAI)

      Use this for immediate rollback if Gemini 3 causes issues in production.

      Does not require code deployment - just set the environment variable.

      '
  SECURITY_ENFORCEMENT_MODE:
    type: string
    required: false
    default: advisory
    description: Security policy enforcement mode for advisory nodes in LangGraph orchestrator
    category: Orchestrator
    security_level: low
    choices:
      - advisory
      - block_critical
      - block_high
      - block_all
    notes: 'Controls how security/governance advisory nodes enforce policy violations:

      - advisory (default): Log and record violations but never block execution

      - block_critical: Block tasks with critical risk level from any advisor

      - block_high: Block tasks with high or critical risk level

      - block_all: Block tasks with any non-info risk level (most restrictive)

      Recommended rollout strategy:

      1. Start with advisory mode in Production (current behavior)

      2. Enable block_critical in Staging to validate enforcement logic

      3. After 1-2 weeks of stable Staging, enable block_critical in Production

      4. Gradually increase to block_high as confidence grows

      Affects: security_advisor, governance_advisor, cost_advisor, permission_advisor, reputation_advisor nodes.

      '
  REVIEWER_JSON_MODE:
    type: boolean
    required: false
    default: true
    description: Enable JSON mode for LLM reviewer (ensures valid JSON responses)
    category: Orchestrator
    security_level: low
    notes: 'Controls JSON mode for LLM reviewer responses:

      - true (default): Use OpenAI JSON mode for structured responses

      - false: Allow free-form responses with JSON parsing/repair

      JSON mode is recommended for reliable structured output.

      '
  PLANNER_EVENTS_STORAGE:
    type: string
    required: false
    default: db
    description: Storage backend for planner events (db or jsonl)
    category: Monitoring
    security_level: public
    choices:
    - db
    - jsonl
    notes: 'Controls where planner events are stored:

      - db: Store in Supabase database (persistent, production)

      - jsonl: Store in local JSONL file (ephemeral, local dev)

      Database storage is recommended for production to persist data across pod restarts.

      JSONL storage is maintained for backward compatibility and local development.

      '
  USE_CODE_GENERATION:
    type: boolean
    required: false
    default: false
    description: Enable AI-powered code generation workflow (Phase 2)
    category: Feature Flags
    security_level: public
    notes: 'Controls whether the code generation workflow is enabled:

      - false (default): Code generation workflow disabled

      - true: Enable LLM-powered code generation with security validation

      Requires OPENAI_API_KEY to be set for LLM operations.

      '
  USE_CODEGEN_WORKFLOW_PERCENT:
    type: integer
    required: false
    default: 0
    min: 0
    max: 100
    description: Percentage of tasks to use code generation workflow (0-100, for canary rollout)
    category: Feature Flags
    security_level: public
    notes: 'Canary rollout mechanism for code generation workflow. Takes precedence over USE_CODE_GENERATION.

      Example: 10 = 10% of tasks use code generation, 90% use standard workflow.

      Uses same MD5 hash routing as USE_LANGGRAPH_PERCENT for deterministic task assignment.

      '
  ENABLE_PROJECT_ENGINEER_CODEGEN:
    type: boolean
    required: false
    default: false
    description: Enable ProjectEngineerAgent code generation execution mode (Phase 2 Step C)
    category: Feature Flags
    security_level: public
    notes: 'Controls whether ProjectEngineerAgent can execute code generation:

      - false (default): Analysis-only mode, tasks are classified but not executed

      - true: Execution mode, safe tasks trigger CodeGenerationWorkflow

      Requires dev_agent to be provided to ProjectEngineerAgent constructor.

      Only affects safe tasks (documentation_update, test_generation).

      Unsafe tasks are always skipped regardless of this setting.

      '
  ENABLE_PROJECT_ENGINEER_FIXER:
    type: boolean
    required: false
    default: false
    description: Enable ProjectEngineerAgent auto-fix mode in fixer_node (Phase 2 Step C Fixer Node)
    category: Feature Flags
    security_level: public
    notes: 'Controls whether fixer_node can use ProjectEngineerAgent for auto-fix:

      - false (default): Fixer node only increments retry count, no auto-fix

      - true: Fixer node uses ReviewerAgent + ProjectEngineerAgent to auto-fix CI failures

      Dependencies: Requires ENABLE_PROJECT_ENGINEER_CODEGEN=true to actually execute fixes.

      Recommended rollout:

      - Staging: true (with PROJECT_ENGINEER_FIXER_PERCENT=5-10)

      - Production: false initially, then true after staging validation

      Use PROJECT_ENGINEER_FIXER_PERCENT for canary rollout.

      '
  ENABLE_FAILURE_LEARNING_CONTEXT:
    type: boolean
    required: false
    default: true
    description: Enable querying past failures for learning context in Planner (Phase 2 Observer Node)
    category: Feature Flags
    security_level: public
    notes: 'Controls whether the Planner queries past failures for learning context:

      - true (default): Planner includes past failure context in prompts

      - false: Planner skips failure learning context (useful for debugging or reducing latency)

      When enabled, the Observer Node queries similar past failures and includes
      relevant error-fix pairs in the Planner prompt to help avoid repeating mistakes.

      '
  ENABLE_META_AGENT:
    type: boolean
    required: false
    default: false
    description: Enable Meta Agent autonomous execution path via webhooks (#1822 Integrated Development Tools)
    category: Feature Flags
    security_level: public
    notes: 'Controls Meta Agent integration for end-to-end autonomous execution:

      - false (default): Webhooks use standard orchestrator task flow

      - true: Webhooks can route tasks to Meta Agent via run_meta_agent_task

      When enabled, webhook handlers can use the meta_agent task type to route
      tasks through AutonomousExecutor for full autonomous execution including
      VM provisioning, VS Code IDE integration, and confidence scoring.

      Dependencies: None (VM provisioning requires ENABLE_META_AGENT_VM=true)

      Recommended rollout:

      - Staging: true (for testing end-to-end flow)

      - Production: false initially, then true after staging validation

      '
  ENABLE_META_AGENT_VM:
    type: boolean
    required: false
    default: false
    description: Enable VM provisioning for Meta Agent isolated execution (requires ENABLE_META_AGENT=true)
    category: Feature Flags
    security_level: public
    notes: 'Controls VM provisioning for Meta Agent:

      - false (default): Meta Agent runs in local mode without VM isolation

      - true: Meta Agent provisions isolated VMs for task execution

      Dependencies: Requires ENABLE_META_AGENT=true to have any effect.

      VM provider is controlled by META_AGENT_VM_PROVIDER setting.

      '
  META_AGENT_VM_PROVIDER:
    type: string
    required: false
    default: local
    description: VM provider for Meta Agent isolated execution
    category: Feature Flags
    security_level: public
    notes: 'Specifies the VM provider when ENABLE_META_AGENT_VM=true:

      - local (default): Run tasks locally without VM isolation

      - docker: Use Docker containers for isolation

      - fly: Use Fly.io VMs for cloud-based isolation

      Dependencies: Only effective when ENABLE_META_AGENT_VM=true.

      '
  ENABLE_DEEPWIKI:
    type: boolean
    required: false
    default: false
    description: Enable DeepWiki knowledge base service for code query and session insights (#1824 DeepWiki 知識庫)
    category: Feature Flags
    security_level: public
    notes: 'Controls DeepWiki knowledge base service:

      - false (default): DeepWiki service is disabled

      - true: DeepWiki service is enabled for code query and session insights

      When enabled, DeepWiki provides:

      - Code question answering using Knowledge Graph patterns

      - Error lookup from past failure records

      - Session insights analysis

      - Improvement suggestions based on execution history

      Dependencies: Works best with ENABLE_FAILURE_LEARNING_CONTEXT=true and ENABLE_KNOWLEDGE_GRAPH_LEARNING=true.

      '
  DEEPWIKI_MAX_SOURCES:
    type: integer
    required: false
    default: 5
    min: 1
    max: 20
    description: Maximum number of knowledge sources to include in DeepWiki query results (1-20, default 5)
    category: Feature Flags
    security_level: public
    notes: 'Controls the number of sources returned in DeepWiki queries.

      Higher values provide more context but increase response size and latency.

      Recommended: 3-5 for most use cases, up to 10 for detailed analysis.

      '
  ENABLE_AGENT_EVAL:
    type: boolean
    required: false
    default: true
    description: Enable agent evaluation metrics collection and capability regression detection (Phase 2 #1813)
    category: Feature Flags
    security_level: public
    notes: 'Controls agent evaluation integration:

      - true (default): Collect metrics and detect capability regression

      - false: Disable evaluation (useful for debugging or reducing overhead)

      '
  AGENT_EVAL_SUCCESS_RATE_THRESHOLD:
    type: float
    required: false
    default: 70.0
    min: 0.0
    max: 100.0
    description: Minimum success rate threshold for capability regression detection (0-100, default 70%)
    category: Agent Evaluation
    security_level: public
  AGENT_EVAL_CI_PASS_RATE_THRESHOLD:
    type: float
    required: false
    default: 80.0
    min: 0.0
    max: 100.0
    description: Minimum CI pass rate threshold for capability regression detection (0-100, default 80%)
    category: Agent Evaluation
    security_level: public
  AGENT_EVAL_FIXER_SUCCESS_THRESHOLD:
    type: float
    required: false
    default: 50.0
    min: 0.0
    max: 100.0
    description: Minimum fixer success rate threshold for self-healing detection (0-100, default 50%)
    category: Agent Evaluation
    security_level: public
  AGENT_EVAL_BASELINE_SAMPLE_SIZE:
    type: integer
    required: false
    default: 50
    min: 10
    max: 1000
    description: Number of recent metrics to use for baseline comparison (10-1000, default 50)
    category: Agent Evaluation
    security_level: public
  AGENT_EVAL_REGRESSION_ALERT_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable alerts when capability regression is detected
    category: Agent Evaluation
    security_level: public
  PROJECT_ENGINEER_FIXER_PERCENT:
    type: integer
    required: false
    default: 0
    min: 0
    max: 100
    description: Percentage of tasks to use auto-fix in fixer_node (0-100, for canary rollout)
    category: Feature Flags
    security_level: public
    notes: 'Canary rollout mechanism for auto-fix in fixer_node.

      Example: 10 = 10% of tasks use auto-fix, 90% use standard retry.

      Uses MD5 hash routing based on trace_id/pr_number for deterministic task assignment.

      Dependencies: Only effective when ENABLE_PROJECT_ENGINEER_FIXER=true.

      Recommended values:

      - Staging: 5-10 (start with 5-10% canary)

      - Production: 0 initially, then gradually increase (5 -> 10 -> 25 -> 50 -> 100)

      Max retries: Fixer node will retry up to MAX_FIXER_RETRIES (default 3) times before giving up.

      '
  AUTO_FIX_ENABLED:
    type: boolean
    required: false
    default: false
    description: Master switch for auto-fix execution from AI reviewer comments (Issue #2251)
    category: Feature Flags
    security_level: public
    notes: 'Epic #2311 Phase 2: Auto-repair v1 safety mechanism.

      When enabled, AI reviewer comments can trigger automatic code fixes.

      Dependencies: Requires AUTO_FIX_CATEGORIES and rate limiting settings.

      '
  AUTO_FIX_CATEGORIES:
    type: string
    required: false
    default: "style,documentation"
    description: Comma-separated list of categories allowed for auto-fix
    category: Feature Flags
    security_level: public
    notes: 'Allowlist of comment categories that can trigger auto-fix.

      Valid values: style, documentation, bug_fix, refactor, security, performance.

      Empty string = no categories allowed (effectively disables auto-fix).

      '
  AUTO_FIX_REPOS_ALLOWLIST:
    type: string
    required: false
    default: ""
    description: Comma-separated list of repos allowed for auto-fix (empty = all repos)
    category: Feature Flags
    security_level: public
    notes: 'Repository allowlist for auto-fix execution.

      Empty string = all repos allowed.

      Example: "RC918/morningai,RC918/other-repo"

      '
  AUTO_FIX_MAX_RETRIES:
    type: integer
    required: false
    default: 3
    min: 1
    max: 10
    description: Maximum auto-fix attempts per PR (1-10, default 3)
    category: Feature Flags
    security_level: public
    notes: 'Loop protection: Prevents infinite auto-fix loops.

      After this many attempts, auto-fix is disabled for the PR.

      '
  AUTO_FIX_PER_REPO_PER_HOUR:
    type: integer
    required: false
    default: 10
    min: 1
    max: 100
    description: Maximum auto-fix attempts per repo per hour (1-100, default 10)
    category: Feature Flags
    security_level: public
    notes: 'Rate limiting: Prevents excessive auto-fix activity per repository.

      Uses Redis ZSET-based sliding window rate limiting.

      '
  AUTO_FIX_PER_PR_PER_HOUR:
    type: integer
    required: false
    default: 3
    min: 1
    max: 20
    description: Maximum auto-fix attempts per PR per hour (1-20, default 3)
    category: Feature Flags
    security_level: public
    notes: 'Rate limiting: Prevents excessive auto-fix activity per PR.

      Uses Redis ZSET-based sliding window rate limiting.

      '
  AUTO_FIX_GLOBAL_PER_HOUR:
    type: integer
    required: false
    default: 100
    min: 1
    max: 1000
    description: Maximum global auto-fix attempts per hour (1-1000, default 100)
    category: Feature Flags
    security_level: public
    notes: 'Rate limiting: Global cap on auto-fix activity.

      Uses Redis ZSET-based sliding window rate limiting.

      Fail-open: If Redis is unavailable, requests are allowed (with monitoring alert).

      '
  AUTO_FIX_CANARY_PERCENT:
    type: integer
    required: false
    default: 10
    min: 0
    max: 100
    description: Percentage of eligible auto-fix tasks to execute (0-100, for canary rollout)
    category: Feature Flags
    security_level: public
    notes: 'Canary rollout: Controls what percentage of eligible auto-fix tasks are actually executed.

      Issue #2252: Implement real auto-fix execution.

      Uses deterministic hashing so the same task_id always gets the same result.

      Set to 0 to disable auto-fix execution, 100 to enable for all eligible tasks.

      Default: 10% for initial canary rollout.

      '
  AUTO_FIX_ACTOR_NAMES:
    type: string
    required: false
    default: "morningai-bot,auto-fix-bot,github-actions[bot]"
    description: Comma-separated list of bot actor names for auto-fix loop protection
    category: Feature Flags
    security_level: public
    notes: 'Loop protection: Actor names that indicate auto-fix bot activity.

      Used to prevent infinite loops by detecting when the auto-fix bot is the actor.

      Default includes common bot names: morningai-bot, auto-fix-bot, github-actions[bot].

      '
  PROJECT_ENGINEER_TASK_TIMEOUT_SECONDS:
    type: integer
    required: false
    default: 300
    min: 30
    max: 1800
    description: Maximum execution time for ProjectEngineerAgent.run_task() in seconds
    category: Feature Flags
    security_level: public
    notes: 'Phase 3 PR-4: Agent-level timeout for ProjectEngineerAgent tasks.
    
      Default: 300 seconds (5 minutes)
      
      Range: 30-1800 seconds (30 seconds to 30 minutes)'
  PROJECT_ENGINEER_ALLOWED_REPOS:
    type: string
    required: false
    default: "RC918/morningai"
    description: Comma-separated list of allowed repositories for ProjectEngineerAgent
    category: Feature Flags
    security_level: public
    notes: 'Phase 3 PR-4: Repository whitelist for semantic task rules.
    
      Empty string = all repos allowed (not recommended for production).
      
      Example: "RC918/morningai,RC918/other-repo"'
  PROJECT_ENGINEER_ALLOWED_DIRECTORIES:
    type: string
    required: false
    default: "docs/,tests/,handoff/"
    description: Comma-separated list of allowed directory prefixes for code generation
    category: Feature Flags
    security_level: public
    notes: 'Phase 4 PR-1: Directory whitelist for semantic task rules.
    
      Empty string = all directories allowed (not recommended for production).
      
      Paths are normalized and checked for traversal attacks (../).
      
      Example: "docs/,tests/,handoff/"'
  PROJECT_ENGINEER_ALLOWED_TASK_TYPES:
    type: string
    required: false
    default: ""
    description: Comma-separated list of allowed task types for code generation (empty = all safe task types)
    category: Feature Flags
    security_level: public
    notes: 'Phase 4 PR-1: Task type whitelist for semantic task rules.
    
      Empty string = all safe task types from SAFE_TASK_TYPES are allowed.
      
      When set, only the specified task types are allowed (must also be in SAFE_TASK_TYPES).
      
      Example: "documentation_update,test_generation"'
  PROJECT_ENGINEER_ALLOWED_ACTIONS:
    type: string
    required: false
    default: ""
    description: Comma-separated list of allowed actions for agents (empty = use default whitelist)
    category: Security
    security_level: medium
    notes: 'Phase 1 Security Foundation: Action whitelist for semantic task rules.
    
      Empty string = use DEFAULT_ALLOWED_ACTIONS (read_file, write_file, create_file, list_directory, search_code, run_tests, run_lint, create_pr, add_comment, update_documentation).
      
      When set, only the specified actions are allowed.
      
      Example: "read_file,write_file,run_tests,create_pr"'
  PROJECT_ENGINEER_BLOCKED_FILES:
    type: string
    required: false
    default: ""
    description: Comma-separated list of file patterns to block from agent modification (empty = use default sensitive patterns)
    category: Security
    security_level: medium
    notes: 'Phase 1 Security Foundation: Sensitive file blocking for semantic task rules.
    
      Empty string = use SENSITIVE_FILE_PATTERNS (.env, credentials.json, secrets.yaml, private_key, etc.).
      
      When set, only the specified patterns are blocked.
      
      Supports wildcard patterns like "*.config" and exact matches like ".env".
      
      Example: ".env,.env.local,credentials.json,secrets.yaml"'
  PROJECT_ENGINEER_REQUIRE_HITL_HIGH_RISK:
    type: boolean
    required: false
    default: true
    description: Require Human-in-the-Loop approval for high-risk operations (DROP TABLE, DELETE, rm -rf, etc.)
    category: Security
    security_level: critical
    notes: 'Phase 1 Security Foundation: HITL requirement for high-risk operations.
    
      When true (default), high-risk operations like DROP TABLE, DELETE FROM, rm -rf, etc. require manual approval.
      
      When false, high-risk operations are logged but allowed (NOT RECOMMENDED for production).
      
      High-risk patterns: DROP TABLE, DROP DATABASE, DELETE FROM, TRUNCATE, ALTER TABLE, rm -rf, rm -r, sudo rm, chmod 777, chown'
