    security_level: public

  
  PHASE7_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Phase 7 components
    category: Feature Flags
    security_level: public
    
  OPS_AGENT_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Ops Agent functionality
    category: Feature Flags
    security_level: public
    
  GROWTH_STRATEGIST_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Growth Strategist agent
    category: Feature Flags
    security_level: public
    
  PM_AGENT_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable PM Agent functionality
    category: Feature Flags
    security_level: public
    
  HITL_APPROVAL_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable HITL (Human-in-the-Loop) approval system
    category: Feature Flags
    security_level: public
    
  DEMO_MODE:
    type: boolean
    required: false
    default: false
    description: Enable demo mode (limited functionality)
    category: Feature Flags
    security_level: public
    
  SANDBOX_ENABLED:
    type: boolean
    required: false
    default: false
    description: Enable Docker sandbox containers for agents
    category: Feature Flags
    security_level: public
    
  COOKIE_SECURE:
    type: boolean
    required: false
    default: true
    description: Enable Secure flag on authentication cookies (HTTPS-only)
    category: Security
    security_level: public
    notes: |
      When true, cookies are only sent over HTTPS connections.
      Defaults to true in production, false in development.
      Required to be true when COOKIE_SAMESITE=None (browser requirement).
  
  COOKIE_SAMESITE:
    type: string
    required: false
    default: Lax
    description: SameSite attribute for authentication cookies
    category: Security
    security_level: public
    choices: [Strict, Lax, None]
    notes: |
      Controls when cookies are sent on cross-site requests.
      - Strict: Cookies only sent on same-site requests (most secure)
      - Lax: Cookies sent on top-level navigation (default, balanced)
      - None: Cookies sent on all requests (requires COOKIE_SECURE=true)
      For cross-domain deployments (e.g., Staging), use None with COOKIE_SECURE=true.
  
  FEATURE_2FA_ENABLED:
    type: boolean
    required: false
    default: true
    description: Enable Two-Factor Authentication (2FA/TOTP) feature
    category: Feature Flags
    security_level: public
  
  FEATURE_2FA_PREAUTH:
    type: boolean
    required: false
    default: false
    description: Enable Pre-Auth Token for 2FA (Week 1 - reduces password transmission)
    category: Feature Flags
    security_level: public
    notes: |
      When enabled, password is only transmitted once during login.
      2FA verification uses a short-lived pre-auth token instead of password.
      Reduces password exposure risk by 50%.
  
  PREAUTH_TOKEN_TTL:
    type: integer
    required: false
    default: 300
    description: Pre-Auth Token TTL in seconds (5 minutes default)
    category: Feature Flags
    security_level: public
    notes: |
      Time-to-live for pre-auth tokens in seconds.
      Tokens automatically expire after this duration.
      Recommended: 300 seconds (5 minutes).
      Protected by @rate_limit decorator on verify endpoint.

  
  VITE_API_BASE_URL:
