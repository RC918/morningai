version: '1.0'
description: 'Morning AI Phase 11 Complete Environment Schema'
metadata:
  total_variables: 85
  required_variables: 19
  optional_variables: 66
  last_updated: '2025-11-08'

fields:
  
  JWT_SECRET_KEY:
    type: secret
    required: true
    min_length: 32
    description: JWT token signing key for authentication
    category: Authentication
    security_level: critical
    
  ADMIN_PASSWORD:
    type: secret
    required: true
    description: Admin user password for system access
    category: Authentication
    security_level: critical
    
  FLASK_SECRET_KEY:
    type: secret
    required: false
    min_length: 32
    description: Flask application secret key for sessions (preferred over SECRET_KEY)
    category: Security
    security_level: critical
    notes: |
      Preferred secret key name. Use this instead of SECRET_KEY.
      SECRET_KEY is deprecated and will be removed after 30-day grace period.
    
  SECRET_KEY:
    type: secret
    required: true
    min_length: 32
    description: Application secret key for Flask sessions (DEPRECATED - use FLASK_SECRET_KEY)
    category: Security
    security_level: critical
    notes: |
      DEPRECATED: Use FLASK_SECRET_KEY instead.
      This key is maintained for backward compatibility during 30-day migration period.
      Support ends: 2025-11-30
    
  ENCRYPTION_MASTER_KEY:
    type: secret
    required: false
    min_length: 32
    description: Master encryption key for sensitive data (preferred over MASTER_KEY)
    category: Security
    security_level: critical
    notes: |
      Preferred master key name. Use this instead of MASTER_KEY.
      MASTER_KEY is deprecated and will be removed after 30-day grace period.
    
  MASTER_KEY:
    type: secret
    required: false
    description: Master encryption key for sensitive data (DEPRECATED - use ENCRYPTION_MASTER_KEY)
    category: Security
    security_level: critical
    notes: |
      DEPRECATED: Use ENCRYPTION_MASTER_KEY instead.
      This key is maintained for backward compatibility during 30-day migration period.
      Support ends: 2025-11-30

  
  DATABASE_URL:
    type: url
    required: true
    description: PostgreSQL database connection URL
    category: Database
    security_level: secret
    example: postgresql://user:pass@host:5432/dbname
    
  REDIS_URL:
    type: url
    required: false
    default: redis://localhost:6379/0
    description: Redis connection URL for queue and caching. Use rediss:// (double 's') for TLS-encrypted connections. For production, use UPSTASH_REDIS_REST_URL (HTTPS/TLS by default)
    category: Database
    security_level: secret
    example: redis://localhost:6379/0
    example_tls: rediss://user:pass@host:6380/0
    notes: |
      - Non-TLS: redis://localhost:6379/0
      - TLS: rediss://user:pass@host:6380/0
      - Recommendation: Use UPSTASH_REDIS_REST_URL for production (HTTPS/TLS by default)
    
  MEMORY_TABLE:
    type: string
    required: false
    default: memory
    description: Supabase memory table name for vector storage
    category: Database
    security_level: public

  
  SUPABASE_URL:
