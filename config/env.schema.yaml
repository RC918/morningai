  ORCHESTRATOR_CORS_ORIGINS:
    type: string
    required: false
    default: http://localhost:5173
    description: CORS allowed origins for orchestrator API (comma-separated)
    category: Application
    security_level: public
  VSCODE_IFRAME_ALLOWED_ORIGINS:
    type: string
    required: false
    default: ''
    description: Comma-separated list of origins allowed to embed VSCode IDE in iframe (e.g., 'https://app.morningai.com,https://staging.morningai.com'). Empty means iframe embedding is disabled.
    category: Application
    security_level: public
    notes: |
      Controls which origins can embed the VSCode IDE in an iframe via Content-Security-Policy frame-ancestors.
      - Empty string (default): iframe embedding is disabled
      - Comma-separated origins: only these origins can embed the IDE
      - Never use '*' for security reasons
      
      The proxy layer should use this value to set appropriate headers:
      - Content-Security-Policy: frame-ancestors 'self' {origins}
      - X-Frame-Options: ALLOW-FROM {origin} (for single origin)
  VSCODE_PUBLIC_BASE_URL:
    type: url
    required: false
    default: null
    description: Public base URL for VSCode IDE access (e.g., 'https://ide.morningai.com'). If not set, uses internal localhost URL.
    category: Application
    security_level: public
    notes: |
      Used to construct the public URL for IDE access when embedding in iframe.
      If not set, the internal localhost URL (http://localhost:8443) is used.
      This should be set to the public-facing URL that the reverse proxy exposes.
  VSCODE_DEFAULT_EXTENSIONS:
    type: string
    required: false
    default: ''
    description: Comma-separated list of VS Code extension IDs to auto-install for all VSCode IDE sessions (e.g., 'ms-python.python,esbenp.prettier-vscode'). Empty string disables auto-install.
    category: Application
    security_level: public
    notes: |
      Controls which VS Code extensions are automatically installed when a new IDE session starts.
      - Empty string (default): no extensions are auto-installed
      - Comma-separated extension IDs: these extensions will be installed via `code-server --install-extension`
      
      Common extension IDs:
      - ms-python.python: Python language support
      - esbenp.prettier-vscode: Prettier code formatter
      - dbaeumer.vscode-eslint: ESLint JavaScript linter
      - ms-toolsai.jupyter: Jupyter notebook support
      
      Extension installation is best-effort and non-blocking; failures are logged but don't prevent session initialization.
      Per-task extensions can be added via session.metadata["extra_extensions"].
  ORCHESTRATOR_SHUTDOWN_TIMEOUT:
    type: integer
    required: false
    default: 30
    description: Graceful shutdown timeout in seconds
    category: Infrastructure
    security_level: public
  ORCHESTRATOR_TEST_MODE:
    type: boolean
    required: false
    default: false
    description: Enable orchestrator test mode
    category: Testing
    security_level: public
  ORCHESTRATOR_DRY_RUN:
    type: boolean
    required: false
    default: false
    description: Skip PR creation in orchestrator, return synthetic results. Use in staging to avoid PR bombing.
    category: Testing
    security_level: public
    notes: 'When enabled, the orchestrator will skip all GitHub operations (branch creation, commits, PR creation) and return synthetic results instead. This is useful for staging environments to test the orchestrator pipeline without creating real PRs. Set ORCHESTRATOR_DRY_RUN=true in staging to prevent PR bombing during testing.'
    environment_specific:
      production: false
      staging: true
      development: false
  ORCHESTRATOR_DOCS_MAX_PRS_PER_HOUR:
    type: integer
    required: false
    default: 3
    description: Maximum number of documentation PRs the orchestrator can create per hour. Rate limiting to prevent PR flooding.
    category: Orchestrator
    security_level: public
    notes: 'Rate limiting for auto-generated documentation PRs. Prevents incidents like conflicting FAQ PRs (#2090-#2099). Works with topic slug generation and content validation to ensure quality control.'
  USE_REDIS_CHECKPOINTER:
    type: boolean
    required: false
    default: false
    description: Use Redis-based checkpointer for LangGraph state persistence instead of in-memory MemorySaver. Enables cross-process state recovery.
    category: Infrastructure
    security_level: public
    notes: 'When enabled, LangGraph workflow state is persisted to Redis instead of in-memory storage. This allows state recovery after process restarts and enables distributed workflows. Requires REDIS_URL to be configured. Uses langgraph-checkpoint-redis package.'
    environment_specific:
      production: true
      staging: true
      development: false
  REDIS_CHECKPOINTER_TTL:
    type: integer
    required: false
    default: 86400
    description: TTL in seconds for Redis checkpointer entries (default 24 hours). Set to 0 for no expiration.
    category: Infrastructure
    security_level: public
    notes: 'Controls how long LangGraph checkpoint data is retained in Redis. Default is 86400 seconds (24 hours). Set to 0 to disable expiration (not recommended for production). Lower values reduce Redis memory usage but may cause issues with long-running workflows.'
  RQ_MAX_JOBS:
    type: integer
    required: false
    default: 0
    description: Max jobs before worker restart for memory management (0 = unlimited). Recommended 10-20 for LangGraph workloads.
    category: Infrastructure
    security_level: public
    notes: 'Worker will exit after processing this many jobs, allowing container orchestrator to restart. This helps prevent memory accumulation from LangGraph MemorySaver checkpoints. Set to 0 or leave unset to disable (process unlimited jobs). Recommended: 10-20 for LangGraph workloads to prevent OOM.'
    environment_specific:
      production: 15
      staging: 15
      development: 0
  WORKER_HEARTBEAT_INTERVAL:
    type: integer
    required: false
    default: 60
    description: Worker heartbeat interval in seconds. Optimized to reduce Redis command volume.
    category: Infrastructure
    security_level: public
    notes: 'Controls how often the worker sends heartbeat updates to Redis. Default is 60 seconds (reduced from 30s to cut Redis commands by 50%). Lower values provide faster detection of dead workers but increase Redis load.'
  WORKER_HEARTBEAT_TTL:
    type: integer
    required: false
    default: 180
    description: Worker heartbeat key TTL in seconds. Should be at least 3x the interval for safety margin.
    category: Infrastructure
    security_level: public
    notes: 'Controls how long a worker heartbeat key remains in Redis before expiring. Default is 180 seconds (3x the interval). If a worker fails to update its heartbeat within this time, it will be considered dead. Must be greater than WORKER_HEARTBEAT_INTERVAL.'
  RATE_LIMIT_REQUESTS:
    type: integer
    required: false
    default: 100
    description: Maximum requests per window
    category: Application
    security_level: public
  RATE_LIMIT_WINDOW:
    type: integer
