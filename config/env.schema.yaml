    description: Maximum Redis connection retries for rate limiting
    category: Application
    security_level: public
  RATE_LIMIT_REDIS_RETRY_DELAY:
    type: integer
    required: false
    default: 1
    description: Delay between Redis retries in seconds
    category: Application
    security_level: public
  ENABLE_RATE_LIMIT_IN_TESTS:
    type: boolean
    required: false
    default: false
    description: Enable rate limiting in test environment (default false - rate limiting
      disabled in tests)
    category: Testing
    security_level: public
    notes: 'When false (default), rate limiting is bypassed in tests to prevent 429
      errors from interfering with validation tests.

      Set to true only in tests that specifically test rate limiting behavior.

      '
