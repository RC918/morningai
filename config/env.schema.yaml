  TOTP_ENCRYPTION_KEY:
    type: secret
    required: true
    min_length: 32
    description: Fernet encryption key for TOTP secrets (Base64-encoded, AES-128-CBC + HMAC-SHA256)
    category: Security
    security_level: critical
    notes: |
      Required for 2FA/TOTP functionality. Generate with:
      python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
  
  ENABLE_MOCK_USERS:
    type: boolean
    required: false
    default: false
    description: Enable mock users for development/testing (MUST be false in production)
    category: Feature Flags
    security_level: critical
    notes: |
      WARNING: Must be false in production and staging environments.
      When true, allows authentication with hardcoded mock users (owner@morningai.com, admin@morningai.com).
      Production validation will fail if this is enabled.

  
  USE_LANGGRAPH:
    type: boolean
    required: false
    default: false
    description: "Enable LangGraph orchestrator mode (default: simple mode)"
    category: Feature Flags
    security_level: public
    notes: |
      Controls orchestrator execution mode:
      - false (default): Simple mode for faster response
      - true: LangGraph mode with full stateful workflow and retry logic
  
  USE_LANGGRAPH_PERCENT:
    type: integer
    required: false
    default: 0
    min: 0
    max: 100
    description: Percentage of tasks to use LangGraph mode (0-100, for canary rollout)
    category: Feature Flags
    security_level: public
    notes: |
      Canary rollout mechanism for LangGraph. Takes precedence over USE_LANGGRAPH.
      Example: 5 = 5% of tasks use LangGraph, 95% use simple mode.

  
