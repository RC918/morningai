validation_rules:
  - rule: 'production flags must have rollout_percentage <= 100'
    severity: 'error'
  - rule: 'experimental flags cannot be enabled in production'
    severity: 'error'
  - rule: 'dependencies must be enabled before dependent flags'
    severity: 'error'
  - rule: 'deferred flags must have status: deferred'
    severity: 'warning'

rollout_strategy:
  canary:
    description: 'Gradual rollout starting with 1% of users'
    stages:
      - percentage: 1
        duration_hours: 24
      - percentage: 10
        duration_hours: 48
      - percentage: 50
        duration_hours: 72
      - percentage: 100
        duration_hours: 0
  
  blue_green:
    description: 'Switch between two identical environments'
    strategy: 'instant_switch'
  
  feature_branch:
    description: 'Feature development in isolated branches'
    merge_strategy: 'squad_approval_required'

squads:
  mvp_squad:
    name: 'MVP Squad'
    focus: 'Agent MVP development'
    issues: ['#760', '#768', '#762']
    members: []
    
  owner_console_squad:
    name: 'Owner Console Squad'
    focus: 'Owner Console development'
    issues: ['#767', '#774']
    members: []
    
  platform_squad:
    name: 'Platform Squad'
    focus: 'Platform maintenance and enhancement'
    issues: ['#855', '#851']
    members: []

monitoring:
  flag_change_notification:
    enabled: true
    channels: ['slack', 'email']
  
  rollout_monitoring:
    enabled: true
    metrics: ['error_rate', 'latency', 'user_satisfaction']
    alert_threshold:
      error_rate_increase: 10  # percent
      latency_increase: 20  # percent
  
  audit_logging:
    enabled: true
    retention_days: 90
