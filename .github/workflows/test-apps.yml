name: App Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/**'
      - '.github/workflows/test-apps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/**'
      - '.github/workflows/test-apps.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-api-backend:
    name: API Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: handoff/20250928/40_App/api-backend
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y jwt || true
          pip install pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Verify PyJWT installation
        run: |
          # Assert that we have PyJWT (not jwt) installed
          python -c "import jwt; assert hasattr(jwt, 'decode'), 'Wrong jwt package installed - need PyJWT, not jwt'"
          # Fail if the wrong jwt package is installed
          pip list | grep -E '^jwt ' && echo "ERROR: Wrong jwt package detected" && exit 1 || true
          echo "PyJWT verification passed"
      
      - name: Run API Backend tests (development mode)
        working-directory: handoff/20250928/40_App/api-backend
        run: |
          pytest tests/ -v --tb=short --disable-warnings -k "not test_vercel_preview_blocked_in_production"
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}/handoff/20250928/40_App/api-backend
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
          TESTING: true
          ENVIRONMENT: development  # Set to development to allow ENABLE_MOCK_USERS in tests
          ENABLE_MOCK_USERS: 'true'  # Mock users allowed in development environment for testing
          RATE_LIMIT_REQUESTS: 60

      - name: Run API Backend tests (production mode)
        working-directory: handoff/20250928/40_App/api-backend
        run: |
          pytest tests/test_cors_config.py::TestCORSHeadersMiddleware::test_vercel_preview_blocked_in_production -v --tb=short --disable-warnings
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}/handoff/20250928/40_App/api-backend
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
          TESTING: true
          ENVIRONMENT: production  # Production mode for production-specific test
          ENABLE_MOCK_USERS: 'false'  # Mock users disabled in production
          RATE_LIMIT_REQUESTS: 60
  
  test-orchestrator:
    name: Orchestrator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: handoff/20250928/40_App/orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-timeout PyYAML
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          # Install orchestrator package with all dependencies (including langgraph)
          pip install -e .
      
      - name: Run Orchestrator tests with coverage
        working-directory: handoff/20250928/40_App/orchestrator
        run: |
          pytest tests/ -v --tb=short --disable-warnings --cov=. --cov-report=xml --cov-report=json --cov-report=term-missing --cov-fail-under=50
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App/orchestrator:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}/handoff/20250928/40_App/api-backend:${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
      
      - name: Upload Orchestrator coverage report
        uses: actions/upload-artifact@v6
        with:
          name: orchestrator-coverage
          path: |
            handoff/20250928/40_App/orchestrator/coverage.xml
            handoff/20250928/40_App/orchestrator/coverage.json
          retention-days: 30
      
      - name: Comment PR with Orchestrator coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read coverage JSON
            const coveragePath = path.join(process.cwd(), 'handoff/20250928/40_App/orchestrator/coverage.json');
            let coverage;
            try {
              coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            } catch (e) {
              console.log('Could not read coverage.json:', e.message);
              return;
            }
            
            const totals = coverage.totals;
            const threshold = 50;
            
            // Helper functions
            const getStatus = (pct) => pct >= threshold ? '✅' : '❌';
            
            // Build comment
            const comment = `## 📊 Orchestrator 測試覆蓋率報告
            
            | 指標 | 覆蓋率 | 狀態 |
            |------|--------|------|
            | Lines | ${totals.percent_covered.toFixed(2)}% | ${getStatus(totals.percent_covered)} |
            | Covered Lines | ${totals.covered_lines} / ${totals.num_statements} | - |
            | Missing Lines | ${totals.missing_lines} | - |
            
            **門檻要求**: ${threshold}% 最低標準
            
            ${totals.percent_covered >= threshold 
              ? '✅ **覆蓋率門檻已達標！**' 
              : '❌ **覆蓋率未達標，請補充測試。**'}
            
            ---
            
            [查看完整覆蓋率報告](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Orchestrator 測試覆蓋率報告')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
  
  test-frontend-dashboard:
    name: Frontend Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Create environment files for smoke tests
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: |
          touch .env.production .env.local
          mkdir -p dist
      
      - name: Run Frontend Dashboard tests
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: |
          # Frontend dashboard uses test:smoke instead of test
          if grep -q '"test":' package.json; then
            pnpm test
          elif grep -q '"test:smoke":' package.json; then
            pnpm test:smoke
          else
            echo "No test script found, skipping tests"
          fi
      
      - name: Run ESLint
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: pnpm lint
      
      - name: Build Frontend Dashboard
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: pnpm build
  
  test-owner-console:
    name: Owner Console Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/owner-console
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Create environment files for smoke tests
        working-directory: handoff/20250928/40_App/owner-console
        run: |
          touch .env.production .env.local
          mkdir -p dist
      
      - name: Run Owner Console tests
        working-directory: handoff/20250928/40_App/owner-console
        run: |
          # Owner console uses test:smoke instead of test
          if grep -q '"test":' package.json; then
            pnpm test
          elif grep -q '"test:smoke":' package.json; then
            pnpm test:smoke
          else
            echo "No test script found, skipping tests"
          fi
      
      - name: Run ESLint
        working-directory: handoff/20250928/40_App/owner-console
        run: pnpm lint
      
      - name: Build Owner Console
        working-directory: handoff/20250928/40_App/owner-console
        run: pnpm build
