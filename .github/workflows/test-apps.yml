name: App Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/**'
      - '.github/workflows/test-apps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/**'
      - '.github/workflows/test-apps.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-api-backend:
    name: API Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: handoff/20250928/40_App/api-backend
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y jwt || true
          pip install pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install dev/test dependencies (playwright, fakeredis, etc.) for CI tests
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Verify PyJWT installation
        run: |
          # Assert that we have PyJWT (not jwt) installed
          python -c "import jwt; assert hasattr(jwt, 'decode'), 'Wrong jwt package installed - need PyJWT, not jwt'"
          # Fail if the wrong jwt package is installed
          pip list | grep -E '^jwt ' && echo "ERROR: Wrong jwt package detected" && exit 1 || true
          echo "PyJWT verification passed"
      
      - name: Run API Backend tests (development mode)
        working-directory: handoff/20250928/40_App/api-backend
        run: |
          pytest tests/ -v --tb=short --disable-warnings -k "not test_vercel_preview_blocked_in_production"
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}/handoff/20250928/40_App/api-backend:${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
          TESTING: true
          ENVIRONMENT: development  # Set to development to allow ENABLE_MOCK_USERS in tests
          ENABLE_MOCK_USERS: 'true'  # Mock users allowed in development environment for testing
          RATE_LIMIT_REQUESTS: 60

      - name: Run API Backend tests (production mode)
        working-directory: handoff/20250928/40_App/api-backend
        run: |
          pytest tests/test_cors_config.py::TestCORSHeadersMiddleware::test_vercel_preview_blocked_in_production -v --tb=short --disable-warnings
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}/handoff/20250928/40_App/api-backend:${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
          TESTING: true
          ENVIRONMENT: production  # Production mode for production-specific test
          ENABLE_MOCK_USERS: 'false'  # Mock users disabled in production
          RATE_LIMIT_REQUESTS: 60

  test-orchestrator:
    name: Orchestrator Tests
    runs-on: ubuntu-latest
    # Increased from 15 to 45 minutes to accommodate slow async executor tests
    # in meta_agent/tests/test_autonomous_executor.py which can take up to 5 minutes each.
    # These tests were previously not run due to pytest discovery gap (#3251).
    timeout-minutes: 45
    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Fetch full history for proper git diff in schema validation
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: handoff/20250928/40_App/orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-timeout PyYAML
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          # Install orchestrator package with all dependencies (including langgraph)
          pip install -e .
      
      - name: Validate schema version bump on schema changes
        if: github.event_name == 'pull_request'
        working-directory: handoff/20250928/40_App/orchestrator
        run: |
          # Check if CoderOutput or CODER_SYSTEM_PROMPT changed without version bump
          SIMPLE_CODER="coder/simple_coder.py"
          
          # Get the diff using PR base SHA (more reliable than origin/main in GitHub Actions)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          DIFF=$(git diff "$BASE_SHA"..."$HEAD_SHA" -- "$SIMPLE_CODER" 2>/dev/null || echo "")
          
          if [ -z "$DIFF" ]; then
            echo "No changes to $SIMPLE_CODER - skipping schema version check"
            exit 0
          fi
          
          # Check if schema-related code changed (CoderOutput class or CODER_SYSTEM_PROMPT)
          SCHEMA_CHANGED=false
          if echo "$DIFF" | grep -E '^[+-].*class CoderOutput|^[+-].*CODER_SYSTEM_PROMPT|^[+-].*"status"|^[+-].*"reason"|^[+-].*"patch"|^[+-].*schema_version|^[+-].*file_path|^[+-].*syntax_valid' | grep -v '^[+-]{3}' > /dev/null; then
            SCHEMA_CHANGED=true
          fi
          
          # Check if version was bumped
          VERSION_BUMPED=false
          if echo "$DIFF" | grep -E '^[+-].*CODER_OUTPUT_SCHEMA_VERSION' | grep -v '^[+-]{3}' > /dev/null; then
            VERSION_BUMPED=true
          fi
          
          if [ "$SCHEMA_CHANGED" = true ] && [ "$VERSION_BUMPED" = false ]; then
            echo "::warning::Schema-related changes detected in $SIMPLE_CODER but CODER_OUTPUT_SCHEMA_VERSION was not updated."
            echo "::warning::If you modified CoderOutput fields or CODER_SYSTEM_PROMPT, consider bumping the schema version."
            echo ""
            echo "Schema changes detected:"
            echo "$DIFF" | grep -E '^[+-].*class CoderOutput|^[+-].*CODER_SYSTEM_PROMPT|^[+-].*"status"|^[+-].*"reason"|^[+-].*"patch"|^[+-].*schema_version|^[+-].*file_path|^[+-].*syntax_valid' | grep -v '^[+-]{3}' || true
          else
            echo "Schema version validation passed"
          fi
      
      - name: Validate test discovery (minimum test count)
        working-directory: handoff/20250928/40_App/orchestrator
        run: |
          # Collect tests without running them to verify discovery
          pytest --collect-only -q 2>&1 | tee /tmp/collect.txt
          
          # Extract test count from output
          TEST_COUNT=$(grep -E "^[0-9]+ tests? collected" /tmp/collect.txt | awk '{print $1}' || echo "0")
          
          # Minimum threshold: Set to 4000 based on current baseline of ~4800 tests.
          # This catches major discovery failures (e.g., only running tests/ instead of all 15 directories)
          # while allowing some fluctuation for normal test additions/removals.
          # If test count drops significantly, check pytest.ini testpaths configuration.
          MIN_TESTS=4000
          
          echo "Discovered $TEST_COUNT tests (minimum required: $MIN_TESTS)"
          
          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Test discovery seems broken. Only $TEST_COUNT tests found (expected at least $MIN_TESTS)."
            echo "::error::Check pytest.ini testpaths configuration."
            exit 1
          fi
          
          # Verify critical test directories are discovered
          CRITICAL_DIRS="tests coder/tests"
          for dir in $CRITICAL_DIRS; do
            if ! grep -q "$dir" /tmp/collect.txt; then
              echo "::warning::Critical test directory '$dir' may not be fully discovered"
            fi
          done
          
          echo "Test discovery validation passed: $TEST_COUNT tests found"
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App/orchestrator:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}/handoff/20250928/40_App/api-backend:${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
      
      - name: Run Orchestrator tests with coverage
        working-directory: handoff/20250928/40_App/orchestrator
        run: |
          # Uses testpaths from pytest.ini - no path arguments needed
          # Skip slow tests (marked with @pytest.mark.slow) to prevent CI timeouts
          # Slow tests include TestAutonomousExecutor which invokes real async execution
          pytest -v --tb=short --disable-warnings -m "not slow" --cov=. --cov-report=xml --cov-report=json --cov-report=term-missing --cov-fail-under=50
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App/orchestrator:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}/handoff/20250928/40_App/api-backend:${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
      
      - name: Upload Orchestrator coverage report
        uses: actions/upload-artifact@v6
        with:
          name: orchestrator-coverage
          path: |
            handoff/20250928/40_App/orchestrator/coverage.xml
            handoff/20250928/40_App/orchestrator/coverage.json
          retention-days: 30
      
      - name: Comment PR with Orchestrator coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read coverage JSON
            const coveragePath = path.join(process.cwd(), 'handoff/20250928/40_App/orchestrator/coverage.json');
            let coverage;
            try {
              coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            } catch (e) {
              console.log('Could not read coverage.json:', e.message);
              return;
            }
            
            const totals = coverage.totals;
            const threshold = 50;
            
            // Helper functions
            const getStatus = (pct) => pct >= threshold ? '✅' : '❌';
            
            // Build comment
            const comment = `## 📊 Orchestrator 測試覆蓋率報告
            
            | 指標 | 覆蓋率 | 狀態 |
            |------|--------|------|
            | Lines | ${totals.percent_covered.toFixed(2)}% | ${getStatus(totals.percent_covered)} |
            | Covered Lines | ${totals.covered_lines} / ${totals.num_statements} | - |
            | Missing Lines | ${totals.missing_lines} | - |
            
            **門檻要求**: ${threshold}% 最低標準
            
            ${totals.percent_covered >= threshold 
              ? '✅ **覆蓋率門檻已達標！**' 
              : '❌ **覆蓋率未達標，請補充測試。**'}
            
            ---
            
            [查看完整覆蓋率報告](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Orchestrator 測試覆蓋率報告')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
  
  test-frontend-dashboard:
    name: Frontend Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Create environment files for smoke tests
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: |
          touch .env.production .env.local
          mkdir -p dist
      
      - name: Run Frontend Dashboard tests
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: |
          # Frontend dashboard uses test:smoke instead of test
          if grep -q '"test":' package.json; then
            pnpm test
          elif grep -q '"test:smoke":' package.json; then
            pnpm test:smoke
          else
            echo "No test script found, skipping tests"
          fi
      
      - name: Run ESLint
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: pnpm lint
      
      - name: Build Frontend Dashboard
        working-directory: handoff/20250928/40_App/frontend-dashboard
        run: pnpm build
  
  test-owner-console:
    name: Owner Console Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/owner-console
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Create environment files for smoke tests
        working-directory: handoff/20250928/40_App/owner-console
        run: |
          touch .env.production .env.local
          mkdir -p dist
      
      - name: Run Owner Console tests
        working-directory: handoff/20250928/40_App/owner-console
        run: |
          # Owner console uses test:smoke instead of test
          if grep -q '"test":' package.json; then
            pnpm test
          elif grep -q '"test:smoke":' package.json; then
            pnpm test:smoke
          else
            echo "No test script found, skipping tests"
          fi
      
      - name: Run ESLint
        working-directory: handoff/20250928/40_App/owner-console
        run: pnpm lint
      
      - name: Build Owner Console
        working-directory: handoff/20250928/40_App/owner-console
        run: pnpm build
