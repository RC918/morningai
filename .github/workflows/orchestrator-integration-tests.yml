name: Orchestrator Integration Tests

on:
  workflow_dispatch:
  # Run on merge queue to avoid blocking PRs
  merge_group:
    branches: [main]
  # Also run on push to main for visibility
  push:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/orchestrator/**'
      - '.github/workflows/orchestrator-integration-tests.yml'
  # Optional: run on PRs that touch orchestrator (non-required)
  pull_request:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/orchestrator/**'
      - '.github/workflows/orchestrator-integration-tests.yml'

jobs:
  integration-tests:
    name: Redis Queue Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-required initially - doesn't block PRs
    continue-on-error: true
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 3s
          --health-retries 20
          --health-timeout 5s
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
          
          # Install orchestrator dependencies
          cd handoff/20250928/40_App/orchestrator
          pip install -r requirements.txt
          pip install -e .
          
          # Install api-backend dependencies (for common.config.settings)
          cd ../api-backend
          pip install -r requirements.txt
      
      - name: Run redis_queue integration tests
        run: |
          pytest handoff/20250928/40_App/orchestrator/redis_queue/tests/ \
            -v --tb=short --disable-warnings \
            --timeout=60 \
            --junitxml=integration-test-results.xml
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App/orchestrator:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
          ROLLOUT_TRACKER_ENABLED: true
      
      - name: Run fault injection tests
        run: |
          pytest handoff/20250928/40_App/orchestrator/redis_queue/tests/test_fault_injection.py \
            -v --tb=short --disable-warnings \
            --timeout=120 \
            --junitxml=fault-injection-test-results.xml || true
        env:
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App/orchestrator:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src:${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
          ROLLOUT_TRACKER_ENABLED: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            integration-test-results.xml
            fault-injection-test-results.xml
          retention-days: 30
      
      - name: Generate test summary
        if: always()
        run: |
          echo "### Orchestrator Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f integration-test-results.xml ]; then
            TESTS=$(grep -oP 'tests="\K[^"]+' integration-test-results.xml || echo "0")
            FAILURES=$(grep -oP 'failures="\K[^"]+' integration-test-results.xml || echo "0")
            ERRORS=$(grep -oP 'errors="\K[^"]+' integration-test-results.xml || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No test results found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: This job is non-blocking. Failures here don't block PR merges." >> $GITHUB_STEP_SUMMARY
