name: Python Scripts CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/python-scripts-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**/*.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/python-scripts-ci.yml'

jobs:
  syntax-check:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Compile monitor-related Python scripts
        id: compile
        run: |
          echo "## Python Syntax Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Scoped to monitor-related files for this P1 PR_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          FAILED_FILES=()
          PASSED_COUNT=0
          
          # Check monitor-related files only (scoped for P1)
          # TODO: Expand to all scripts after fixing legacy syntax errors
          for file in scripts/monitor_orchestrator.py scripts/repo_root_utils.py scripts/test_monitor_graceful_degradation.py; do
            echo "Checking $file..."
            if ERROR_OUTPUT=$(python -m py_compile "$file" 2>&1); then
              echo "✅ $file"
              echo "✅ $file" >> $GITHUB_STEP_SUMMARY
              PASSED_COUNT=$((PASSED_COUNT + 1))
            else
              echo "❌ $file - FAILED"
              echo "$ERROR_OUTPUT"
              echo "❌ $file" >> $GITHUB_STEP_SUMMARY
              FAILED_FILES+=("$file")
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: $PASSED_COUNT files passed syntax check" >> $GITHUB_STEP_SUMMARY
          
          if [ ${#FAILED_FILES[@]} -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Syntax Errors Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following files have syntax errors:" >> $GITHUB_STEP_SUMMARY
            for file in "${FAILED_FILES[@]}"; do
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please fix syntax errors before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ All checked scripts have valid syntax" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Test CI Output Classifier
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CI Output Classifier Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if python .github/scripts/test_classify_ci_output.py -v; then
            echo "✅ All 28 classifier tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Classifier tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  monitor-tests:
    name: Monitor Orchestrator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/scripts" >> $GITHUB_ENV
      
      - name: Verify PYTHONPATH
        run: python -c "import sys; print('sys.path:', sys.path)"
      
      - name: Run monitor tests
        id: test
        run: |
          echo "## Monitor Orchestrator Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run tests with verbose output
          if pytest scripts/test_monitor_graceful_degradation.py -v --tb=short 2>&1 | tee test_output.txt; then
            echo "### ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      
      - name: Test monitor script imports
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Import Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test that monitor_orchestrator.py can be imported
          if python -c "import scripts.monitor_orchestrator" 2>&1; then
            echo "✅ monitor_orchestrator.py imports successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ monitor_orchestrator.py failed to import" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  self-test:
    name: CI Logic Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Test Tier 1 - SyntaxError detection
        run: |
          echo "Testing Tier 1: SyntaxError detection"
          
          # Create temp file with syntax error
          echo "def foo(" > /tmp/test_syntax.py
          
          # Run detection logic
          set +e
          OUTPUT=$(python /tmp/test_syntax.py 2>&1)
          EXIT_CODE=$?
          set -e
          
          # Use centralized classifier (wrap with set +e since classifier exits 1 for FAIL)
          set +e
          CLASSIFICATION=$(echo "$OUTPUT" | python .github/scripts/classify_ci_output.py "$EXIT_CODE")
          CLASSIFIER_EXIT=$?
          set -e
          
          TIER=$(echo "$CLASSIFICATION" | grep "^TIER=" | cut -d= -f2)
          STATUS=$(echo "$CLASSIFICATION" | grep "^STATUS=" | cut -d= -f2)
          
          if [ "$TIER" = "1" ] && [ "$STATUS" = "FAIL" ]; then
            echo "✅ Tier 1 correctly detected SyntaxError"
          else
            echo "❌ Tier 1 failed (got Tier $TIER, Status $STATUS)"
            exit 1
          fi
      
      - name: Test Tier 2 - Timeout detection
        run: |
          echo "Testing Tier 2: Timeout detection"
          
          # Create script that sleeps
          echo "import time; time.sleep(100)" > /tmp/test_timeout.py
          
          # Run with timeout
          set +e
          OUTPUT=$(timeout 1s python /tmp/test_timeout.py 2>&1)
          EXIT_CODE=$?
          set -e
          
          # Should detect timeout (exit 124)
          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "✅ Tier 2 correctly detected timeout"
          else
            echo "❌ Tier 2 failed to detect timeout (exit code: $EXIT_CODE)"
            exit 1
          fi
      
      - name: Test Tier 3 - Network error detection
        run: |
          echo "Testing Tier 3: Network error detection"
          
          # Create script that raises network error (using 127.0.0.1:9 for deterministic ConnectionRefused)
          cat > /tmp/test_network.py << 'PYEOF'
          import requests
          try:
              requests.get("http://127.0.0.1:9", timeout=1)
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          PYEOF
          
          # Run script
          set +e
          OUTPUT=$(python /tmp/test_network.py 2>&1)
          EXIT_CODE=$?
          set -e
          
          # Use centralized classifier (classifier exits 0 for PASS, so no need for set +e wrapper)
          CLASSIFICATION=$(echo "$OUTPUT" | python .github/scripts/classify_ci_output.py "$EXIT_CODE")
          TIER=$(echo "$CLASSIFICATION" | grep "^TIER=" | cut -d= -f2)
          STATUS=$(echo "$CLASSIFICATION" | grep "^STATUS=" | cut -d= -f2)
          
          if [ "$TIER" = "3" ] && [ "$STATUS" = "PASS" ]; then
            echo "✅ Tier 3 correctly detected network error"
          else
            echo "❌ Tier 3 failed (got Tier $TIER, Status $STATUS)"
            exit 1
          fi
      
      - name: Test Tier 5 - Non-network error detection
        run: |
          echo "Testing Tier 5: Non-network error detection"
          
          # Create script that raises ValueError
          cat > /tmp/test_value_error.py << 'PYEOF'
          raise ValueError("This is a test error")
          PYEOF
          
          # Run script
          set +e
          OUTPUT=$(python /tmp/test_value_error.py 2>&1)
          EXIT_CODE=$?
          set -e
          
          # Use centralized classifier (wrap with set +e since classifier exits 1 for FAIL)
          set +e
          CLASSIFICATION=$(echo "$OUTPUT" | python .github/scripts/classify_ci_output.py "$EXIT_CODE")
          CLASSIFIER_EXIT=$?
          set -e
          
          TIER=$(echo "$CLASSIFICATION" | grep "^TIER=" | cut -d= -f2)
          STATUS=$(echo "$CLASSIFICATION" | grep "^STATUS=" | cut -d= -f2)
          
          if [ "$TIER" = "5" ] && [ "$STATUS" = "FAIL" ]; then
            echo "✅ Tier 5 correctly detected non-network error"
          else
            echo "❌ Tier 5 failed (got Tier $TIER, Status $STATUS)"
            exit 1
          fi

  integration-check:
    name: Monitor Integration Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [syntax-check, monitor-tests, self-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/scripts" >> $GITHUB_ENV
      
      - name: Verify monitor script runs (dry run)
        run: |
          set -o pipefail  # Ensure pipeline failures are caught
          
          echo "## Monitor Script Dry Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Capture output and exit code without aborting the step
          set +e
          OUTPUT=$(timeout 10s python scripts/monitor_orchestrator.py 2>&1)
          EXIT_CODE=$?
          set -e
          
          # Print full output to job logs
          echo "$OUTPUT"
          
          append_summary() {
            echo '```' >> $GITHUB_STEP_SUMMARY
            printf "%s\n" "$1" | tail -n 200 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }
          
          # Use centralized classifier with error handling
          CLASSIFICATION=$(echo "$OUTPUT" | python .github/scripts/classify_ci_output.py "$EXIT_CODE")
          CLASSIFIER_EXIT=$?
          
          # Check classifier succeeded
          if [ $CLASSIFIER_EXIT -ne 0 ]; then
            echo "❌ Classifier failed with exit code $CLASSIFIER_EXIT" >> $GITHUB_STEP_SUMMARY
            echo "Raw output:" >> $GITHUB_STEP_SUMMARY
            append_summary "$OUTPUT"
            exit 1
          fi
          
          # Parse output with validation
          TIER=$(echo "$CLASSIFICATION" | grep "^TIER=" | cut -d= -f2)
          STATUS=$(echo "$CLASSIFICATION" | grep "^STATUS=" | cut -d= -f2)
          REASON=$(echo "$CLASSIFICATION" | grep "^REASON=" | cut -d= -f2-)
          
          # Validate parsed values
          if [ -z "$TIER" ] || [ -z "$STATUS" ] || [ -z "$REASON" ]; then
            echo "❌ Failed to parse classifier output" >> $GITHUB_STEP_SUMMARY
            echo "Raw classifier output:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$CLASSIFICATION" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "Classification: Tier $TIER - $STATUS - $REASON"
          
          if [ "$STATUS" = "PASS" ]; then
            echo "✅ $REASON" >> $GITHUB_STEP_SUMMARY
            append_summary "$OUTPUT"
            exit 0
          else
            echo "❌ $REASON" >> $GITHUB_STEP_SUMMARY
            append_summary "$OUTPUT"
            exit 1
          fi
        env:
          ORCHESTRATOR_API_URL: https://test-api.example.com
          # No SLACK_WEBHOOK_URL - test graceful degradation
