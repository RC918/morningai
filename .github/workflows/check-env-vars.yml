name: Check Environment Variables

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  check-env-usage:
    name: Check for direct os.getenv usage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for new os.getenv calls
        run: |
          echo "Checking for direct os.getenv() calls outside of settings module..."
          
          # Find all Python files with os.getenv calls (excluding settings.py and allowed files)
          VIOLATIONS=$(grep -r "os\.getenv\|os\.environ\.get" \
            --include="*.py" \
            --exclude-dir=".venv" \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            --exclude-dir="__pycache__" \
            --exclude="settings.py" \
            . || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ ERROR: Found direct os.getenv() or os.environ.get() calls:"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "Please use 'from common.config.settings import settings' instead."
            echo "Example: settings.database_url instead of os.getenv('DATABASE_URL')"
            echo ""
            echo "If you need to add a new environment variable:"
            echo "1. Add it to config/env.schema.yaml"
            echo "2. Add it to common/config/settings.py"
            echo "3. Use settings.variable_name in your code"
            echo ""
            echo "Note: This check will be enforced after PR 1b/1c migration is complete."
            echo "For now, this is a WARNING only."
            exit 0  # Exit 0 for now (warning), will change to exit 1 after migration
          else
            echo "✅ No direct os.getenv() calls found (excluding settings.py)"
          fi
      
      - name: Verify settings module exists
        run: |
          if [ ! -f "common/config/settings.py" ]; then
            echo "❌ ERROR: common/config/settings.py not found!"
            echo "The centralized settings module is required."
            exit 1
          fi
          echo "✅ Settings module exists"
      
      - name: Verify env.schema.yaml is valid
        run: |
          if [ ! -f "config/env.schema.yaml" ]; then
            echo "❌ ERROR: config/env.schema.yaml not found!"
            exit 1
          fi
          
          # Check if it's valid YAML (requires Python)
          python3 -c "import yaml; yaml.safe_load(open('config/env.schema.yaml'))" || {
            echo "❌ ERROR: config/env.schema.yaml is not valid YAML"
            exit 1
          }
          
          echo "✅ env.schema.yaml is valid"
