name: frontend-ci
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'handoff/20250928/50_Infra/**'
      - 'handoff/20250928/60_Design/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'handoff/20250928/50_Infra/**'
      - 'handoff/20250928/60_Design/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Create environment files for CI
        run: |
          cd handoff/20250928/40_App/frontend-dashboard
          echo "VITE_API_BASE_URL=http://localhost:5000" > .env.production
          echo "STRIPE_SECRET_KEY=sk_test_placeholder" >> .env.production
          echo "STRIPE_WEBHOOK_SECRET=whsec_placeholder" >> .env.production
          echo "VITE_API_BASE_URL=http://localhost:5000" > .env.local
          echo "STRIPE_SECRET_KEY=sk_test_placeholder" >> .env.local
          echo "STRIPE_WEBHOOK_SECRET=whsec_placeholder" >> .env.local
      
      - name: Build frontend with Turborepo
        run: pnpm run build --filter=frontend-dashboard
      
      - name: Lint frontend with Turborepo
        run: pnpm run lint --filter=frontend-dashboard
      
      - name: Typecheck frontend-dashboard
        run: |
          cd handoff/20250928/40_App/frontend-dashboard
          pnpm run typecheck
      
      - name: Typecheck owner-console
        run: |
          cd handoff/20250928/40_App/owner-console
          pnpm run typecheck
      
      - name: Test frontend-dashboard
        run: |
          cd handoff/20250928/40_App/frontend-dashboard
          pnpm run test -- --coverage --coverage.reporter=text --coverage.reporter=json --coverage.reporter=html
      
      - name: Upload frontend-dashboard coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dashboard-coverage
          path: handoff/20250928/40_App/frontend-dashboard/coverage/
          retention-days: 30
      
      - name: Test owner-console
        run: |
          cd handoff/20250928/40_App/owner-console
          pnpm run test -- --run --coverage --coverage.reporter=text --coverage.reporter=json --coverage.reporter=html
      
      - name: Upload owner-console coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-console-coverage
          path: handoff/20250928/40_App/owner-console/coverage/
          retention-days: 30
      
      - name: Test shared-ui
        run: |
          cd packages/shared-ui
          pnpm run test -- --coverage --coverage.reporter=text --coverage.reporter=json --coverage.reporter=html
      
      - name: Upload shared-ui coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ui-coverage
          path: packages/shared-ui/coverage/
          retention-days: 30
  
  i18n-baseline-check:
    name: i18n Violation Baseline Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Run i18n baseline check
        run: node scripts/check-i18n-baseline.mjs
      
      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-baseline-report
          path: scripts/i18n-baseline.json
          retention-days: 30
  
  typecheck-strict:
    name: TypeScript Strict Mode Progress
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BASELINE_SOURCE_ERRORS: 187
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Run strict typecheck
        run: |
          cd handoff/20250928/40_App/frontend-dashboard
          pnpm run typecheck:strict 2>&1 | tee strict-report.txt || true
          SOURCE_ERRORS=$(grep "src/" strict-report.txt | grep "error TS" | wc -l || echo 0)
          echo "::notice::Source code errors: $SOURCE_ERRORS / ${{ env.BASELINE_SOURCE_ERRORS }} (baseline)"
          echo "SOURCE_ERRORS=$SOURCE_ERRORS" >> $GITHUB_ENV
      
      - name: Upload strict typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-typecheck-report
          path: handoff/20250928/40_App/frontend-dashboard/strict-report.txt
          retention-days: 30
      
      - name: Comment on PR with progress
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: typescript-strict-progress
          body: |
            ## 📊 TypeScript Strict Mode Progress
            
            **Source Code Errors**: ${{ env.SOURCE_ERRORS }} / ${{ env.BASELINE_SOURCE_ERRORS }} (baseline)
            
            This is a non-blocking check to track progress toward full strict mode adoption.
            See [Issue #935](https://github.com/RC918/morningai/issues/935) for details.
            
            📎 [View full report artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
  
  changed-files-strict-i18n:
    name: Changed Files Strict i18n Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Validate Locale Files (Tolgee Corruption Guard)
        run: |
          set -o pipefail
          
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          
          # Get changed locale files only
          CHANGED_LOCALES=$(git diff --name-only --diff-filter=d "$BASE"..."$HEAD" | \
            grep -E '(owner-console/src/locales|frontend-dashboard/src/i18n/locales)/.*\.json$' || true)
          
          if [ -z "$CHANGED_LOCALES" ]; then
            echo "✅ No locale files changed in this PR - skipping validation"
            exit 0
          fi
          
          echo "Changed locale files:"
          echo "$CHANGED_LOCALES"
          echo ""
          
          # Validate each changed file for demo data patterns
          echo "$CHANGED_LOCALES" | while read -r file; do
            if [ -f "$file" ]; then
              echo "Checking $file for demo data patterns..."
              if grep -q "What to pack\|add-item-add-button\|delete-item-button\|Quoi emballer\|Was mitnehmen" "$file"; then
                echo "❌ ERROR: Tolgee demo data detected in $file!"
                echo "This indicates the Tolgee project contains corrupted/demo data."
                echo "Please fix the Tolgee project data before merging."
                exit 1
              fi
              echo "  ✅ No demo data detected"
            fi
          done
          
          echo ""
          echo "✅ All changed locale files passed validation"
      
      - name: Strict i18n Check on Changed Files
        run: |
          set -o pipefail
          
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          
          echo "Checking changed files between $BASE and $HEAD"
          
          # Get all changed JS/JSX/TS/TSX files (excluding deletions)
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE"..."$HEAD" | grep -E '\.(js|jsx|ts|tsx)$' || true)
          
          if [ -z "$CHANGED" ]; then
            echo "No JS/TS files changed in this PR"
            exit 0
          fi
          
          echo "Changed files:"
          echo "$CHANGED"
          
          # Split by workspace
          OC_FILES=$(echo "$CHANGED" | grep 'handoff/.*/40_App/owner-console/src/' || true)
          FD_FILES=$(echo "$CHANGED" | grep 'handoff/.*/40_App/frontend-dashboard/src/' || true)
          
          EXIT_CODE=0
          
          # Check owner-console files
          if [ -n "$OC_FILES" ]; then
            echo ""
            echo "=== Checking owner-console files ==="
            # Strip workspace prefix from paths (convert to workspace-relative)
            OC_FILES_RELATIVE=$(echo "$OC_FILES" | sed 's|^handoff/.*/40_App/owner-console/||')
            echo "Relative paths: $OC_FILES_RELATIVE"
            echo "$OC_FILES_RELATIVE" | xargs -r pnpm -F owner-console exec eslint --quiet --rule 'i18next/no-literal-string: ["error", {"markupOnly": false, "ignoreCallee": ["t","Trans","clsx","cn","tw","cva"]}]' || EXIT_CODE=1
          fi
          
          # Check frontend-dashboard files
          if [ -n "$FD_FILES" ]; then
            echo ""
            echo "=== Checking frontend-dashboard files ==="
            # Strip workspace prefix from paths (convert to workspace-relative)
            FD_FILES_RELATIVE=$(echo "$FD_FILES" | sed 's|^handoff/.*/40_App/frontend-dashboard/||')
            echo "Relative paths: $FD_FILES_RELATIVE"
            echo "$FD_FILES_RELATIVE" | xargs -r pnpm -F frontend-dashboard exec eslint --quiet --rule 'i18next/no-literal-string: ["error", {"markupOnly": false, "ignoreCallee": ["t","Trans","clsx","cn","tw","cva"]}]' || EXIT_CODE=1
          fi
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ i18n violations found in changed files!"
            echo "All user-visible strings must use t() or <Trans> for internationalization."
            echo "Note: This strict check enforces i18n on ALL user-visible strings, including object properties."
            exit 1
          fi
          
          echo ""
          echo "✅ All changed files pass strict i18n check!"
  
  typescript-strict-check:
    name: TypeScript Strict Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: TypeScript Check - Frontend Dashboard
        run: pnpm -F frontend-dashboard exec tsc --noEmit
      
      - name: TypeScript Check - Owner Console
        run: pnpm -F owner-console exec tsc --noEmit
  
  storybook-a11y-tests:
    name: Storybook A11y Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      
      - name: Install Playwright browsers
        run: |
          cd packages/shared-ui
          pnpm exec playwright install --with-deps chromium
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Run Storybook accessibility tests
        run: |
          cd packages/shared-ui
          pnpm run test-storybook:ci
  
  owner-console-e2e:
    name: Owner Console E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Setup Python for backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        run: |
          cd handoff/20250928/40_App/api-backend
          pip install -r requirements.txt
      
      - name: Start backend API with mock users
        run: |
          cd handoff/20250928/40_App/api-backend
          export FLASK_APP=src.main:app
          export ENABLE_MOCK_USERS=true
          export ENABLE_ORCHESTRATOR=false
          export ALLOW_GOVERNANCE_MOCK=true
          export JWT_SECRET_KEY=test-jwt-secret-for-e2e-ci
          export FLASK_SECRET_KEY=test-flask-secret-for-e2e-ci
          export ENVIRONMENT=development
          export CORS_ORIGINS=http://localhost:4173,http://127.0.0.1:4173
          export ACCESS_TOKEN_EXPIRY_MINUTES=60
          export LOG_TOKEN_EXPIRY_ON_STARTUP=1
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/handoff/20250928/40_App/api-backend/src:${PYTHONPATH}"
          
          # Verify critical imports work before starting Flask
          python - <<'PY'
          import sys, importlib
          print("PYTHONPATH OK, first 5:", sys.path[:5])
          import common
          importlib.import_module('src.services.auth_service')
          print("✅ Import preflight: OK (orchestrator disabled for E2E)")
          PY
          
          # Log environment for debugging
          echo "PYTHONPATH=$PYTHONPATH" > backend.log
          python - <<'PY' >> backend.log
          import sys
          print("sys.path (first 10):", sys.path[:10])
          PY
          
          nohup gunicorn -b 0.0.0.0:5000 'src.main:app' --workers=1 --threads=4 --timeout=120 >> backend.log 2>&1 &
          echo $! > backend.pid
          
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "✅ Backend is ready"
              curl -s http://localhost:5000/health | head -20
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          
          if ! curl -sf http://localhost:5000/health > /dev/null; then
            echo "❌ Backend failed to start"
            cat backend.log
            exit 1
          fi
      
      - name: Build owner-console
        working-directory: handoff/20250928/40_App/owner-console
        env:
          VITE_API_BASE_URL: http://localhost:5000
          VITE_USE_MOCK: 'true'
          VITE_TRACE_VIEWER_URL: https://trace.example.com
        run: pnpm run build
      
      - name: Verify VITE_* baked into build
        working-directory: handoff/20250928/40_App/owner-console
        run: |
          echo "🔍 Verifying VITE_API_BASE_URL is baked into dist..."
          echo "📁 Checking dist directory..."
          ls -la dist/ || (echo "❌ dist directory not found!" && exit 1)
          echo "🔎 Searching for VITE_API_BASE_URL in build..."
          if grep -r "http://localhost:5000" dist/ 2>/dev/null | head -5; then
            echo "✅ VITE_API_BASE_URL successfully baked into build"
          else
            echo "❌ VITE_API_BASE_URL not found in dist - build may have failed to include env vars"
            echo "📄 Showing first few files in dist:"
            find dist -type f | head -10
            exit 1
          fi
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      
      - name: Install Playwright browsers
        run: |
          cd handoff/20250928/40_App/owner-console
          pnpm exec playwright install --with-deps chromium
      
      - name: Run Playwright E2E tests
        run: |
          cd handoff/20250928/40_App/owner-console
          pnpm run test:e2e
      
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs-owner-console
          path: handoff/20250928/40_App/api-backend/backend.log
          retention-days: 30
      
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-owner-console
          path: handoff/20250928/40_App/owner-console/playwright-report/
          retention-days: 30
      
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-owner-console
          path: handoff/20250928/40_App/owner-console/test-results/
          retention-days: 30
      
      - name: Stop backend
        if: always()
        run: |
          if [ -f handoff/20250928/40_App/api-backend/backend.pid ]; then
            kill $(cat handoff/20250928/40_App/api-backend/backend.pid) || true
          fi
  
  frontend-dashboard-e2e:
    name: Frontend Dashboard E2E Tests (Design Tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
