          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/handoff/20250928/40_App/api-backend/src:${PYTHONPATH}"
          
          # Verify critical imports work before starting Flask
          python - <<'PY'
          import sys, importlib
          print("PYTHONPATH OK, first 5:", sys.path[:5])
          import common
          importlib.import_module('src.services.auth_service')
          print("✅ Import preflight: OK (orchestrator disabled for E2E)")
          PY
          
          # Log environment for debugging
          echo "PYTHONPATH=$PYTHONPATH" > backend.log
          python - <<'PY' >> backend.log
          import sys
          print("sys.path (first 10):", sys.path[:10])
          PY
          
          nohup gunicorn -b 0.0.0.0:5000 'src.main:app' --workers=1 --threads=4 --timeout=120 >> backend.log 2>&1 &
          echo $! > backend.pid
          
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "✅ Backend is ready"
              curl -s http://localhost:5000/health | head -20
              break
            fi
            echo "Waiting for backend... ($i/30)"
