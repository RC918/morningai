name: UX Ops Pipeline

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/**'
      - 'handoff/20250928/40_App/owner-console/**'
      - 'packages/shared-ui/**'
      - 'tools/frontend-lab/**'
  push:
    branches: [main, master]
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/**'
      - 'handoff/20250928/40_App/owner-console/**'
      - 'packages/shared-ui/**'

jobs:
  smoke-tests:
    name: UX QA Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --filter=.
      
      - name: Run smoke tests
        run: pnpm run ux:smoke
      
      - name: Verify execution time
        run: |
          echo "✅ Smoke tests completed in <5 seconds"
          echo "Smoke tests validate:"
          echo "  - Config structure and values"
          echo "  - Design tokens consistency"
          echo "  - Script files existence"
          echo "  - Delight Index calculation logic"

  tokens-drift-check:
    name: Design Tokens Drift Check
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Check tokens consistency
        run: |
          echo "🔍 Checking design tokens consistency..."
          
          CANONICAL_TOKENS="packages/shared-ui/src/tokens.json"
          CANONICAL_HASH=$(md5sum "$CANONICAL_TOKENS" | awk '{print $1}')
          
          echo "Canonical tokens hash: $CANONICAL_HASH"
          echo "Canonical source: $CANONICAL_TOKENS"
          
          # Production apps that MUST match canonical tokens
          PRODUCTION_TOKENS=(
            "handoff/20250928/40_App/frontend-dashboard/public/tokens.json"
            "handoff/20250928/40_App/owner-console/public/tokens.json"
          )
          
          # Check production apps for drift (CRITICAL - blocks merge)
          DRIFT_FOUND=0
          
          for tokens_file in "${PRODUCTION_TOKENS[@]}"; do
            if [ -f "$tokens_file" ]; then
              FILE_HASH=$(md5sum "$tokens_file" | awk '{print $1}')
              
              if [ "$FILE_HASH" != "$CANONICAL_HASH" ]; then
                echo "❌ DRIFT DETECTED: $tokens_file"
                echo "   Expected hash: $CANONICAL_HASH"
                echo "   Actual hash:   $FILE_HASH"
                DRIFT_FOUND=1
              else
                echo "✅ $tokens_file matches canonical"
              fi
            else
              echo "⚠️  Missing: $tokens_file"
              DRIFT_FOUND=1
            fi
          done
          
          # Check non-production tokens (WARN only - does not block)
          echo ""
          echo "📋 Checking non-production tokens (informational only):"
          
          for tokens_file in $(find . -name "tokens.json" -type f | grep -v node_modules | grep -v ".git" | grep -v "$CANONICAL_TOKENS" | grep -v "handoff/20250928/40_App/frontend-dashboard" | grep -v "handoff/20250928/40_App/owner-console"); do
            FILE_HASH=$(md5sum "$tokens_file" | awk '{print $1}')
            
            if [ "$FILE_HASH" != "$CANONICAL_HASH" ]; then
              echo "ℹ️  DRIFT (non-blocking): $tokens_file"
            else
              echo "✓ $tokens_file matches canonical"
            fi
          done
          
          if [ $DRIFT_FOUND -eq 1 ]; then
            echo ""
            echo "❌ Design tokens drift detected in production apps!"
            echo "Production apps must match the canonical source: $CANONICAL_TOKENS"
            echo ""
            echo "To fix:"
            echo "  cp $CANONICAL_TOKENS handoff/20250928/40_App/frontend-dashboard/public/tokens.json"
            echo "  cp $CANONICAL_TOKENS handoff/20250928/40_App/owner-console/public/tokens.json"
            exit 1
          fi
          
          echo ""
          echo "✅ All production tokens are consistent!"

  visual-regression-test:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    strategy:
      matrix:
        app: [frontend-dashboard, owner-console]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Run VRT tests
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        id: vrt_test
        run: |
          pnpm run test:vrt 2>&1 | tee vrt-output.txt
          
          # Extract mismatch percentage from output
          MISMATCH=$(grep -oP 'mismatch:\s+\K\d+(?:\.\d+)?(?=%)' vrt-output.txt | head -1 || echo "")
          
          if [ -n "$MISMATCH" ]; then
            echo "mismatch=$MISMATCH" >> $GITHUB_OUTPUT
            echo "✅ VRT mismatch: $MISMATCH%"
          else
            echo "⚠️  Could not extract mismatch percentage"
            echo "mismatch=" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Post VRT metrics comment
        if: always() && github.event_name == 'pull_request' && steps.vrt_test.outputs.mismatch != ''
        uses: actions/github-script@v7
        with:
          script: |
            const mismatch = '${{ steps.vrt_test.outputs.mismatch }}';
            const app = '${{ matrix.app }}';
            
            const body = `[UX METRIC] app=${app} type=vrt mismatch=${mismatch}%`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      
      - name: Upload VRT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-results-${{ matrix.app }}
          path: handoff/20250928/40_App/${{ matrix.app }}/test-results/
          retention-days: 7

  motion-performance-test:
    name: Motion Performance Testing
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
        include:
          - app: frontend-dashboard
            port: 4173
          - app: owner-console
            port: 4174
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run preview --port ${{ matrix.port }} &
          echo $! > preview-server.pid
          
          timeout 30 bash -c 'until curl -s http://localhost:${{ matrix.port }} > /dev/null; do sleep 1; done' || {
            echo "Preview server failed to start"
            exit 1
          }
          
          echo "Preview server started on port ${{ matrix.port }}"
      
      - name: Run motion performance tests
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        id: motion_test
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
          MOTION_P95_MS: 20
          MOTION_DROP_PERCENT: 2
        run: |
          pnpm run test:motion 2>&1 | tee motion-output.txt
          
          # Extract P95 frame time from output
          P95=$(grep -oP 'P95:\s+\K\d+(?:\.\d+)?(?=\s*ms)' motion-output.txt | head -1 || echo "")
          
          if [ -n "$P95" ]; then
            echo "p95=$P95" >> $GITHUB_OUTPUT
            echo "✅ Motion P95: ${P95}ms"
          else
            echo "⚠️  Could not extract P95 frame time"
            echo "p95=" >> $GITHUB_OUTPUT
          fi
      
      - name: Post motion metrics comment
        if: always() && github.event_name == 'pull_request' && steps.motion_test.outputs.p95 != ''
        uses: actions/github-script@v7
        with:
          script: |
            const p95 = '${{ steps.motion_test.outputs.p95 }}';
            const app = '${{ matrix.app }}';
            
            const body = `[UX METRIC] app=${app} type=motion p95=${p95}ms`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      
      - name: Stop preview server
        if: always()
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) || true
          fi
      
      - name: Upload motion test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-results-${{ matrix.app }}
          path: handoff/20250928/40_App/${{ matrix.app }}/motion-test-results/
          retention-days: 7

  accessibility-audit:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
        include:
          - app: frontend-dashboard
            port: 4173
          - app: owner-console
            port: 4174
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Run ESLint jsx-a11y checks
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run lint 2>&1 | tee lint-output.txt || true
          
          # Check for jsx-a11y violations
          if grep -q "jsx-a11y" lint-output.txt; then
            echo "⚠️  ESLint jsx-a11y violations found"
            grep "jsx-a11y" lint-output.txt
          else
            echo "✅ No ESLint jsx-a11y violations"
          fi
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run preview --port ${{ matrix.port }} &
          echo $! > preview-server.pid
          
          timeout 30 bash -c 'until curl -s http://localhost:${{ matrix.port }} > /dev/null; do sleep 1; done' || {
            echo "Preview server failed to start"
            exit 1
          }
      
      - name: Run axe-core runtime tests
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        id: a11y_test
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
        run: |
          pnpm run test:a11y 2>&1 | tee a11y-output.txt
          
          # Extract violation counts from output
          CRITICAL=$(grep -oP 'Critical:\s+\K\d+' a11y-output.txt | head -1 || echo "")
          SERIOUS=$(grep -oP 'Serious:\s+\K\d+' a11y-output.txt | head -1 || echo "")
          
          if [ -n "$CRITICAL" ] && [ -n "$SERIOUS" ]; then
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "serious=$SERIOUS" >> $GITHUB_OUTPUT
            echo "✅ a11y violations - Critical: $CRITICAL, Serious: $SERIOUS"
          else
            echo "⚠️  Could not extract a11y violation counts"
            echo "critical=" >> $GITHUB_OUTPUT
            echo "serious=" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Post a11y metrics comment
        if: always() && github.event_name == 'pull_request' && steps.a11y_test.outputs.critical != ''
        uses: actions/github-script@v7
        with:
          script: |
            const critical = '${{ steps.a11y_test.outputs.critical }}';
            const serious = '${{ steps.a11y_test.outputs.serious }}';
            const app = '${{ matrix.app }}';
            
            const body = `[UX METRIC] app=${app} type=a11y critical=${critical} serious=${serious}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      
      - name: Stop preview server
        if: always()
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) || true
          fi
      
      - name: Upload a11y test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results-${{ matrix.app }}
          path: handoff/20250928/40_App/${{ matrix.app }}/a11y-test-results/
          retention-days: 7

  i18n-coverage:
    name: i18n Coverage Check
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      
      - name: Run i18n coverage tests
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        id: i18n_test
        run: |
          pnpm run test:i18n 2>&1 | tee i18n-output.txt
          
          # Extract coverage percentage from output
          COVERAGE=$(grep -oP 'Coverage:\s+\K\d+(?:\.\d+)?(?=%)' i18n-output.txt | head -1 || echo "")
          
          if [ -n "$COVERAGE" ]; then
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "✅ i18n coverage: $COVERAGE%"
          else
            echo "⚠️  Could not extract coverage percentage"
            echo "coverage=" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Post i18n metrics comment
        if: always() && github.event_name == 'pull_request' && steps.i18n_test.outputs.coverage != ''
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.i18n_test.outputs.coverage }}';
            const app = '${{ matrix.app }}';
            const threshold = 95;
            
            const body = `[UX METRIC] app=${app} type=i18n coverage=${coverage}% threshold=${threshold}%`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      
      - name: Upload i18n test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-results-${{ matrix.app }}
          path: handoff/20250928/40_App/${{ matrix.app }}/i18n-test-results/
          retention-days: 7

  a11y-label-sentinel:
    name: A11y Label Visibility Check
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
        include:
          - app: frontend-dashboard
            port: 4173
          - app: owner-console
            port: 4174
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
