          fi

  computed-style-check:
    name: Computed Style Verification
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
        include:
          - app: frontend-dashboard
            port: 4173
          - app: owner-console
            port: 4174
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run preview --port ${{ matrix.port }} &
          echo $! > preview-server.pid
          timeout 30 bash -c 'until curl -s http://localhost:${{ matrix.port }} > /dev/null; do sleep 1; done'
      
      - name: Run computed style checks
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
        run: node ../../../../scripts/ux/check-computed-styles.mjs ${{ matrix.app }} $BASE_URL
      
      - name: Stop preview server
        if: always()
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) || true
          fi

  ai-perceptual-qa:
    name: AI Perceptual QA
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: github.event_name == 'pull_request' && vars.UX_AI_ENABLE == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
        include:
          - app: frontend-dashboard
            port: 4173
          - app: owner-console
            port: 4174
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run preview --port ${{ matrix.port }} &
          echo $! > preview-server.pid
          
          timeout 30 bash -c 'until curl -s http://localhost:${{ matrix.port }} > /dev/null; do sleep 1; done' || {
            echo "Preview server failed to start"
            exit 1
          }
          
          echo "Preview server started on port ${{ matrix.port }}"
      
      - name: Run motion tests (for Delight Index)
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
          MOTION_P95_MS: 20
          MOTION_DROP_PERCENT: 2
        run: pnpm run test:motion
        continue-on-error: true
      
      - name: Run AI Perceptual QA
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
          APP_NAME: ${{ matrix.app }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          UX_AI_MODEL: gpt-4o-mini
          UX_AI_MAX_PAGES: 3
          # Updated thresholds based on Week 2 calibration (PR #1168)
          # Previous: Harmony≥83, Delight≥94 (unattainable - 8.6σ above baseline)
          # Current: Harmony≥76, Delight≥90 (evidence-based, achievable)
          # Baseline from 10 bad cases: Harmony=75.3±0.9, Delight=88.2±0.4
          # Good cases (including maximal compliance PR #1169): Harmony=72.5-75
          UX_HARMONY_MIN: 76
          UX_DELIGHT_MIN: 90
        run: pnpm run ux:qa
        continue-on-error: true
      
      - name: Generate calibration data
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run ux:analyze
        continue-on-error: true
      
      - name: Stop preview server
        if: always()
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) || true
          fi
      
      - name: Upload UX QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-results-${{ matrix.app }}
          path: ux-qa-results/
          retention-days: 7
      
      - name: Upload calibration data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-csv-${{ matrix.app }}
          path: calibration.csv
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Check thresholds and hybrid metrics
        if: always()
        run: |
          if [ -f "ux-qa-results/${{ matrix.app }}-ux-report.json" ]; then
            echo "📊 UX Quality Report generated"
            
            HARMONY=$(jq -r '.harmony.overall' ux-qa-results/${{ matrix.app }}-ux-report.json)
            MOTION=$(jq -r '.motion.overall' ux-qa-results/${{ matrix.app }}-ux-report.json)
            DELIGHT=$(jq -r '.delight.index' ux-qa-results/${{ matrix.app }}-ux-report.json)
            
            echo "🎨 Visual Harmony: $HARMONY/100"
            echo "🎬 Motion Performance: $MOTION/100"
            echo "🎯 Delight Index: $DELIGHT/100"
            echo ""
            
            # === Week 3: Hybrid Metrics (WARNING MODE - Non-blocking) ===
            echo "📋 Hybrid Metrics Analysis (Warning Mode):"
            echo ""
            
            # Check sub-score deltas (Delta Requirements)
            echo "🔍 Sub-score Delta Analysis:"
            BASELINE_HARMONY=75.3
            
            # Extract Dashboard sub-scores
            DASHBOARD_HARMONY=$(jq -r '.harmony.pages[] | select(.name == "Dashboard") | .harmony.overall' ux-qa-results/${{ matrix.app }}-ux-report.json)
            SPACING=$(jq -r '.harmony.pages[] | select(.name == "Dashboard") | .harmony.spacing' ux-qa-results/${{ matrix.app }}-ux-report.json)
            COLOR=$(jq -r '.harmony.pages[] | select(.name == "Dashboard") | .harmony.color' ux-qa-results/${{ matrix.app }}-ux-report.json)
            CONTRAST=$(jq -r '.harmony.pages[] | select(.name == "Dashboard") | .harmony.contrast' ux-qa-results/${{ matrix.app }}-ux-report.json)
            ALIGNMENT=$(jq -r '.harmony.pages[] | select(.name == "Dashboard") | .harmony.alignment' ux-qa-results/${{ matrix.app }}-ux-report.json)
            TYPOGRAPHY=$(jq -r '.harmony.pages[] | select(.name == "Dashboard") | .harmony.typography' ux-qa-results/${{ matrix.app }}-ux-report.json)
            
            echo "  Dashboard Harmony: $DASHBOARD_HARMONY (baseline: $BASELINE_HARMONY)"
            echo "  Sub-scores: Spacing=$SPACING, Color=$COLOR, Contrast=$CONTRAST, Alignment=$ALIGNMENT, Typography=$TYPOGRAPHY"
            
            echo ""
            echo "⚠️  Delta Requirements (Warning Mode):"
            echo "  - Target: ≥2 sub-scores improve by ≥5 points"
            echo "  - Target: No sub-score regresses"
            echo "  - Target: Overall Harmony > $BASELINE_HARMONY"
            echo "  - Status: MONITORING (not blocking)"
            
            echo ""
            echo "⚠️  Accessibility Metrics (Warning Mode):"
            echo "  - a11y violations comparison: Not yet implemented"
            echo "  - WCAG AA compliance: Not yet implemented"
            echo "  - Status: MONITORING (not blocking)"
            
            echo ""
            echo "ℹ️  AI Perceptual QA is informational only (non-blocking)"
            echo "ℹ️  Hybrid metrics are in WARNING MODE for data collection (Week 3)"
          else
            echo "⚠️  UX report not generated (check previous steps for errors)"
          fi

  ux-quality-gate:
    name: UX Quality Gate
    runs-on: ubuntu-latest
    needs: [smoke-tests, tokens-drift-check, visual-regression-test, motion-performance-test, accessibility-audit, i18n-coverage, a11y-label-sentinel, computed-style-check]
    if: always()
    steps:
      - name: Check UX quality results
        run: |
          echo "🎨 UX Ops Pipeline Results:"
          echo "- Smoke Tests: ${{ needs.smoke-tests.result }}"
          echo "- Tokens Drift Check: ${{ needs.tokens-drift-check.result }}"
          echo "- A11y Label Sentinel: ${{ needs.a11y-label-sentinel.result }}"
          echo "- Computed Style Check: ${{ needs.computed-style-check.result }}"
          echo "- Visual Regression: ${{ needs.visual-regression-test.result }}"
          echo "- Motion Performance: ${{ needs.motion-performance-test.result }}"
          echo "- Accessibility Audit: ${{ needs.accessibility-audit.result }}"
          echo "- i18n Coverage: ${{ needs.i18n-coverage.result }}"
          
          # Fail if smoke tests failed (critical - fast fail)
          if [ "${{ needs.smoke-tests.result }}" != "success" ]; then
            echo "❌ UX Quality Gate FAILED: Smoke tests failed"
            exit 1
          fi
          
          # Fail if tokens drift check failed (critical)
          if [ "${{ needs.tokens-drift-check.result }}" != "success" ]; then
            echo "❌ UX Quality Gate FAILED: Design tokens drift detected"
            exit 1
          fi
          
          # Fail if a11y label sentinel failed (critical - prevents visible hidden labels)
          if [ "${{ needs.a11y-label-sentinel.result }}" != "success" ]; then
            echo "❌ UX Quality Gate FAILED: Accessibility labels are visible"
            exit 1
          fi
          
          # Fail if computed style check failed (critical - prevents CSS specificity issues)
          if [ "${{ needs.computed-style-check.result }}" != "success" ]; then
            echo "❌ UX Quality Gate FAILED: Computed styles do not match expected values"
            exit 1
          fi
          
          echo ""
          echo "📋 Phase 3 Warning Mode Summary (Week 3):"
          echo "All UX checks are currently in WARNING MODE (non-blocking)"
          echo ""
          echo "Objective Metrics (Informational):"
          echo "  - Motion Performance: ${{ needs.motion-performance-test.result }}"
          echo "  - VRT: ${{ needs.visual-regression-test.result }}"
          echo "  - A11y: ${{ needs.accessibility-audit.result }}"
          echo "  - i18n: ${{ needs.i18n-coverage.result }}"
          echo ""
          echo "ℹ️  These checks collect data for 1-2 weeks before enabling blocking"
          echo "ℹ️  Review artifacts for detailed metrics and recommendations"
          echo ""
          echo "✅ UX Quality Gate PASSED"
