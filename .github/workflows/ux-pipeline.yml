name: UX Ops Pipeline

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/**'
      - 'handoff/20250928/40_App/owner-console/**'
      - 'packages/shared-ui/**'
      - 'tools/frontend-lab/**'
  push:
    branches: [main, master]
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/**'
      - 'handoff/20250928/40_App/owner-console/**'
      - 'packages/shared-ui/**'

jobs:
  tokens-drift-check:
    name: Design Tokens Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Check tokens consistency
        run: |
          echo "🔍 Checking design tokens consistency..."
          
          CANONICAL_TOKENS="packages/shared-ui/src/tokens.json"
          CANONICAL_HASH=$(md5sum "$CANONICAL_TOKENS" | awk '{print $1}')
          
          echo "Canonical tokens hash: $CANONICAL_HASH"
          echo "Canonical source: $CANONICAL_TOKENS"
          
          # Production apps that MUST match canonical tokens
          PRODUCTION_TOKENS=(
            "handoff/20250928/40_App/frontend-dashboard/public/tokens.json"
            "handoff/20250928/40_App/owner-console/public/tokens.json"
          )
          
          # Check production apps for drift (CRITICAL - blocks merge)
          DRIFT_FOUND=0
          
          for tokens_file in "${PRODUCTION_TOKENS[@]}"; do
            if [ -f "$tokens_file" ]; then
              FILE_HASH=$(md5sum "$tokens_file" | awk '{print $1}')
              
              if [ "$FILE_HASH" != "$CANONICAL_HASH" ]; then
                echo "❌ DRIFT DETECTED: $tokens_file"
                echo "   Expected hash: $CANONICAL_HASH"
                echo "   Actual hash:   $FILE_HASH"
                DRIFT_FOUND=1
              else
                echo "✅ $tokens_file matches canonical"
              fi
            else
              echo "⚠️  Missing: $tokens_file"
              DRIFT_FOUND=1
            fi
          done
          
          # Check non-production tokens (WARN only - does not block)
          echo ""
          echo "📋 Checking non-production tokens (informational only):"
          
          for tokens_file in $(find . -name "tokens.json" -type f | grep -v node_modules | grep -v ".git" | grep -v "$CANONICAL_TOKENS" | grep -v "handoff/20250928/40_App/frontend-dashboard" | grep -v "handoff/20250928/40_App/owner-console"); do
            FILE_HASH=$(md5sum "$tokens_file" | awk '{print $1}')
            
            if [ "$FILE_HASH" != "$CANONICAL_HASH" ]; then
              echo "ℹ️  DRIFT (non-blocking): $tokens_file"
            else
              echo "✓ $tokens_file matches canonical"
            fi
          done
          
          if [ $DRIFT_FOUND -eq 1 ]; then
            echo ""
            echo "❌ Design tokens drift detected in production apps!"
            echo "Production apps must match the canonical source: $CANONICAL_TOKENS"
            echo ""
            echo "To fix:"
            echo "  cp $CANONICAL_TOKENS handoff/20250928/40_App/frontend-dashboard/public/tokens.json"
            echo "  cp $CANONICAL_TOKENS handoff/20250928/40_App/owner-console/public/tokens.json"
            exit 1
          fi
          
          echo ""
          echo "✅ All production tokens are consistent!"

  visual-regression-test:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend-dashboard, owner-console]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Run VRT tests
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run test:vrt
        continue-on-error: true
      
      - name: Upload VRT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-results-${{ matrix.app }}
          path: handoff/20250928/40_App/${{ matrix.app }}/test-results/
          retention-days: 7

  motion-performance-test:
    name: Motion Performance Testing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
        include:
          - app: frontend-dashboard
            port: 4173
          - app: owner-console
            port: 4174
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run preview --port ${{ matrix.port }} &
          echo $! > preview-server.pid
          
          timeout 30 bash -c 'until curl -s http://localhost:${{ matrix.port }} > /dev/null; do sleep 1; done' || {
            echo "Preview server failed to start"
            exit 1
          }
          
          echo "Preview server started on port ${{ matrix.port }}"
      
      - name: Run motion performance tests
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
          MOTION_P95_MS: 20
          MOTION_DROP_PERCENT: 2
        run: pnpm run test:motion
      
      - name: Stop preview server
        if: always()
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) || true
          fi
      
      - name: Upload motion test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-results-${{ matrix.app }}
          path: handoff/20250928/40_App/${{ matrix.app }}/motion-test-results/
          retention-days: 7

  accessibility-audit:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard, owner-console]
        include:
          - app: frontend-dashboard
            port: 4173
          - app: owner-console
            port: 4174
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Run ESLint jsx-a11y checks
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run lint 2>&1 | tee lint-output.txt || true
          
          # Check for jsx-a11y violations
          if grep -q "jsx-a11y" lint-output.txt; then
            echo "⚠️  ESLint jsx-a11y violations found"
            grep "jsx-a11y" lint-output.txt
          else
            echo "✅ No ESLint jsx-a11y violations"
          fi
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run preview --port ${{ matrix.port }} &
          echo $! > preview-server.pid
          
          timeout 30 bash -c 'until curl -s http://localhost:${{ matrix.port }} > /dev/null; do sleep 1; done' || {
            echo "Preview server failed to start"
            exit 1
          }
      
      - name: Run axe-core runtime tests
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
        run: pnpm run test:a11y
      
      - name: Stop preview server
        if: always()
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) || true
          fi
      
      - name: Upload a11y test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results-${{ matrix.app }}
          path: handoff/20250928/40_App/${{ matrix.app }}/a11y-test-results/
          retention-days: 7

  ai-perceptual-qa:
    name: AI Perceptual QA
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-dashboard]
        include:
          - app: frontend-dashboard
            port: 4173
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Workspace install
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui
        run: pnpm --filter @morningai/shared-ui run build
      
      - name: Build application
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: pnpm run build
      
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Start preview server
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          pnpm run preview --port ${{ matrix.port }} &
          echo $! > preview-server.pid
          
          timeout 30 bash -c 'until curl -s http://localhost:${{ matrix.port }} > /dev/null; do sleep 1; done' || {
            echo "Preview server failed to start"
            exit 1
          }
          
          echo "Preview server started on port ${{ matrix.port }}"
      
      - name: Run motion tests (for Delight Index)
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
          MOTION_P95_MS: 20
          MOTION_DROP_PERCENT: 2
        run: pnpm run test:motion
        continue-on-error: true
      
      - name: Run AI Perceptual QA
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
          APP_NAME: ${{ matrix.app }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UX_AI_MODEL: gpt-4o-mini
          UX_AI_MAX_PAGES: 3
          UX_HARMONY_MIN: 70
          UX_DELIGHT_MIN: 75
        run: pnpm run ux:qa
        continue-on-error: true
      
      - name: Stop preview server
        if: always()
        working-directory: handoff/20250928/40_App/${{ matrix.app }}
        run: |
          if [ -f preview-server.pid ]; then
            kill $(cat preview-server.pid) || true
          fi
      
      - name: Upload UX QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-results-${{ matrix.app }}
          path: ux-qa-results/
          retention-days: 7
      
      - name: Check thresholds
        if: always()
        run: |
          if [ -f "ux-qa-results/${{ matrix.app }}-ux-report.json" ]; then
            echo "📊 UX Quality Report generated"
            
            HARMONY=$(jq -r '.harmony.overall' ux-qa-results/${{ matrix.app }}-ux-report.json)
            MOTION=$(jq -r '.motion.overall' ux-qa-results/${{ matrix.app }}-ux-report.json)
            DELIGHT=$(jq -r '.delight.index' ux-qa-results/${{ matrix.app }}-ux-report.json)
            
            echo "🎨 Visual Harmony: $HARMONY/100"
            echo "🎬 Motion Performance: $MOTION/100"
            echo "🎯 Delight Index: $DELIGHT/100"
            echo ""
            echo "ℹ️  AI Perceptual QA is informational only (non-blocking)"
          else
            echo "⏭️  AI Perceptual QA skipped (OPENAI_API_KEY not set)"
          fi

  ux-quality-gate:
    name: UX Quality Gate
    runs-on: ubuntu-latest
    needs: [tokens-drift-check, visual-regression-test, motion-performance-test, accessibility-audit]
    if: always()
    steps:
      - name: Check UX quality results
        run: |
          echo "🎨 UX Ops Pipeline Results:"
          echo "- Tokens Drift Check: ${{ needs.tokens-drift-check.result }}"
          echo "- Visual Regression: ${{ needs.visual-regression-test.result }}"
          echo "- Motion Performance: ${{ needs.motion-performance-test.result }}"
          echo "- Accessibility Audit: ${{ needs.accessibility-audit.result }}"
          
          # Fail if tokens drift check failed (critical)
          if [ "${{ needs.tokens-drift-check.result }}" != "success" ]; then
            echo "❌ UX Quality Gate FAILED: Design tokens drift detected"
            exit 1
          fi
          
          echo "✅ UX Quality Gate PASSED"
