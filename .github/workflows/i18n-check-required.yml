name: i18n-check-required

# This workflow ensures the "Changed Files Strict i18n Check" always runs on PRs to main
# even when no frontend files are changed. This prevents the required check from being
# stuck in "Expected" state when merging backend-only changes.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changed-files-strict-i18n:
    name: Changed Files Strict i18n Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Validate Locale Files (Tolgee Corruption Guard)
        run: |
          set -o pipefail
          
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          
          # Get changed locale files only
          CHANGED_LOCALES=$(git diff --name-only --diff-filter=d "$BASE"..."$HEAD" | \
            grep -E '(owner-console/src/locales|frontend-dashboard/src/i18n/locales)/.*\.json$' || true)
          
          if [ -z "$CHANGED_LOCALES" ]; then
            echo "✅ No locale files changed in this PR - skipping validation"
            exit 0
          fi
          
          echo "Changed locale files:"
          echo "$CHANGED_LOCALES"
          echo ""
          
          # Validate each changed file for demo data patterns
          echo "$CHANGED_LOCALES" | while read -r file; do
            if [ -f "$file" ]; then
              echo "Checking $file for demo data patterns..."
              if grep -q "What to pack\|add-item-add-button\|delete-item-button\|Quoi emballer\|Was mitnehmen" "$file"; then
                echo "❌ ERROR: Tolgee demo data detected in $file!"
                echo "This indicates the Tolgee project contains corrupted/demo data."
                echo "Please fix the Tolgee project data before merging."
                exit 1
              fi
              echo "  ✅ No demo data detected"
            fi
          done
          
          echo ""
          echo "✅ All changed locale files passed validation"
      
      - name: Strict i18n Check on Changed Files
        run: |
          set -o pipefail
          
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          
          echo "Checking changed files between $BASE and $HEAD"
          
          # Get all changed JS/JSX/TS/TSX files (excluding deletions)
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE"..."$HEAD" | grep -E '\.(js|jsx|ts|tsx)$' || true)
          
          if [ -z "$CHANGED" ]; then
            echo "✅ No JS/TS files changed in this PR - skipping i18n check"
            exit 0
          fi
          
          echo "Changed files:"
          echo "$CHANGED"
          
          # Split by workspace
          OC_FILES=$(echo "$CHANGED" | grep 'handoff/.*/40_App/owner-console/src/' || true)
          FD_FILES=$(echo "$CHANGED" | grep 'handoff/.*/40_App/frontend-dashboard/src/' || true)
          
          EXIT_CODE=0
          
          # Check owner-console files
          if [ -n "$OC_FILES" ]; then
            echo ""
            echo "=== Checking owner-console files ==="
            # Strip workspace prefix from paths (convert to workspace-relative)
            OC_FILES_RELATIVE=$(echo "$OC_FILES" | sed 's|^handoff/.*/40_App/owner-console/||')
            echo "Relative paths: $OC_FILES_RELATIVE"
            echo "$OC_FILES_RELATIVE" | xargs -r pnpm -F owner-console exec eslint --quiet --rule 'i18next/no-literal-string: ["error", {"markupOnly": false, "ignoreCallee": ["t","Trans","clsx","cn","tw","cva"]}]' || EXIT_CODE=1
          fi
          
          # Check frontend-dashboard files
          if [ -n "$FD_FILES" ]; then
            echo ""
            echo "=== Checking frontend-dashboard files ==="
            # Strip workspace prefix from paths (convert to workspace-relative)
            FD_FILES_RELATIVE=$(echo "$FD_FILES" | sed 's|^handoff/.*/40_App/frontend-dashboard/||')
            echo "Relative paths: $FD_FILES_RELATIVE"
            echo "$FD_FILES_RELATIVE" | xargs -r pnpm -F frontend-dashboard exec eslint --quiet --rule 'i18next/no-literal-string: ["error", {"markupOnly": false, "ignoreCallee": ["t","Trans","clsx","cn","tw","cva"]}]' || EXIT_CODE=1
          fi
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ i18n violations found in changed files!"
            echo "All user-visible strings must use t() or <Trans> for internationalization."
            echo "Note: This strict check enforces i18n on ALL user-visible strings, including object properties."
            exit 1
          fi
          
          echo ""
          echo "✅ All changed files pass strict i18n check!"
