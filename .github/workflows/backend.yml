name: backend-ci
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'handoff/20250928/50_Infra/**'
      - 'handoff/20250928/60_Design/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'handoff/20250928/50_Infra/**'
      - 'handoff/20250928/60_Design/**'

# Centralized version management - update here to change across all jobs
env:
  RUFF_VERSION: "0.8.6"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    # Lint is now blocking - all lint errors have been fixed
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v2
        with:
          version: ${{ env.RUFF_VERSION }}
          args: "check handoff/20250928/40_App/api-backend/src --output-format=github"
      - name: Show Ruff version (actual)
        run: ruff --version
      - name: Show Ruff statistics
        if: always()
        run: ruff check handoff/20250928/40_App/api-backend/src --statistics || true
      - name: Generate lint summary
        if: always()
        run: |
          ACTUAL_VERSION=$(ruff --version)
          echo "### Ruff Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ruff Version**: ${ACTUAL_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Ruff lint passed - no errors found**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Ruff found lint issues** (see annotations above)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`pip install ruff==${{ env.RUFF_VERSION }} && ruff check handoff/20250928/40_App/api-backend/src --fix\` to auto-fix issues." >> $GITHUB_STEP_SUMMARY
          fi

  validate-env-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pyyaml
      - name: Validate environment schema
        run: |
          python - <<'EOF'
          import yaml
          import sys
          
          with open('config/env.schema.yaml', 'r') as f:
              schema = yaml.safe_load(f)
          
          required_keys = ['version', 'description', 'fields']
          for key in required_keys:
              if key not in schema:
                  print(f"❌ Missing required key: {key}")
                  sys.exit(1)
          
          errors = []
          for var_name, var_config in schema['fields'].items():
              if 'type' not in var_config:
                  errors.append(f"{var_name}: missing 'type'")
              if 'description' not in var_config or not var_config['description']:
                  errors.append(f"{var_name}: missing 'description'")
              if 'category' not in var_config:
                  errors.append(f"{var_name}: missing 'category'")
          
          if errors:
              print("❌ Schema validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)
          
          print(f"✅ Schema valid: {len(schema['fields'])} variables defined")
          EOF
      - name: Check for environment config drift
        run: |
          python scripts/check-env-drift.py
  
  validate-openapi-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAPI validator
        run: |
          pip install openapi-spec-validator pyyaml
      - name: Validate OpenAPI spec
        run: |
          python - <<'EOF'
          from openapi_spec_validator import validate_spec
          from openapi_spec_validator.readers import read_from_filename
          import sys
          
          try:
              spec_dict, spec_url = read_from_filename('docs/openapi.yaml')
              validate_spec(spec_dict)
              print("✅ OpenAPI spec is valid (OpenAPI 3.0.3)")
              print(f"   - API: {spec_dict['info']['title']} v{spec_dict['info']['version']}")
              print(f"   - Endpoints: {len(spec_dict['paths'])} paths")
              print(f"   - Schemas: {len(spec_dict['components']['schemas'])} components")
          except Exception as e:
              print(f"❌ OpenAPI spec validation failed: {e}")
              sys.exit(1)
          EOF
  
  test:
    needs: [lint, validate-env-schema, validate-openapi-spec]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.x'
      - name: Install dependencies
        run: |
          cd handoff/20250928/40_App/api-backend
          pip uninstall -y jwt || true
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
          cd ../orchestrator
          pip install -e .
      - name: Run tests with coverage
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
        run: |
          cd handoff/20250928/40_App/api-backend
          python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=80 -v
          echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m coverage report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            handoff/20250928/40_App/api-backend/coverage.xml
            handoff/20250928/40_App/api-backend/coverage.json
          retention-days: 30
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read coverage JSON
            const coveragePath = path.join(process.cwd(), 'handoff/20250928/40_App/api-backend/coverage.json');
            let coverage;
            try {
              coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            } catch (e) {
              console.log('Could not read coverage.json:', e.message);
              return;
            }
            
            const totals = coverage.totals;
            const threshold = 80;
            
            // Helper functions
            const getStatus = (pct) => pct >= threshold ? '✅' : '❌';
            
            // Build comment
            const comment = `## 📊 API Backend 測試覆蓋率報告
            
            | 指標 | 覆蓋率 | 狀態 |
            |------|--------|------|
            | Lines | ${totals.percent_covered.toFixed(2)}% | ${getStatus(totals.percent_covered)} |
            | Covered Lines | ${totals.covered_lines} / ${totals.num_statements} | - |
            | Missing Lines | ${totals.missing_lines} | - |
            
            **門檻要求**: ${threshold}% 最低標準 (已從 74% 提升至 80%)
            
            ${totals.percent_covered >= threshold 
              ? '✅ **覆蓋率門檻已達標！**' 
              : '❌ **覆蓋率未達標，請補充測試。**'}
            
            ---
            
            [查看完整覆蓋率報告](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('API Backend 測試覆蓋率報告')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
