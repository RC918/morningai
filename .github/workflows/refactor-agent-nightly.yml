name: Refactor Agent Nightly Run

on:
  schedule:
    # Run at 00:00 UTC daily (low traffic time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      max_errors:
        description: 'Maximum number of errors to fix (default: 10)'
        required: false
        default: '10'
        type: string
      dry_run:
        description: 'Dry run mode (no actual changes)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  refactor:
    name: Run Refactor Agent
    runs-on: ubuntu-latest
    # Only run if REFACTOR_AGENT_ENABLED is explicitly set to true
    # This prevents accidental PR creation before staging validation
    if: ${{ vars.REFACTOR_AGENT_ENABLED == 'true' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node.js/pnpm setup for TypeScript environment (required for accurate error detection)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build

      - name: Check if refactor needed (early exit if baseline=0)
        id: check_baseline
        run: |
          # Run the baseline check script
          ./scripts/count-strict-errors.sh
          
          # Read total errors from baseline file
          TOTAL=$(jq -r '[.packages[].error_count] | add' .strict-baseline.json)
          echo "Total strict errors in baseline: $TOTAL"
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "No strict errors to fix (baseline=0), skipping refactor"
            echo "skip_refactor=true" >> $GITHUB_OUTPUT
          else
            echo "Found $TOTAL strict errors, proceeding with refactor"
            echo "skip_refactor=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_baseline.outputs.skip_refactor != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        if: steps.check_baseline.outputs.skip_refactor != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r handoff/20250928/40_App/orchestrator/requirements.txt

      - name: Configure Git
        if: steps.check_baseline.outputs.skip_refactor != 'true'
        run: |
          git config --global user.name "Refactor Agent"
          git config --global user.email "refactor-agent@morningai.com"

      - name: Run Refactor Agent
        if: steps.check_baseline.outputs.skip_refactor != 'true'
        id: refactor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/handoff/20250928/40_App/orchestrator:${{ github.workspace }}/handoff/20250928/40_App/api-backend/src
          REFACTOR_AGENT_AUTO_PR: ${{ vars.REFACTOR_AGENT_AUTO_PR }}
        run: |
          # For workflow_dispatch: use input value, fallback to repo variable, then default
          # For scheduled runs: use repo variable, then default
          MAX_ERRORS="${{ github.event.inputs.max_errors || vars.REFACTOR_AGENT_MAX_ERRORS || '10' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "Running Refactor Agent with max_errors=$MAX_ERRORS, dry_run=$DRY_RUN"

          # NOTE: Using legacy refactor_agent.agent (deprecated) because RefactorAgentV2
          # does not yet have full PR automation features (run_refactor, create_pr).
          # See Issue #4232 for migration tracking.
          python -c "
          import warnings
          warnings.filterwarnings('ignore', category=DeprecationWarning)
          import json
          from refactor_agent.agent import run_nightly_refactor

          result = run_nightly_refactor(
              max_errors=int('$MAX_ERRORS'),
              dry_run='$DRY_RUN' == 'true'
          )

          print('=== Refactor Agent Results ===')
          print(f'Run ID: {result.run_id}')
          print(f'Total errors found: {result.total_errors_found}')
          print(f'Errors fixed: {result.errors_fixed}')
          print(f'Errors failed: {result.errors_failed}')
          print(f'Summary: {result.summary}')
          if result.pr_url:
              print(f'PR URL: {result.pr_url}')

          # Output for GitHub Actions
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'run_id={result.run_id}\n')
              f.write(f'total_errors={result.total_errors_found}\n')
              f.write(f'errors_fixed={result.errors_fixed}\n')
              f.write(f'errors_failed={result.errors_failed}\n')
              f.write(f'summary={result.summary}\n')
              f.write(f'pr_url={result.pr_url or \"\"}\n')
          "

      - name: Create summary
        if: always()
        run: |
          echo "## Refactor Agent Nightly Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_baseline.outputs.skip_refactor }}" == "true" ]; then
            echo "**Status**: Skipped (baseline=0, no strict errors to fix)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All TypeScript strict mode packages are at 0 errors. No refactoring needed." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Run ID | ${{ steps.refactor.outputs.run_id }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Errors Found | ${{ steps.refactor.outputs.total_errors }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors Fixed | ${{ steps.refactor.outputs.errors_fixed }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors Failed | ${{ steps.refactor.outputs.errors_failed }} |" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ steps.refactor.outputs.pr_url }}" ]; then
              echo "| PR URL | ${{ steps.refactor.outputs.pr_url }} |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Summary" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.refactor.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure() && steps.check_baseline.outputs.skip_refactor != 'true'
        run: |
          echo "::error::Refactor Agent nightly run failed. Check the logs for details."
