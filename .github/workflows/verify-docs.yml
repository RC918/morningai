name: Verify Documentation Consistency

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'handoff/20250928/40_App/*/package.json'
      - 'render.yaml'
      - 'migrations/**'
      - 'agents/*/migrations/**'
      - 'handoff/20250928/40_App/api-backend/requirements.txt'
      - 'config/env.schema.yaml'
      - 'config/architecture-manifest.yaml'
      - 'scripts/generate-env-reference.py'
      - 'scripts/verify_architecture_manifest.py'
  workflow_dispatch:

jobs:
  verify-system-state:
    name: Verify Documentation vs Code Consistency
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Make verification script executable
        run: chmod +x scripts/verify_system_state.sh
      
      - name: Run system state verification
        id: verify
        run: |
          echo "Running verification script..."
          ./scripts/verify_system_state.sh --verbose
        continue-on-error: true
      
      - name: Check verification result
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Documentation verification failed! Please ensure documentation matches code state."
          echo "::error::Run './scripts/verify_system_state.sh --verbose' locally to see detailed errors."
          exit 1
      
      - name: Post success comment
        # Note: Dependabot PRs have limited token permissions and cannot post comments.
        # Using continue-on-error to prevent CI failure when comment posting fails.
        if: steps.verify.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Documentation Verification Passed**\n\nAll documentation claims have been verified against the actual code state.\n\n- React versions: ✓\n- pgvector implementation: ✓\n- Orchestrator architecture: ✓\n- URL mappings: ✓\n- Alembic status: ✓\n- Phase API modules: ✓\n- Dependencies: ✓\n- ADRs: ✓'
            })

  check-terminology:
    name: Verify Terminology Consistency
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Check URL mapping consistency
        run: |
          echo "Checking URL mapping consistency..."
          
          # Check that TERMINOLOGY.md exists
          if [ ! -f "docs/TERMINOLOGY.md" ]; then
            echo "::error::docs/TERMINOLOGY.md not found!"
            exit 1
          fi
          
          # Check that app.gm365.me is documented as Tenant Dashboard
          if ! grep -q "app.gm365.me" docs/TERMINOLOGY.md; then
            echo "::error::app.gm365.me not found in TERMINOLOGY.md"
            exit 1
          fi
          
          # Check that admin.gm365.me is documented as Owner Console
          if ! grep -q "admin.gm365.me" docs/TERMINOLOGY.md; then
            echo "::error::admin.gm365.me not found in TERMINOLOGY.md"
            exit 1
          fi
          
          echo "✓ URL mappings are consistent"
      
      - name: Check for outdated terminology
        run: |
          echo "Checking for outdated terminology..."
          
          # Check for old "frontend" references (should be "Tenant Dashboard" or "Owner Console")
          OUTDATED_REFS=$(grep -r "frontend dashboard" docs/ --include="*.md" || true)
          
          if [ -n "$OUTDATED_REFS" ]; then
            echo "::warning::Found potentially outdated 'frontend dashboard' references:"
            echo "$OUTDATED_REFS"
            echo "Consider using 'Tenant Dashboard' or 'Owner Console' instead."
          fi
          
          echo "✓ Terminology check complete"

  check-broken-links:
    name: Check for Broken Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install lychee
        run: |
          curl -sL https://github.com/lycheeverse/lychee/releases/download/v0.15.1/lychee-v0.15.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/
      
      - name: Check links in documentation
        run: |
          echo "Checking for broken links in documentation..."
          lychee --verbose --no-progress \
            --exclude 'localhost' \
            --exclude '127.0.0.1' \
            --exclude 'example.com' \
            --exclude 'vercel.app' \
            --exclude 'render.com' \
            --exclude 'supabase.co' \
            --exclude 'upstash.io' \
            --exclude 'sentry.io' \
            --exclude 'github.com/RC918/morningai/pull' \
            --exclude 'github.com/RC918/morningai/issues' \
            --exclude 'app.devin.ai' \
            'docs/**/*.md' \
            'README.md' \
            || true
        continue-on-error: true
      
      - name: Report broken links
        run: |
          echo "::notice::Link check complete. Review output above for any broken links."

  verify-test-documentation:
    name: Verify Test Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Check test statistics documentation
        run: |
          echo "Checking test statistics documentation..."
          
          if [ -f "docs/TEST_STATISTICS_EXPLANATION.md" ]; then
            echo "✓ TEST_STATISTICS_EXPLANATION.md exists"
            
            # Check that it explains the three key numbers
            if grep -q "487 tests collected" docs/TEST_STATISTICS_EXPLANATION.md && \
               grep -q "926 tests passed" docs/TEST_STATISTICS_EXPLANATION.md && \
               grep -q "23 passed" docs/TEST_STATISTICS_EXPLANATION.md; then
              echo "✓ All three key test numbers are documented"
            else
              echo "::warning::TEST_STATISTICS_EXPLANATION.md may be missing some key numbers"
            fi
          else
            echo "::warning::docs/TEST_STATISTICS_EXPLANATION.md not found"
            echo "Consider creating this file to explain test statistics"
          fi

  verify-env-reference:
    name: Verify ENV_REFERENCE.md Sync
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install PyYAML
      
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/scripts" >> $GITHUB_ENV
      
      - name: Regenerate ENV_REFERENCE.md
        run: python scripts/generate-env-reference.py
      
      - name: Check for drift
        run: |
          echo "Checking if ENV_REFERENCE.md is in sync with env.schema.yaml..."
          
          if git diff --exit-code docs/ENV_REFERENCE.md; then
            echo "✅ ENV_REFERENCE.md is in sync with env.schema.yaml"
          else
            echo "::error::ENV_REFERENCE.md is out of sync with env.schema.yaml!"
            echo "::error::Run 'python scripts/generate-env-reference.py' locally and commit the changes."
            echo ""
            echo "Diff:"
            git diff docs/ENV_REFERENCE.md
            exit 1
          fi

  verify-architecture-manifest:
    name: Verify Architecture Manifest (Epic #2465)
    runs-on: ubuntu-latest
    # Note: This check is now BLOCKING after Issue #2661 cleanup.
    # All documentation errors have been fixed and the verification script passes.
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install PyYAML
      
      - name: Make verification script executable
        run: chmod +x scripts/verify_architecture_manifest.py
      
      - name: Verify architecture manifest
        id: verify-manifest
        run: |
          echo "Running architecture manifest verification..."
          python scripts/verify_architecture_manifest.py --verbose
      
      - name: Post success comment
        # Only post success if verification actually passed (step outcome == success)
        if: steps.verify-manifest.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Architecture Manifest Verification Passed**\n\nAll architecture claims have been verified:\n\n- Required paths: ✓\n- Service entrypoints: ✓\n- No invalid path aliases (hallucinations): ✓\n- Link security (HTTPS): ✓'
            })

  check-link-security:
    name: Check Link Security (HTTPS)
    runs-on: ubuntu-latest
    # Note: This check is now BLOCKING after Issue #2661 cleanup.
    # All HTTP links have been fixed or excluded (code examples, internal services).
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Check for insecure HTTP links
        run: |
          echo "Checking for insecure HTTP links in documentation..."
          
          # Find HTTP links, then exclude localhost, local IPs, and known code examples
          # Note: Using two-stage grep because -E (ERE) doesn't support negative lookahead
          INSECURE_LINKS=$(grep -rE 'http://[^[:space:])>]+' docs/ --include="*.md" \
            | grep -vE 'http://(localhost|127\.0\.0\.1|0\.0\.0\.0)' \
            | grep -vE 'http://example\.com' \
            | grep -vE 'http://mcp-server' \
            | grep -vE 'http://`' \
            || true)
          
          if [ -n "$INSECURE_LINKS" ]; then
            echo "::error::Found insecure HTTP links in documentation:"
            echo "$INSECURE_LINKS"
            echo ""
            echo "Please update these links to use HTTPS."
            exit 1
          else
            echo "✅ No insecure HTTP links found in documentation"
          fi
