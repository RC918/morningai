name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    name: Validate PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed PR title prefixes (conventional commit types)
          types: |
            feat
            fix
            refactor
            docs
            test
            bot
            deps
            chore
            style
            perf
          # Scope is optional (e.g., feat(auth): or just feat:)
          requireScope: false
          # Subject must have at least one character
          subjectPattern: ^.+$
          subjectPatternError: |
            PR title must follow format: <type>: <description>
            
            Allowed types:
            - feat:     New feature
            - fix:      Bug fix
            - refactor: Code refactoring (no behavior change)
            - docs:     Documentation updates
            - test:     Test-related changes
            - bot:      Automated/bot PRs
            - deps:     Dependency updates
            - chore:    Miscellaneous maintenance
            - style:    Code style changes (no logic change)
            - perf:     Performance improvements
            
            Examples:
            - feat: add user dashboard
            - fix: resolve login timeout
            - docs: update API documentation

      - name: Comment on PR (if validation fails)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const body = [
              '## PR Title Format Error',
              '',
              'Your PR title does not follow the required format.',
              '',
              '**Current title:** `' + prTitle + '`',
              '',
              '**Required format:** `<type>: <description>`',
              '',
              '### Allowed Types',
              '',
              '| Type | Description | Example |',
              '|------|-------------|---------|',
              '| `feat:` | New feature | `feat: add user dashboard` |',
              '| `fix:` | Bug fix | `fix: resolve login timeout` |',
              '| `refactor:` | Code refactoring | `refactor: extract auth service` |',
              '| `docs:` | Documentation | `docs: update API documentation` |',
              '| `test:` | Test changes | `test: add unit tests for auth` |',
              '| `bot:` | Automated PRs | `bot: update dependencies` |',
              '| `deps:` | Dependency updates | `deps: bump react to 19.0.0` |',
              '| `chore:` | Maintenance | `chore: update CI config` |',
              '| `style:` | Code style | `style: format with prettier` |',
              '| `perf:` | Performance | `perf: optimize database queries` |',
              '',
              '### How to Fix',
              '',
              'Edit your PR title to follow the format above. The CI will automatically re-run.',
              '',
              '---',
              'See [docs/development/commit_hygiene.md](../blob/main/docs/development/commit_hygiene.md) for more details.'
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('PR Title Format Error')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
