# Configuration Drift Detection Workflow
# Issue #4186: Implement configuration drift detection
# Blueprint Alignment: Section 4.3 Model Governance Framework v2 - Drift Monitoring
#
# This workflow detects drift between IaC defaults (render.yaml) and schema
# definitions (env.schema.yaml) on every PR.

name: Configuration Drift Check

on:
  pull_request:
    paths:
      - 'render.yaml'
      - 'config/env.schema.yaml'
      - 'scripts/detect_config_drift.py'
      - '.github/workflows/config-drift-check.yml'
  push:
    branches:
      - main
    paths:
      - 'render.yaml'
      - 'config/env.schema.yaml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  detect-drift:
    name: Detect Configuration Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run drift detection
        id: drift-check
        run: |
          python scripts/detect_config_drift.py --severity medium --strict 2>&1 | tee drift-report.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          
          # Create summary for PR
          echo "## Configuration Drift Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat drift-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          exit $exit_code
        continue-on-error: true

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.txt
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.drift-check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.txt', 'utf8');
            
            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Configuration Drift Detection')
            );
            
            const body = `## Configuration Drift Detection Report
            
            :warning: **Drift detected between \`render.yaml\` and \`env.schema.yaml\`**
            
            <details>
            <summary>Click to expand full report</summary>
            
            \`\`\`
            ${report}
            \`\`\`
            
            </details>
            
            ### Next Steps
            1. Review the drift items above
            2. Update \`render.yaml\` or \`env.schema.yaml\` to resolve discrepancies
            3. For intentional differences, document them in the schema notes
            
            ---
            *This comment is automatically generated by the Configuration Drift Check workflow.*
            `;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Check result
        if: steps.drift-check.outputs.exit_code == '1'
        run: |
          echo "::warning::Configuration drift detected. Please review the drift report."
          # Note: We don't fail the build by default, only warn
          # To block merge on drift, uncomment the line below:
          # exit 1
