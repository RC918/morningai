name: Check os.getenv Usage

on:
  pull_request:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/api-backend/src/**'
      - '.github/workflows/check-os-getenv.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-os-getenv:
    name: Check os.getenv Prohibition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for os.getenv usage in api-backend/src
        id: check
        run: |
          echo "Checking for os.getenv() usage in api-backend/src..."
          echo ""
          
          # Define the search path
          SEARCH_PATH="handoff/20250928/40_App/api-backend/src"
          
          # Define allowlist files (relative to repo root)
          # These files are allowed to use os.getenv()
          ALLOWLIST=(
            "handoff/20250928/40_App/api-backend/src/common/config/settings.py"
          )
          
          # Find all Python files with os.getenv
          VIOLATIONS=""
          VIOLATION_COUNT=0
          
          # Search for os.getenv patterns
          while IFS= read -r file; do
            # Skip if file is in allowlist
            SKIP=false
            for allowed in "${ALLOWLIST[@]}"; do
              if [[ "$file" == "$allowed" ]]; then
                SKIP=true
                break
              fi
            done
            
            if [[ "$SKIP" == "true" ]]; then
              echo "ALLOWED: $file (in allowlist)"
              continue
            fi
            
            # Check if file contains os.getenv
            if grep -n "os\.getenv\|os\.environ\[" "$file" 2>/dev/null; then
              echo "VIOLATION: $file"
              VIOLATIONS="$VIOLATIONS\n$file"
              VIOLATION_COUNT=$((VIOLATION_COUNT + 1))
            fi
          done < <(find "$SEARCH_PATH" -name "*.py" -type f 2>/dev/null)
          
          echo ""
          echo "=== Summary ==="
          
          if [[ $VIOLATION_COUNT -gt 0 ]]; then
            echo "Found $VIOLATION_COUNT file(s) with os.getenv() usage outside allowlist:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Please use 'from common.config.settings import settings' instead."
            echo "Access environment variables via settings.variable_name"
            echo ""
            echo "If you need to add a new environment variable:"
            echo "1. Add it to common/config/settings.py"
            echo "2. Add it to config/env.schema.yaml"
            echo "3. Use settings.your_variable_name in your code"
            exit 1
          else
            echo "No os.getenv() violations found."
            echo "All environment variable access is properly centralized."
          fi
      
      - name: Comment on PR if violations found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## os.getenv() Prohibition Check Failed
            
            This PR introduces \`os.getenv()\` or \`os.environ[]\` usage in \`api-backend/src/\`.
            
            **Why this matters:**
            - Centralized settings provide type safety and validation
            - Environment variables should be documented in \`env.schema.yaml\`
            - Using \`settings.variable_name\` ensures consistent defaults
            
            **How to fix:**
            1. Import settings: \`from common.config.settings import settings\`
            2. Access variables: \`settings.your_variable_name\`
            3. If adding new variables, update \`common/config/settings.py\` and \`config/env.schema.yaml\`
            
            **Allowlist:**
            - \`common/config/settings.py\` (the centralized settings module)
            
            See [Epic #2374](https://github.com/RC918/morningai/issues/2374) for context.
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('os.getenv() Prohibition Check')
            );
            
            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
