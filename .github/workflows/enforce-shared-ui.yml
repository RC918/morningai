name: Enforce Shared-UI Usage

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/**'
      - 'handoff/20250928/40_App/owner-console/**'
      - 'scripts/audit-shared-ui-imports.sh'
      - '.github/workflows/enforce-shared-ui.yml'

concurrency:
  group: audit-shared-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit-imports:
    name: Audit UI Library Imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: List changed files (diff-only mode)
        if: github.event_name == 'pull_request'
        id: list_files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const changedFiles = files
              .map(f => f.filename)
              .filter(f => 
                f.startsWith('handoff/20250928/40_App/frontend-dashboard/') ||
                f.startsWith('handoff/20250928/40_App/owner-console/')
              )
              .join('\n');
            
            core.setOutput('files', changedFiles);
            core.setOutput('count', files.length);
            
            console.log(`Found ${files.length} changed files in PR`);
            if (changedFiles) {
              console.log('Relevant files for audit:');
              console.log(changedFiles);
            }
      
      - name: Make audit script executable
        run: chmod +x ./scripts/audit-shared-ui-imports.sh
      
      - name: Run import audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          echo "Running shared-ui import audit (Stage 3: full enforcement)..."
          ./scripts/audit-shared-ui-imports.sh 2>&1 | tee audit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "✅ Audit completed (exit code: $EXIT_CODE)"
          set -e
        env:
          GIT_REPO: ${{ github.repository }}
          GIT_PR: ${{ github.event.pull_request.number }}
          GIT_COMMIT: ${{ github.sha }}
          CHANGED_FILES: ${{ steps.list_files.outputs.files }}
          DIFF_ONLY: 'false'
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shared-ui-import-audit
          path: |
            audit-output.txt
            .github/artifacts/design-system-violations.json
          retention-days: 30
      
      - name: Parse audit results
        if: always()
        id: parse
        run: |
          if [ -f audit-output.txt ]; then
            VIOLATIONS=$(grep -oP "Violations found: \K\d+" audit-output.txt || echo "0")
            FILES_SCANNED=$(grep -oP "Files scanned: \K\d+" audit-output.txt || echo "0")
            
            echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
            echo "files_scanned=$FILES_SCANNED" >> $GITHUB_OUTPUT
            
            echo "📊 Audit Results:"
            echo "  Files scanned: $FILES_SCANNED"
            echo "  Violations found: $VIOLATIONS"
          else
            echo "⚠️ No audit output found"
            echo "violations=0" >> $GITHUB_OUTPUT
            echo "files_scanned=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on PR (violations detected)
        if: github.event_name == 'pull_request' && always() && steps.parse.outputs.violations != '0' && github.event.pull_request.head.repo.fork == false
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: ai-gate:design-system
          body: |
            ## 🎨 Shared-UI Import Compliance Audit
            
            **Stage**: 3 (Full Enforcement - Blocking)
            **Status**: ❌ Violations detected - PR blocked
            
            **Summary**:
            - 📁 Files scanned: ${{ steps.parse.outputs.files_scanned }}
            - ⚠️ Violations found: ${{ steps.parse.outputs.violations }}
            
            ### ❌ Violations Detected - PR Cannot Be Merged
            
            Direct imports of UI component libraries were found in your changes. This PR is **blocked** until violations are resolved.
            
            **Required Actions**:
            1. **Replace with @morningai/shared-ui**: Use centralized components instead of direct imports
            2. **Add to shared-ui**: If component doesn't exist, add it to shared-ui first
            3. **Allowed exceptions**: lucide-react (icons), recharts (charts), date-fns (dates)
            
            📎 [View detailed audit report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            📄 [Download JSON artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - Machine-readable format for AI gates
            
            ### 📚 Documentation
            - **Quick Fix Guide** (2 min): `docs/DESIGN_SYSTEM_QUICKSTART.md`
            - **Full Documentation**: `docs/DESIGN_SYSTEM_ENFORCEMENT.md`
            
            ### 🚨 Emergency Override
            
            If you have a legitimate emergency that requires bypassing this check:
            1. Contact @RC918 for approval
            2. Admin must temporarily remove "Audit UI Library Imports" from branch protection
            3. Merge the PR
            4. Re-enable the check immediately
            5. Create a follow-up issue to fix the violation
            
            **Note**: There is no automatic bypass mechanism. All exceptions require explicit admin approval.
            
            ---
            
            🤖 **AI Gateway Integration**: This comment uses stable tag `ai-gate:design-system` for consumption by Gemini 3 Pro, GPT-5.1, and LLM Planner.
            
            ---
            
            ℹ️ **Stage 3 (Full Enforcement)**: All files in the codebase are checked on every PR. Any violation will block the PR.
      
      - name: Comment on PR (no violations)
        if: github.event_name == 'pull_request' && always() && steps.parse.outputs.violations == '0' && github.event.pull_request.head.repo.fork == false
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: ai-gate:design-system
          body: |
            ## 🎨 Shared-UI Import Compliance Audit
            
            **Stage**: 3 (Full Enforcement - Blocking)
            **Status**: ✅ Audit passed
            
            **Summary**:
            - 📁 Files scanned: ${{ steps.parse.outputs.files_scanned }}
            - ⚠️ Violations found: 0
            
            ### ✅ No Violations
            
            All imports in your changes comply with shared-ui policy. Great work!
            
            **Allowed libraries**:
            - ✅ @morningai/shared-ui (preferred)
            - ✅ lucide-react (icons)
            - ✅ recharts (charts)
            - ✅ date-fns (dates)
            
            📎 [View detailed audit report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            
            🤖 **AI Gateway Integration**: This comment uses stable tag `ai-gate:design-system` for consumption by AI quality gates.
            
            ---
            
            ℹ️ **Stage 3 (Full Enforcement)**: All files in the codebase are checked on every PR. Any violation will block the PR.
      
      - name: Add job summary
        if: always()
        run: |
          echo "## 🎨 Shared-UI Import Compliance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stage**: 3 (Full Enforcement - Blocking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "- 📁 Files scanned: ${{ steps.parse.outputs.files_scanned }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Violations found: ${{ steps.parse.outputs.violations }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.parse.outputs.violations }}" -gt 0 ]; then
            echo "❌ **Violations detected - PR BLOCKED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Required Actions**:" >> $GITHUB_STEP_SUMMARY
            echo "1. Replace direct UI library imports with @morningai/shared-ui" >> $GITHUB_STEP_SUMMARY
            echo "2. Add missing components to shared-ui if needed" >> $GITHUB_STEP_SUMMARY
            echo "3. Use allowed exceptions: lucide-react, recharts, date-fns" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Emergency Override**: Contact @RC918 for admin approval to temporarily disable check" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No violations** - All imports comply with shared-ui policy" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **Stage 3**: All files in the codebase are checked. Any violation will block the PR." >> $GITHUB_STEP_SUMMARY
      
      - name: Fail if violations exist (Stage 3 enforcement)
        if: steps.parse.outputs.violations != '0' || steps.audit.outputs.exit_code != '0' || steps.audit.outcome == 'failure'
        run: |
          echo "❌ Design system violations detected or audit failed."
          echo "This PR cannot be merged until violations are resolved."
          echo ""
          echo "Audit exit code: ${{ steps.audit.outputs.exit_code }}"
          echo "Audit outcome: ${{ steps.audit.outcome }}"
          echo "Violations found: ${{ steps.parse.outputs.violations }}"
          echo ""
          echo "See the PR comment for details and quick fix guide."
          exit 1
