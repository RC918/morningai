name: Secret Scanning

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Only fetch commits in PR for faster scanning
          # Full history scan only on manual trigger or main branch
          fetch-depth: ${{ github.event_name == 'pull_request' && 100 || 0 }}

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for Gitleaks Pro features

      - name: Upload Gitleaks Report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Only fetch commits in PR for faster scanning
          fetch-depth: ${{ github.event_name == 'pull_request' && 100 || 0 }}

      - name: Run TruffleHog (PR - Incremental Scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.92.4
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Run TruffleHog (Main/Manual - Full Scan)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@v3.92.4
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified

      - name: Upload TruffleHog Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trufflehog-report
          path: results.json
          retention-days: 7
          if-no-files-found: ignore

  pip-audit:
    name: Python Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_vulnerabilities: ${{ steps.check-vulns.outputs.has_vulnerabilities }}
      vuln_count: ${{ steps.check-vulns.outputs.vuln_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Detect metrics-only changes for PRs to skip heavy scans
      # Metrics files pattern (same as ux-metrics-update.yml):
      # - metrics/ux-metrics.json
      # - handoff/.../owner-console/public/metrics/ux-metrics.json
      # - handoff/.../frontend-dashboard/public/metrics/ux-metrics.json
      - name: Detect metrics-only changes (PR only)
        id: detect-metrics-only
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('only_metrics', 'false');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );

            const isMetricsFile = (f) =>
              /^(metrics\/ux-metrics\.json|handoff\/.+\/40_App\/(owner-console|frontend-dashboard)\/public\/metrics\/ux-metrics\.json)$/
                .test(f.filename);

            const metricsFiles = files.filter(f => isMetricsFile(f));
            const nonMetricsFiles = files.filter(f => !isMetricsFile(f));
            const onlyMetrics = metricsFiles.length > 0 && nonMetricsFiles.length === 0;

            core.info(`metricsFiles=${metricsFiles.length}, nonMetricsFiles=${nonMetricsFiles.length}, onlyMetrics=${onlyMetrics}`);
            core.setOutput('only_metrics', onlyMetrics ? 'true' : 'false');

      - name: Export metrics-only flag
        id: export-metrics-flag
        run: echo "ONLY_METRICS=${{ steps.detect-metrics-only.outputs.only_metrics || 'false' }}" >> $GITHUB_ENV

      - name: Setup Python
        if: env.ONLY_METRICS != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pip-audit
        if: env.ONLY_METRICS != 'true'
        run: |
          pip install pip-audit==2.10.0

      - name: Run pip-audit on api-backend
        id: audit-backend
        if: env.ONLY_METRICS != 'true'
        continue-on-error: true
        run: |
          cd handoff/20250928/40_App/api-backend
          if [ -f "requirements.txt" ]; then
            echo "## 🔍 API Backend Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if pip-audit -r requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1; then
              echo "has_vulns=false" >> $GITHUB_OUTPUT
            else
              echo "has_vulns=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No requirements.txt found in api-backend"
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pip-audit on orchestrator
        id: audit-orchestrator
        if: env.ONLY_METRICS != 'true'
        continue-on-error: true
        run: |
          cd handoff/20250928/40_App/orchestrator
          if [ -f "requirements.txt" ]; then
            echo "## 🔍 Orchestrator Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if pip-audit -r requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1; then
              echo "has_vulns=false" >> $GITHUB_OUTPUT
            else
              echo "has_vulns=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No requirements.txt found in orchestrator"
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pip-audit on dev_agent
        id: audit-dev-agent
        if: env.ONLY_METRICS != 'true'
        continue-on-error: true
        run: |
          cd agents/dev_agent
          if [ -f "requirements.txt" ]; then
            echo "## 🔍 Dev Agent Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if pip-audit -r requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1; then
              echo "has_vulns=false" >> $GITHUB_OUTPUT
            else
              echo "has_vulns=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No requirements.txt found in dev_agent"
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pip-audit on ops_agent
        id: audit-ops-agent
        if: env.ONLY_METRICS != 'true'
        continue-on-error: true
        run: |
          cd agents/ops_agent
          if [ -f "requirements.txt" ]; then
            echo "## 🔍 Ops Agent Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if pip-audit -r requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1; then
              echo "has_vulns=false" >> $GITHUB_OUTPUT
            else
              echo "has_vulns=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No requirements.txt found in ops_agent"
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pip-audit on faq_agent
        id: audit-faq-agent
        if: env.ONLY_METRICS != 'true'
        continue-on-error: true
        run: |
          cd agents/faq_agent
          if [ -f "requirements.txt" ]; then
            echo "## 🔍 FAQ Agent Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if pip-audit -r requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1; then
              echo "has_vulns=false" >> $GITHUB_OUTPUT
            else
              echo "has_vulns=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No requirements.txt found in faq_agent"
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for vulnerabilities
        id: check-vulns
        run: |
          # Early exit for metrics-only PRs
          if [ "${ONLY_METRICS}" = "true" ]; then
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "vuln_count=0" >> $GITHUB_OUTPUT
            echo "## ⏭️ Metrics-only change" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Skipping pip-audit scans for metrics-only PR. No dependency files changed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          VULN_COUNT=0
          HAS_VULNS=false
          
          if [ "${{ steps.audit-backend.outputs.has_vulns }}" == "true" ]; then
            VULN_COUNT=$((VULN_COUNT + 1))
            HAS_VULNS=true
            echo "::warning::Vulnerabilities found in api-backend"
          fi
          
          if [ "${{ steps.audit-orchestrator.outputs.has_vulns }}" == "true" ]; then
            VULN_COUNT=$((VULN_COUNT + 1))
            HAS_VULNS=true
            echo "::warning::Vulnerabilities found in orchestrator"
          fi
          
          if [ "${{ steps.audit-dev-agent.outputs.has_vulns }}" == "true" ]; then
            VULN_COUNT=$((VULN_COUNT + 1))
            HAS_VULNS=true
            echo "::warning::Vulnerabilities found in dev_agent"
          fi
          
          if [ "${{ steps.audit-ops-agent.outputs.has_vulns }}" == "true" ]; then
            VULN_COUNT=$((VULN_COUNT + 1))
            HAS_VULNS=true
            echo "::warning::Vulnerabilities found in ops_agent"
          fi
          
          if [ "${{ steps.audit-faq-agent.outputs.has_vulns }}" == "true" ]; then
            VULN_COUNT=$((VULN_COUNT + 1))
            HAS_VULNS=true
            echo "::warning::Vulnerabilities found in faq_agent"
          fi
          
          echo "has_vulnerabilities=$HAS_VULNS" >> $GITHUB_OUTPUT
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$HAS_VULNS" == "true" ]; then
            echo "::warning::Vulnerabilities found in $VULN_COUNT component(s). Please review and update."
          else
            echo "✅ No vulnerabilities found in Python dependencies"
          fi

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, pip-audit]
    if: always()
    steps:
      - name: Check scan results and generate metrics
        run: |
          # Record scan start time for metrics
          SCAN_START_TIME="${{ github.event.head_commit.timestamp }}"
          SCAN_END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "## 🔒 Security Scanning Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- TruffleHog Version: v3.82.13 (pinned)" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks Version: v2 (latest stable)" >> $GITHUB_STEP_SUMMARY
          echo "- pip-audit: Latest" >> $GITHUB_STEP_SUMMARY
          echo "- Scan Type: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fetch Depth: ${{ github.event_name == 'pull_request' && '100 commits' || 'Full history' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.gitleaks.result }}" == "success" ]; then
            echo "✅ **Gitleaks**: No secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Gitleaks**: Secrets detected! Review the logs." >> $GITHUB_STEP_SUMMARY
            echo "   - Check artifacts for detailed report" >> $GITHUB_STEP_SUMMARY
            echo "   - Review .gitleaksignore if false positive" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.trufflehog.result }}" == "success" ]; then
            echo "✅ **TruffleHog**: No verified secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **TruffleHog**: Potential secrets detected! Review the logs." >> $GITHUB_STEP_SUMMARY
            echo "   - Only verified secrets are reported (--only-verified)" >> $GITHUB_STEP_SUMMARY
            echo "   - Unverified secrets may still be sensitive" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.pip-audit.result }}" == "success" ]; then
            echo "✅ **pip-audit**: No critical vulnerabilities in Python dependencies" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **pip-audit**: Vulnerabilities detected in Python dependencies" >> $GITHUB_STEP_SUMMARY
            echo "   - Review the detailed report above" >> $GITHUB_STEP_SUMMARY
            echo "   - Update vulnerable packages when possible" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Scan Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow Run: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If secrets were detected:" >> $GITHUB_STEP_SUMMARY
          echo "1. **DO NOT** commit the secrets" >> $GITHUB_STEP_SUMMARY
          echo "2. Rotate all exposed credentials immediately" >> $GITHUB_STEP_SUMMARY
          echo "3. Use environment variables or secret management" >> $GITHUB_STEP_SUMMARY
          echo "4. Add **SPECIFIC** false positives to .gitleaksignore (file:rule:line)" >> $GITHUB_STEP_SUMMARY
          echo "5. Review .gitleaks.toml for allowlist configuration" >> $GITHUB_STEP_SUMMARY
          
          # Fail if either scan failed
          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "::error::Gitleaks detected secrets in the codebase"
            exit 1
          fi
          
          # Warning if TruffleHog failed (but don't block - only verified secrets)
          if [ "${{ needs.trufflehog.result }}" != "success" ]; then
            echo "::warning::TruffleHog detected potential secrets - review recommended"
          fi
          
          # Warning if pip-audit failed (but don't block - vulnerabilities need review)
          if [ "${{ needs.pip-audit.result }}" != "success" ]; then
            echo "::warning::pip-audit detected vulnerabilities - review and update recommended"
          fi

  # Block PR merge if secrets are detected
  block-merge:
    name: Block Merge on Secret Detection
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for secrets
        run: |
          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "::error::❌ PR blocked: Secrets detected by Gitleaks"
            echo "Please remove all secrets before merging."
            exit 1
          fi
          
          echo "✅ No secrets detected - PR can be merged"

  # Block PR merge if dependency vulnerabilities are detected
  block-merge-vulns:
    name: Block Merge on Dependency Vulnerabilities
    runs-on: ubuntu-latest
    needs: [pip-audit]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for dependency vulnerabilities
        run: |
          if [ "${{ needs.pip-audit.outputs.has_vulnerabilities }}" == "true" ]; then
            echo "::error::❌ PR blocked: Dependency vulnerabilities detected"
            echo "Found vulnerabilities in ${{ needs.pip-audit.outputs.vuln_count }} component(s)."
            echo ""
            echo "Please update the vulnerable packages before merging."
            echo "Run 'pip-audit -r requirements.txt' locally to see details."
            exit 1
          fi
          
          echo "✅ No dependency vulnerabilities detected - PR can be merged"
