name: Tolgee Translation Sync

# 📚 Documentation: docs/ci_matrix.md (Section 16: Tolgee Translation Sync)
# 
# This workflow syncs translations between the codebase and Tolgee platform.
# 
# Key features:
# - Per-project bootstrap flags (OC/FD can run independently)
# - Auto-sets i18n check status for locales-only PRs (PR #1449)
# - Graceful exit when projects need bootstrap (no red notifications)
# 
# For troubleshooting and detailed documentation, see docs/ci_matrix.md

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # 10:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Bootstrap: Push existing translations to new Tolgee projects (one-time only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write

jobs:
  sync-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tolgee CLI
        run: npm i -g @tolgee/cli

      - name: Install jq for JSON parsing
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check if Tolgee projects need bootstrap
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🔍 Checking if Tolgee projects are empty..."
          
          # Check Owner Console project
          OC_KEYS=$(curl -s -H "X-API-Key: $TOLGEE_API_KEY" "https://app.tolgee.io/v2/projects/24693/keys?page=0&size=1" | jq -r '.page.totalElements // 0')
          echo "Owner Console (24693) has $OC_KEYS keys"
          echo "OC_KEYS=$OC_KEYS" >> $GITHUB_ENV
          
          # Check Frontend Dashboard project
          FD_KEYS=$(curl -s -H "X-API-Key: $TOLGEE_API_KEY" "https://app.tolgee.io/v2/projects/24702/keys?page=0&size=1" | jq -r '.page.totalElements // 0')
          echo "Frontend Dashboard (24702) has $FD_KEYS keys"
          echo "FD_KEYS=$FD_KEYS" >> $GITHUB_ENV
          
          # Determine per-project bootstrap flags
          if [ "$OC_KEYS" = "0" ]; then
            echo "NEEDS_BOOTSTRAP_OC=true" >> $GITHUB_ENV
          else
            echo "NEEDS_BOOTSTRAP_OC=false" >> $GITHUB_ENV
          fi
          
          if [ "$FD_KEYS" = "0" ]; then
            echo "NEEDS_BOOTSTRAP_FD=true" >> $GITHUB_ENV
          else
            echo "NEEDS_BOOTSTRAP_FD=false" >> $GITHUB_ENV
          fi
          
          # Determine if ALL projects need bootstrap
          if [ "$OC_KEYS" = "0" ] && [ "$FD_KEYS" = "0" ]; then
            echo "ALL_NEED_BOOTSTRAP=true" >> $GITHUB_ENV
          else
            echo "ALL_NEED_BOOTSTRAP=false" >> $GITHUB_ENV
          fi
          
          # Determine if this is a manual bootstrap run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.bootstrap }}" = "true" ]; then
            echo "IS_MANUAL_BOOTSTRAP=true" >> $GITHUB_ENV
          else
            echo "IS_MANUAL_BOOTSTRAP=false" >> $GITHUB_ENV
          fi
          
          # Determine which projects to process in auto runs
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$OC_KEYS" != "0" ]; then
            echo "PROCESS_OC=true" >> $GITHUB_ENV
          else
            echo "PROCESS_OC=false" >> $GITHUB_ENV
          fi
          
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$FD_KEYS" != "0" ]; then
            echo "PROCESS_FD=true" >> $GITHUB_ENV
          else
            echo "PROCESS_FD=false" >> $GITHUB_ENV
          fi
          
          echo ""
          echo "📊 Bootstrap flags:"
          echo "  NEEDS_BOOTSTRAP_OC=${{ env.NEEDS_BOOTSTRAP_OC }}"
          echo "  NEEDS_BOOTSTRAP_FD=${{ env.NEEDS_BOOTSTRAP_FD }}"
          echo "  ALL_NEED_BOOTSTRAP=${{ env.ALL_NEED_BOOTSTRAP }}"
          echo "  IS_MANUAL_BOOTSTRAP=${{ env.IS_MANUAL_BOOTSTRAP }}"
          echo "  PROCESS_OC=${{ env.PROCESS_OC }}"
          echo "  PROCESS_FD=${{ env.PROCESS_FD }}"

      - name: Handle bootstrap requirement for automated runs
        if: env.ALL_NEED_BOOTSTRAP == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "⚠️  Bootstrap is needed but this is an automated run (push/schedule)"
          echo ""
          echo "📋 Current status:"
          echo "  - Owner Console (24693): ${{ env.OC_KEYS }} keys"
          echo "  - Frontend Dashboard (24702): ${{ env.FD_KEYS }} keys"
          echo ""
          echo "🔧 To bootstrap the empty project(s), please:"
          echo "  1. Go to Actions → Tolgee Translation Sync"
          echo "  2. Click 'Run workflow'"
          echo "  3. Check the 'Bootstrap' checkbox"
          echo "  4. Click 'Run workflow'"
          echo ""
          echo "⚠️  Note: Bootstrap may fail if Tolgee plan limits are exceeded."
          echo "   In that case, you may need to upgrade your Tolgee plan or"
          echo "   manually populate the projects through the Tolgee UI."
          echo ""
          echo "✅ Exiting gracefully (no error) to avoid red notifications"
          exit 0

      - name: Bootstrap - Ensure languages exist in Owner Console
        if: env.IS_MANUAL_BOOTSTRAP == 'true' && env.NEEDS_BOOTSTRAP_OC == 'true'
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🔧 Ensuring required languages exist in Owner Console (Project #24693)..."
          
          # Create en-US if it doesn't exist (ignore errors if already exists)
          curl -X POST -H "X-API-Key: $TOLGEE_API_KEY" -H "Content-Type: application/json" \
            -d '{"tag":"en-US","name":"English (US)","originalName":"English (US)"}' \
            "https://app.tolgee.io/v2/projects/24693/languages" 2>/dev/null || true
          
          # Create zh-TW if it doesn't exist (ignore errors if already exists)
          curl -X POST -H "X-API-Key: $TOLGEE_API_KEY" -H "Content-Type: application/json" \
            -d '{"tag":"zh-TW","name":"Traditional Chinese (Taiwan)","originalName":"繁體中文（台灣）"}' \
            "https://app.tolgee.io/v2/projects/24693/languages" 2>/dev/null || true
          
          echo "✅ Languages verified/created"

      - name: Bootstrap - Push translations to Owner Console
        if: env.IS_MANUAL_BOOTSTRAP == 'true' && env.NEEDS_BOOTSTRAP_OC == 'true'
        working-directory: handoff/20250928/40_App/owner-console
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🚀 Bootstrap: Pushing translations to Owner Console (Project #24693)..."
          cd src/locales
          tolgee push \
            --api-key "$TOLGEE_API_KEY" \
            --project-id 24693 \
            --files-template "{languageTag}.json" \
            --format JSON_I18NEXT \
            --no-strict-namespace \
            --force-mode OVERRIDE
          echo "✅ Owner Console translations pushed successfully"

      - name: Bootstrap - Ensure languages exist in Frontend Dashboard
        if: env.IS_MANUAL_BOOTSTRAP == 'true' && env.NEEDS_BOOTSTRAP_FD == 'true'
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🔧 Ensuring required languages exist in Frontend Dashboard (Project #24702)..."
          
          # Create en-US if it doesn't exist (ignore errors if already exists)
          curl -X POST -H "X-API-Key: $TOLGEE_API_KEY" -H "Content-Type: application/json" \
            -d '{"tag":"en-US","name":"English (US)","originalName":"English (US)"}' \
            "https://app.tolgee.io/v2/projects/24702/languages" 2>/dev/null || true
          
          # Create zh-TW if it doesn't exist (ignore errors if already exists)
          curl -X POST -H "X-API-Key: $TOLGEE_API_KEY" -H "Content-Type: application/json" \
            -d '{"tag":"zh-TW","name":"Traditional Chinese (Taiwan)","originalName":"繁體中文（台灣）"}' \
            "https://app.tolgee.io/v2/projects/24702/languages" 2>/dev/null || true
          
          echo "✅ Languages verified/created"

      - name: Bootstrap - Push translations to Frontend Dashboard
        if: env.IS_MANUAL_BOOTSTRAP == 'true' && env.NEEDS_BOOTSTRAP_FD == 'true'
        working-directory: handoff/20250928/40_App/frontend-dashboard
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🚀 Bootstrap: Pushing translations to Frontend Dashboard (Project #24702)..."
          cd src/i18n/locales
          tolgee push \
            --api-key "$TOLGEE_API_KEY" \
            --project-id 24702 \
            --files-template "{languageTag}.json" \
            --format JSON_I18NEXT \
            --no-strict-namespace \
            --force-mode OVERRIDE
          echo "✅ Frontend Dashboard translations pushed successfully"

      - name: Verify bootstrap success
        if: env.IS_MANUAL_BOOTSTRAP == 'true'
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🔍 Verifying bootstrap success..."
          
          # Re-check key counts
          OC_KEYS_AFTER=$(curl -s -H "X-API-Key: $TOLGEE_API_KEY" "https://app.tolgee.io/v2/projects/24693/keys?page=0&size=1" | jq -r '.page.totalElements // 0')
          FD_KEYS_AFTER=$(curl -s -H "X-API-Key: $TOLGEE_API_KEY" "https://app.tolgee.io/v2/projects/24702/keys?page=0&size=1" | jq -r '.page.totalElements // 0')
          
          echo "Owner Console now has $OC_KEYS_AFTER keys"
          echo "Frontend Dashboard now has $FD_KEYS_AFTER keys"
          
          # Fail if still empty
          if [ "$OC_KEYS_AFTER" = "0" ]; then
            echo "❌ ERROR: Owner Console still has 0 keys after bootstrap!"
            exit 1
          fi
          
          if [ "$FD_KEYS_AFTER" = "0" ]; then
            echo "❌ ERROR: Frontend Dashboard still has 0 keys after bootstrap!"
            exit 1
          fi
          
          echo "✅ Bootstrap verification passed!"

      - name: Preflight - Dry Pull and Validate Frontend Dashboard
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && env.PROCESS_FD == 'true'
        working-directory: handoff/20250928/40_App/frontend-dashboard
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🔍 Performing preflight validation for Frontend Dashboard..."
          mkdir -p /tmp/tolgee-preview-fd
          tolgee pull --api-key "$TOLGEE_API_KEY" --path /tmp/tolgee-preview-fd
          echo "✅ Frontend Dashboard preflight pull completed"

      - name: Preflight - Dry Pull and Validate Owner Console
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && env.PROCESS_OC == 'true'
        working-directory: handoff/20250928/40_App/owner-console
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          echo "🔍 Performing preflight validation for Owner Console..."
          mkdir -p /tmp/tolgee-preview-oc
          tolgee pull --api-key "$TOLGEE_API_KEY" --path /tmp/tolgee-preview-oc
          echo "✅ Owner Console preflight pull completed"

      - name: Pull translations for Frontend Dashboard
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && env.PROCESS_FD == 'true'
        working-directory: handoff/20250928/40_App/frontend-dashboard
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          tolgee pull --api-key "$TOLGEE_API_KEY"

      - name: Pull translations for Owner Console
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && env.PROCESS_OC == 'true'
        working-directory: handoff/20250928/40_App/owner-console
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          tolgee pull --api-key "$TOLGEE_API_KEY"
      
      - name: Validate pulled translations - Frontend Dashboard
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && env.PROCESS_FD == 'true'
        run: |
          echo "🔍 Validating Frontend Dashboard translations..."
          
          # Use structured validator on /tmp files (just pulled from Tolgee)
          node $GITHUB_WORKSPACE/scripts/validate-tolgee-structure.js \
            --fd-locales /tmp/tolgee-preview-fd
          
          # Additional quick grep check for demo patterns
          if grep -r "What to pack\|add-item-add-button\|delete-item-button\|Quoi emballer\|Was mitnehmen" \
            /tmp/tolgee-preview-fd/ 2>/dev/null; then
            echo ""
            echo "❌ ERROR: Tolgee demo data detected in Frontend Dashboard translations!"
            echo "This indicates the Tolgee project #24702 contains corrupted/demo data."
            echo ""
            echo "Please fix the Tolgee project data before running sync again:"
            echo "1. Check Tolgee project #24702"
            echo "2. Remove any demo data (packing list app strings)"
            echo "3. Ensure correct translations are imported"
            echo "4. Re-run this workflow"
            echo ""
            exit 1
          fi
          
          echo "✅ Frontend Dashboard validation passed"
      
      - name: Validate pulled translations - Owner Console
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && env.PROCESS_OC == 'true'
        run: |
          echo "🔍 Validating Owner Console translations..."
          
          # Use structured validator on /tmp files (just pulled from Tolgee)
          node $GITHUB_WORKSPACE/scripts/validate-tolgee-structure.js \
            --oc-locales /tmp/tolgee-preview-oc
          
          # Additional quick grep check for demo patterns
          if grep -r "What to pack\|add-item-add-button\|delete-item-button\|Quoi emballer\|Was mitnehmen" \
            /tmp/tolgee-preview-oc/ 2>/dev/null; then
            echo ""
            echo "❌ ERROR: Tolgee demo data detected in Owner Console translations!"
            echo "This indicates the Tolgee project #24693 contains corrupted/demo data."
            echo ""
            echo "Please fix the Tolgee project data before running sync again:"
            echo "1. Check Tolgee project #24693"
            echo "2. Remove any demo data (packing list app strings)"
            echo "3. Ensure correct translations are imported"
            echo "4. Re-run this workflow"
            echo ""
            exit 1
          fi
          
          echo "✅ Owner Console validation passed"

      - name: Create PR if changes
        id: cpr
        if: env.IS_MANUAL_BOOTSTRAP != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(i18n): sync translations from Tolgee"
          title: "chore(i18n): Tolgee sync"
          body: "Automated Tolgee sync via GitHub Actions."
          branch: chore/tolgee-sync
          base: main
      
      - name: Locate Tolgee PR and analyze changes
        id: analyze
        if: env.IS_MANUAL_BOOTSTRAP != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Prefer the PR number from create-pull-request. Fallback: find PR by head branch.
            let prNumber = Number('${{ steps.cpr.outputs.pull-request-number || '' }}') || null;
            let pr;
            if (prNumber) {
              core.info(`Using PR number from create-pull-request: ${prNumber}`);
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            } else {
              core.info('No PR number from create-pull-request, searching by head branch...');
              const list = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:chore/tolgee-sync`, per_page: 1
              });
              pr = list.data[0];
            }

            if (!pr) {
              core.notice('No open Tolgee PR found. Nothing to set.');
              return;
            }

            core.info(`Found PR #${pr.number} with head SHA ${pr.head.sha}`);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);

            // List changed files and decide if they are locales-only
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });

            core.info(`PR has ${files.length} changed files`);

            const isLocaleFile = (f) => /^handoff\/.+\/40_App\/(owner-console\/src\/locales\/|frontend-dashboard\/src\/i18n\/locales\/).+\.json$/.test(f.filename);
            const localeFiles = files.filter(f => isLocaleFile(f));
            const nonLocaleFiles = files.filter(f => !isLocaleFile(f));
            const onlyLocales = nonLocaleFiles.length === 0 && localeFiles.length > 0;

            core.info(`Locale files: ${localeFiles.length}, Non-locale files: ${nonLocaleFiles.length}`);
            core.info(`Only locales: ${onlyLocales}`);

            core.setOutput('only_locales', onlyLocales ? 'true' : 'false');
      
      - name: Set i18n required status (commit status)
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && steps.analyze.outputs.only_locales == 'true' && steps.analyze.outputs.head_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = '${{ steps.analyze.outputs.head_sha }}';
            
            core.info(`Setting commit status for SHA ${sha}`);
            
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'success',
              context: 'Changed Files Strict i18n Check',
              description: 'Locales-only Tolgee sync; strict JS/TS i18n check not applicable',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            });
            
            core.info(`✅ Set commit status success for ${sha}`);
      
      - name: Create check run (belt-and-suspenders)
        if: env.IS_MANUAL_BOOTSTRAP != 'true' && steps.analyze.outputs.only_locales == 'true' && steps.analyze.outputs.head_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = '${{ steps.analyze.outputs.head_sha }}';
            
            core.info(`Creating check run for SHA ${sha}`);
            
            await github.rest.checks.create({
              owner, repo,
              name: 'Changed Files Strict i18n Check',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Locales-only change',
                summary: 'Tolgee locales-only sync; no JS/TS files modified. Marking strict i18n check as not applicable.'
              }
            });
            
            core.info(`✅ Created check run for ${sha}`);
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "📊 Workflow Summary"
          echo "===================="
          echo "Event: ${{ github.event_name }}"
          echo "OC Keys: ${{ env.OC_KEYS }}"
          echo "FD Keys: ${{ env.FD_KEYS }}"
          echo ""
          echo "Bootstrap Flags:"
          echo "  NEEDS_BOOTSTRAP_OC: ${{ env.NEEDS_BOOTSTRAP_OC }}"
          echo "  NEEDS_BOOTSTRAP_FD: ${{ env.NEEDS_BOOTSTRAP_FD }}"
          echo "  ALL_NEED_BOOTSTRAP: ${{ env.ALL_NEED_BOOTSTRAP }}"
          echo "  IS_MANUAL_BOOTSTRAP: ${{ env.IS_MANUAL_BOOTSTRAP }}"
          echo ""
          echo "Processing Flags:"
          echo "  PROCESS_OC: ${{ env.PROCESS_OC }}"
          echo "  PROCESS_FD: ${{ env.PROCESS_FD }}"
          echo ""
          echo "✅ Workflow completed"
