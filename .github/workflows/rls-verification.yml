name: RLS Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/verify_rls_runtime.py'
      - 'scripts/audit_rls_health.py'
      - 'scripts/ci/bootstrap_rls_test_db.sql'
      - '.github/workflows/rls-verification.yml'
  workflow_dispatch:

jobs:
  # ============================================================================
  # Job 1: RLS Coverage Audit (BLOCKING)
  # ============================================================================
  # This job checks that all tables have RLS enabled and proper policies.
  # It will FAIL the PR if critical issues are found.
  # ============================================================================
  rls-audit:
    name: RLS Coverage Audit (Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morningai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install psycopg2-binary
      
      - name: Bootstrap test database (Supabase stubs)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morningai_test
        run: |
          echo "Bootstrapping test database with Supabase-compatible stubs..."
          psql $DATABASE_URL -f scripts/ci/bootstrap_rls_test_db.sql
      
      - name: Apply RLS migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morningai_test
        run: |
          echo "Applying RLS-related migrations..."
          # Apply migrations in order - continue on error for non-critical migrations
          for migration in migrations/*.sql; do
            # Skip test files
            if [[ "$migration" == *"/tests/"* ]]; then
              continue
            fi
            echo "Applying $migration..."
            # Use || true to continue even if migration fails (some may have Supabase-specific deps)
            psql $DATABASE_URL -f "$migration" 2>&1 || {
              echo "::warning::Migration $migration failed (may be expected for non-RLS migrations)"
            }
          done
      
      - name: Run RLS Coverage Audit (BLOCKING)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morningai_test
        run: |
          echo "Running RLS coverage audit..."
          python scripts/audit_rls_health.py --verbose --fail-on-critical
      
      - name: Create GitHub summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # RLS Coverage Audit Results
          
          ## Status
          
          This is a **BLOCKING** check. PRs with critical RLS issues cannot be merged.
          
          ## What This Checks
          
          - All tables in public schema have RLS enabled
          - All tables with RLS have at least one policy
          - Tenant-scoped tables have proper tenant isolation policies
          - No overly permissive policies (USING(true) on tenant data)
          
          ## If This Fails
          
          1. Check the audit output above for specific issues
          2. Add missing RLS policies or enable RLS on tables
          3. See \`docs/RLS_IMPLEMENTATION_GUIDE.md\` for guidance
          
          ---
          
          **Note**: This is a HARD GATE. Critical RLS issues MUST be fixed before merge.
          EOF

  # ============================================================================
  # Job 2: RLS Runtime Verification (Soft Gate)
  # ============================================================================
  # This job performs runtime verification of RLS policies.
  # It is a soft gate - failures are warnings but don't block merge.
  # ============================================================================
  verify-rls:
    name: RLS Runtime Verification (Soft Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: rls-audit  # Only run if audit passes
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morningai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install psycopg2-binary
      
      - name: Bootstrap test database (Supabase stubs)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morningai_test
        run: |
          psql $DATABASE_URL -f scripts/ci/bootstrap_rls_test_db.sql
      
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morningai_test
        run: |
          # Apply migrations in order
          for migration in migrations/*.sql; do
            if [[ "$migration" == *"/tests/"* ]]; then
              continue
            fi
            echo "Applying $migration..."
            psql $DATABASE_URL -f "$migration" || echo "Migration $migration failed (may be expected)"
          done
      
      - name: Run RLS verification (ephemeral mode)
        id: rls_verify
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morningai_test
        run: |
          python scripts/verify_rls_runtime.py --verbose
      
      - name: Check RLS verification results
        run: |
          if [ "${{ steps.rls_verify.outcome }}" = "success" ]; then
            echo "✅ RLS verification passed"
            exit 0
          else
            echo "⚠️ RLS verification failed or had errors"
            echo "This is a soft gate - PR can still be merged"
            echo "Please review the RLS verification output above"
            exit 0
          fi
      
      - name: Create GitHub summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # RLS Runtime Verification Results
          
          ## Status
          
          - **Outcome**: ${{ steps.rls_verify.outcome }}
          - **Mode**: Ephemeral (all changes rolled back)
          - **Database**: PostgreSQL 15 (test instance)
          
          ## Details
          
          See the "Run RLS verification" step above for detailed results.
          
          ---
          
          **Note**: This is a soft gate. RLS verification failures do not block PR merges.
          EOF
