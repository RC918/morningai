name: Staging Environment CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  validate-env-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pyyaml
      - name: Validate environment schema
        run: |
          python - <<'EOF'
          import yaml
          import sys
          
          with open('config/env.schema.yaml', 'r') as f:
              schema = yaml.safe_load(f)
          
          required_keys = ['version', 'description', 'fields']
          for key in required_keys:
              if key not in schema:
                  print(f"❌ Missing required key: {key}")
                  sys.exit(1)
          
          errors = []
          for var_name, var_config in schema['fields'].items():
              if 'type' not in var_config:
                  errors.append(f"{var_name}: missing 'type'")
              if 'description' not in var_config or not var_config['description']:
                  errors.append(f"{var_name}: missing 'description'")
              if 'category' not in var_config:
                  errors.append(f"{var_name}: missing 'category'")
          
          if errors:
              print("❌ Schema validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)
          
          print(f"✅ Schema valid: {len(schema['fields'])} variables defined")
          EOF

  backend-tests:
    needs: validate-env-schema
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.x'
      - name: Install dependencies
        run: |
          cd handoff/20250928/40_App/api-backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
          cd ../orchestrator
          pip install -e .
      - name: Run tests with coverage
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: true
          ENVIRONMENT: staging
        run: |
          cd handoff/20250928/40_App/api-backend
          python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=74 -v
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: staging-coverage-report
          path: handoff/20250928/40_App/api-backend/coverage.xml
          retention-days: 30

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      - name: Run frontend tests
        run: |
          cd handoff/20250928/40_App/frontend-dashboard
          pnpm test || echo "No tests configured yet"
      - name: Build frontend
        run: |
          cd handoff/20250928/40_App/frontend-dashboard
          pnpm build

  smoke-tests:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Staging smoke tests
        run: |
          echo "✅ Staging smoke tests placeholder"
          echo "TODO: Add health check for staging services when deployed"
          echo "TODO: Add basic API endpoint tests"
          echo "TODO: Add frontend accessibility tests"

  notify-staging-ready:
    needs: [backend-tests, frontend-tests, smoke-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Staging ready notification
        run: |
          echo "✅ All staging CI checks passed"
          echo "📦 Ready to deploy to staging environment"
          echo "🔗 Next steps:"
          echo "   1. Deploy to Render staging services (manual for now)"
          echo "   2. Run integration tests against staging"
          echo "   3. Create PR from develop → main for production deployment"
