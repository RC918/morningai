# Docs Changelog Generation Workflow
# Automatically generates documentation changelog sections from pr-changelog.yaml
#
# Triggers:
# - Manual dispatch (workflow_dispatch)
# - When pr-changelog.yaml is modified on main branch
#
# This workflow reads docs/pr-changelog.yaml and updates:
# - docs/ONBOARDING_GUIDE.md
# - docs/PROJECT_STRUCTURE_REPORT.md
# - docs/ENVIRONMENTS.md
# - docs/deployment/troubleshooting-monitoring.md

name: Docs Changelog Generation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (preview only)'
        required: false
        default: 'false'
        type: boolean
      period:
        description: 'Specific period to generate (e.g., "Dec 7 - Dec 9, 2025")'
        required: false
        type: string

  push:
    branches:
      - main
    paths:
      - 'docs/pr-changelog.yaml'

# Prevent concurrent runs to avoid race conditions when updating the same PR branch
concurrency:
  group: docs-changelog
  cancel-in-progress: true

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Always checkout main branch to ensure PR is based on latest main
          # This prevents stale branch issues when workflow_dispatch is triggered from other refs
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run changelog generator (dry-run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          python scripts/generate-docs-changelog.py --dry-run ${{ github.event.inputs.period && format('--period "{0}"', github.event.inputs.period) || '' }}

      - name: Run changelog generator
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        run: |
          python scripts/generate-docs-changelog.py ${{ github.event.inputs.period && format('--period "{0}"', github.event.inputs.period) || '' }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: auto-generate changelog sections from pr-changelog.yaml'
          title: 'docs: auto-generate changelog sections'
          body: |
            ## Automated Documentation Update

            This PR was automatically generated by the docs-changelog workflow.

            > **Note**: This PR is auto-managed. Each workflow run updates this branch to the latest `main` + generated changes. Please merge or close promptly to avoid confusion.

            ### Changes
            - Updated documentation files with changelog sections from `docs/pr-changelog.yaml`

            ### Files Updated
            - `docs/ONBOARDING_GUIDE.md`
            - `docs/PROJECT_STRUCTURE_REPORT.md`
            - `docs/ENVIRONMENTS.md`
            - `docs/deployment/troubleshooting-monitoring.md`

            ### Review Checklist
            - [ ] Verify changelog entries are accurate
            - [ ] Check formatting consistency
            - [ ] Ensure no duplicate entries
          branch: docs/auto-changelog-update
          delete-branch: true
          labels: |
            documentation
            automated
