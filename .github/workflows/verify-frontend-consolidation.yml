name: Verify Frontend Consolidation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check-no-old-frontend-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for frontend-dashboard-deploy references
        run: |
          echo "🔍 Checking for references to deprecated frontend-dashboard-deploy..."
          
          # Use git grep with pathspec excludes for more reliable exclusion
          if git grep -n -I 'frontend-dashboard-deploy' -- \
            . \
            ':!tools/frontend-lab/**' \
            ':!.github/workflows/verify-frontend-consolidation.yml' \
            ':!docs/TECHNICAL_DEBT_ROADMAP.md' \
            ':!docs/adr/001-pnpm-turborepo-migration.md' \
            ':!docs/VERCEL_PNPM_INCIDENT_REPORT.md' \
            ':!docs/LIGHTHOUSE_CI_GUIDE.md' \
              ':!CTO_COMPREHENSIVE_TECHNICAL_ASSESSMENT.md' \
              ':!CTO_COMPREHENSIVE_TECHNICAL_ASSESSMENT_OLD.md' \
              ':!docs/reports/cto/CTO_COMPREHENSIVE_TECHNICAL_ASSESSMENT.md' \
              ':!docs/reports/cto/archive/CTO_COMPREHENSIVE_TECHNICAL_ASSESSMENT_OLD.md' \
            ':!DEPENDENCY_MANAGEMENT.md' \
            ':!PROJECT_DEEP_ANALYSIS.md' \
            ':!pnpm-lock.yaml' \
            ':!.gitignore' \
            ; then
            echo ""
            echo "❌ ERROR: Found references to deprecated 'frontend-dashboard-deploy' directory!"
            echo ""
            echo "The frontend has been consolidated. Please use:"
            echo "  - Directory: handoff/20250928/40_App/frontend-dashboard/"
            echo "  - Package: frontend-dashboard"
            echo "  - Filter: --filter frontend-dashboard"
            echo ""
            echo "See docs/TECHNICAL_DEBT_ROADMAP.md Issue #2 for details."
            exit 1
          else
            echo "✅ No references to deprecated frontend-dashboard-deploy found!"
          fi
