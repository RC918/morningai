name: Post-Deploy Health Assertions
on:
  workflow_dispatch:
  push: { branches: [ main ] }
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 * * * *"
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'handoff/20250928/40_App/api-backend/**'
              - 'handoff/20250928/40_App/orchestrator/**'
              - 'handoff/20250928/40_App/api/**'
              - '.github/workflows/post-deploy-health-assertions.yml'
              - '.github/workflows/post-deploy-health.yml'

  validate:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Check core health (/healthz)
        env:
          EXPECTED_MAJOR: 8
        run: |
          set -e
          
          # Add cache-busting and retries to curl
          URL="https://morningai-backend-v2.onrender.com/healthz?t=${{ github.run_id }}"
          echo "Checking backend health at: $URL"
          
          curl -sS --fail-with-body \
            -H 'Cache-Control: no-cache, no-store' \
            -H 'Pragma: no-cache' \
            --max-time 10 \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            "$URL" | tee /tmp/health.json
          
          echo ""
          echo "=== Health Check Response ==="
          cat /tmp/health.json | jq '.'
          echo ""
          
          # Extract version, phase, and status for better error messages
          VERSION=$(jq -r '.version // .app_version // .app_version_tag // .app_build // "unknown"' /tmp/health.json)
          PHASE=$(jq -r '.phase // "unknown"' /tmp/health.json)
          STATUS=$(jq -r '.status // "unknown"' /tmp/health.json)
          DATABASE=$(jq -r '.database // "unknown"' /tmp/health.json)
          
          echo "Extracted values:"
          echo "  Version: $VERSION"
          echo "  Phase: $PHASE"
          echo "  Status: $STATUS"
          echo "  Database: $DATABASE"
          echo ""
          
          # Validate with relaxed version check (accept any 8.x.x)
          jq -e --argjson EXP_MAJOR "$EXPECTED_MAJOR" '
            def ver: (.version // .app_version // .app_version_tag // .app_build // "");
            def major(v): if (v | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) then (v | capture("^(?<maj>\\d+)").maj | tonumber) else -1 end;
            
            (.phase | tostring | test("Phase\\s*8")) and
            (ver as $v | (major($v) == $EXP_MAJOR)) and
            ((.status == "healthy") or (.database == "connected"))
          ' /tmp/health.json >/dev/null || {
            echo ""
            echo "::error::Backend health check failed!"
            echo "::error::Expected: Phase 8, Version ${EXPECTED_MAJOR}.x.x, Status healthy or Database connected"
            echo "::error::Got: Phase='$PHASE', Version='$VERSION', Status='$STATUS', Database='$DATABASE'"
            echo "::error::If this is a configuration issue, ensure APP_VERSION is set correctly in Render.com and redeploy."
            exit 1
          }
          
          echo "✅ Backend health check passed!"

      - name: Test Phase 4–6 API endpoints (JWT optional, with retry)
        env:
          TEST_ADMIN_JWT: ${{ secrets.TEST_ADMIN_JWT }}
        run: |
          set -e
          BASE="https://morningai-backend-v2.onrender.com"

          curl_code(){  # $1: path, optional $2: "auth"
            local ep="$1" auth="$2" code=0
            for i in 1 2 3; do
              if [ "$auth" = "auth" ]; then
                code=$(curl -s -H "Authorization: Bearer $TEST_ADMIN_JWT" -o /dev/null -w "%{http_code}" "$BASE$ep")
              else
                code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$ep")
              fi
              [ "$code" != "000" ] && break
              sleep 1
            done
            echo "$code"
          }

          echo "=== Phase 4 & 5 expect 200 ==="
          for EP in /api/governance/status /api/business-intelligence/summary; do
            code=$(curl_code "$EP")
            echo "$EP code=$code"
            test "$code" -eq 200 || { echo "::error::$EP expected 200, got $code"; exit 1; }
          done

          echo "=== Phase 6 protected endpoint ==="
          if [ -n "$TEST_ADMIN_JWT" ]; then
            code=$(curl_code "/api/security/reviews/pending" auth)
            echo "/api/security/reviews/pending (auth) code=$code"
            test "$code" -eq 200 || { echo "::error::with JWT expected 200, got $code"; exit 1; }
          else
            code=$(curl_code "/api/security/reviews/pending")
            echo "/api/security/reviews/pending code=$code"
            case "$code" in
              401|403) echo "✅ Security endpoint properly protected" ;;
              200) echo "::warning::Security endpoint accessible without auth - check JWT enforcement" ;;
              *) echo "::error::unexpected response code $code"; exit 1;;
            esac
          fi

      - name: SLA Baseline (success-rate & latency)
        run: |
          URL="https://morningai-backend-v2.onrender.com/health"; TOTAL=10; S=0; T=0
          for i in $(seq 1 $TOTAL); do
            o=$(curl -s -o /dev/null -w '%{http_code} %{time_total}\n' "$URL"); c=${o% *}; d=${o#* }
            [ "$c" -eq 200 ] && S=$((S+1))
            T=$(awk -v a=$T -v b=$d 'BEGIN{printf "%.6f", a+b}')
          done
          RATE=$((S*100/TOTAL)); AVG=$(awk -v T=$T -v N=$TOTAL 'BEGIN{printf "%.3f", T/N}')
          echo "rate=$RATE avg=${AVG}s"
          test "$RATE" -ge 90
