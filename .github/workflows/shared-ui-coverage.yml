name: Shared-UI Coverage Check

on:
  pull_request:
    paths:
      - 'packages/shared-ui/**'
      - '.github/workflows/shared-ui-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'packages/shared-ui/**'

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run coverage tests
        run: |
          cd packages/shared-ui
          pnpm test:coverage
      
      - name: Check coverage thresholds
        id: coverage-check
        run: |
          cd packages/shared-ui
          
          # 讀取覆蓋率摘要
          COVERAGE_JSON=$(cat coverage/coverage-summary.json)
          
          # 提取總覆蓋率
          LINES_PCT=$(echo $COVERAGE_JSON | jq -r '.total.lines.pct')
          STATEMENTS_PCT=$(echo $COVERAGE_JSON | jq -r '.total.statements.pct')
          FUNCTIONS_PCT=$(echo $COVERAGE_JSON | jq -r '.total.functions.pct')
          BRANCHES_PCT=$(echo $COVERAGE_JSON | jq -r '.total.branches.pct')
          
          # 設定門檻
          THRESHOLD=60
          
          echo "lines_pct=$LINES_PCT" >> $GITHUB_OUTPUT
          echo "statements_pct=$STATEMENTS_PCT" >> $GITHUB_OUTPUT
          echo "functions_pct=$FUNCTIONS_PCT" >> $GITHUB_OUTPUT
          echo "branches_pct=$BRANCHES_PCT" >> $GITHUB_OUTPUT
          
          # 檢查是否達到門檻
          FAILED=0
          
          if (( $(echo "$LINES_PCT < $THRESHOLD" | bc -l) )); then
            echo "::error::Line coverage $LINES_PCT% is below threshold $THRESHOLD%"
            FAILED=1
          fi
          
          if (( $(echo "$STATEMENTS_PCT < $THRESHOLD" | bc -l) )); then
            echo "::error::Statement coverage $STATEMENTS_PCT% is below threshold $THRESHOLD%"
            FAILED=1
          fi
          
          if (( $(echo "$FUNCTIONS_PCT < $THRESHOLD" | bc -l) )); then
            echo "::error::Function coverage $FUNCTIONS_PCT% is below threshold $THRESHOLD%"
            FAILED=1
          fi
          
          if (( $(echo "$BRANCHES_PCT < $THRESHOLD" | bc -l) )); then
            echo "::error::Branch coverage $BRANCHES_PCT% is below threshold $THRESHOLD%"
            FAILED=1
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "✅ All coverage thresholds met!"
          fi
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-ui-coverage
          path: packages/shared-ui/coverage/
          retention-days: 30
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // 讀取覆蓋率摘要
            const summaryPath = path.join(process.cwd(), 'packages/shared-ui/coverage/coverage-summary.json');
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const total = summary.total;
            
            // 判斷狀態
            const threshold = 60;
            const getStatus = (pct) => pct >= threshold ? '✅' : '❌';
            const getColor = (pct) => pct >= threshold ? '🟢' : '🔴';
            
            // 建立評論內容
            const comment = `## 📊 Shared-UI 測試覆蓋率報告
            
            | 指標 | 覆蓋率 | 狀態 |
            |------|--------|------|
            | Lines | ${total.lines.pct.toFixed(2)}% | ${getStatus(total.lines.pct)} |
            | Statements | ${total.statements.pct.toFixed(2)}% | ${getStatus(total.statements.pct)} |
            | Functions | ${total.functions.pct.toFixed(2)}% | ${getStatus(total.functions.pct)} |
            | Branches | ${total.branches.pct.toFixed(2)}% | ${getStatus(total.branches.pct)} |
            
            **門檻要求**: 60% 最低標準
            
            ${total.lines.pct >= threshold && total.statements.pct >= threshold && total.functions.pct >= threshold && total.branches.pct >= threshold 
              ? '✅ **所有覆蓋率門檻已達標！**' 
              : '❌ **部分覆蓋率未達標，請補充測試。**'}
            
            ---
            
            ### 📁 詳細報告
            
            [查看完整覆蓋率報告](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            
            <details>
            <summary>📈 覆蓋率明細</summary>
            
            \`\`\`
            已測試檔案數: ${Object.keys(summary).length - 1}
            總行數: ${total.lines.total}
            已覆蓋行數: ${total.lines.covered}
            未覆蓋行數: ${total.lines.total - total.lines.covered}
            \`\`\`
            
            </details>
            `;
            
            // 查找現有評論
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Shared-UI 測試覆蓋率報告')
            );
            
            // 更新或建立評論
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
