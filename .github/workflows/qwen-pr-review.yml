# .github/workflows/qwen-pr-review.yml
#
# Qwen AI Code Review Workflow
# 
# This workflow automatically reviews all PRs using Qwen AI.
# Code diffs are sent to DashScope/Qwen API for analysis.
#
# ============================================================================
# SETUP
# ============================================================================
# 1. Add QWEN_API_KEY to GitHub Secrets (Settings -> Secrets -> Actions)
#    Get your API key from: https://dashscope.console.aliyun.com/
#
# ============================================================================
# SECURITY NOTICE (IMPORTANT)
# ============================================================================
# - QWEN_API_KEY must be stored ONLY in GitHub Secrets (never in code/env files)
# - This workflow sends code diffs to Alibaba Cloud DashScope API (third-party)
# - Ensure your organization's security policy allows sending code to external LLMs
# - The API response is NOT logged to prevent sensitive data exposure
# - Fork PRs are automatically skipped to protect secrets
# - Bot/Dependabot PRs are skipped to prevent unnecessary API calls
#
# ============================================================================
# OPT-OUT MECHANISM
# ============================================================================
# - Add 'no-ai-review' label to skip AI review for specific PRs
# - Useful for PRs with sensitive code that shouldn't be sent to external APIs
#
# ============================================================================
# COST CONTROL
# ============================================================================
# - Concurrency control prevents duplicate reviews on rapid pushes
# - Same commit SHA is not re-reviewed (deduplication via hidden marker)
# - Large diffs are truncated to 80KB to limit token usage
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
# - If review fails, check workflow logs for detailed error messages
# - Common issues: invalid API key, quota exceeded, network timeout
# - Verify perl and jq are available (standard on ubuntu-latest runners)

name: "Qwen AI Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qwen-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_DIFF_SIZE: 80000
  QWEN_MODEL: "qwen-plus"
  QWEN_API_ENDPOINT: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions"

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Trigger conditions:
    # 1. Not a Bot (skip Dependabot, etc.)
    # 2. Not a Fork PR (protect secrets)
    # 3. Not labeled 'no-ai-review' (opt-out mechanism)
    if: |
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-ai-review')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required tools
        id: verify_tools
        run: |
          echo "::group::Verifying required tools"
          
          # Check jq
          if command -v jq &> /dev/null; then
            JQ_VERSION=$(jq --version 2>&1 || echo "unknown")
            echo "jq: $JQ_VERSION"
          else
            echo "::error::jq is not installed"
            exit 1
          fi
          
          # Check perl with Unicode support
          if command -v perl &> /dev/null; then
            PERL_VERSION=$(perl -v 2>&1 | head -2 | tail -1 || echo "unknown")
            echo "perl: $PERL_VERSION"
            # Test Unicode support
            if echo "test" | perl -CSD -pe 's/t/\x{200B}t/g' &> /dev/null; then
              echo "perl Unicode support: OK"
            else
              echo "::warning::perl Unicode support may be limited"
            fi
          else
            echo "::error::perl is not installed"
            exit 1
          fi
          
          # Check curl
          if command -v curl &> /dev/null; then
            CURL_VERSION=$(curl --version 2>&1 | head -1 || echo "unknown")
            echo "curl: $CURL_VERSION"
          else
            echo "::error::curl is not installed"
            exit 1
          fi
          
          echo "::endgroup::"
          echo "All required tools verified successfully"

      - name: Check if already reviewed this commit
        id: check_reviewed
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            
            // Look for existing Qwen review comment with this exact SHA (using hidden marker)
            // This is independent of display formatting and uses full SHA to avoid collision
            const shaMarker = `<!-- qwen-review-sha:${headSha} -->`;
            const existingReview = comments.data.find(c => 
              c.body.includes(shaMarker)
            );
            
            if (existingReview) {
              console.log(`Already reviewed commit ${headSha}, skipping`);
              core.setOutput('skip', 'true');
            } else {
              console.log(`New commit ${headSha}, proceeding with review`);
              core.setOutput('skip', 'false');
            }

      - name: Get PR diff safely
        if: steps.check_reviewed.outputs.skip != 'true'
        id: diff
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          
          # Get diff with context
          git diff --unified=3 "$BASE_SHA".."$HEAD_SHA" > full_diff.patch
          
          # Check for sensitive files
          SENSITIVE_FILES=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | grep -E '\.(env|pem|key|secret|credential)' || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "SENSITIVE_WARNING=true" >> "$GITHUB_ENV"
            echo "Detected potentially sensitive files: $SENSITIVE_FILES"
          fi
          
          # Get diff size
          DIFF_SIZE=$(wc -c < full_diff.patch)
          echo "Diff size: $DIFF_SIZE bytes"
          
          # Truncate if needed
          if [ "$DIFF_SIZE" -gt "$MAX_DIFF_SIZE" ]; then
            echo "Diff too large ($DIFF_SIZE bytes), truncating to $MAX_DIFF_SIZE bytes"
            head -c "$MAX_DIFF_SIZE" full_diff.patch > trimmed_diff.patch
            echo -e "\n\n... (diff truncated, showing first $MAX_DIFF_SIZE bytes of $DIFF_SIZE total)" >> trimmed_diff.patch
            echo "DIFF_TRUNCATED=true" >> "$GITHUB_ENV"
          else
            cp full_diff.patch trimmed_diff.patch
          fi
          
          # Write to GITHUB_ENV safely
          DELIMITER=$(openssl rand -hex 16)
          {
            echo "DIFF<<$DELIMITER"
            cat trimmed_diff.patch
            echo ""
            echo "$DELIMITER"
          } >> "$GITHUB_ENV"
          
          # Get changed files list
          {
            echo "CHANGED_FILES<<$DELIMITER"
            git diff --name-only "$BASE_SHA".."$HEAD_SHA"
            echo "$DELIMITER"
          } >> "$GITHUB_ENV"
          
          # Count changes
          ADDITIONS=$(git diff --numstat "$BASE_SHA".."$HEAD_SHA" | awk '{sum+=$1} END {print sum+0}')
          DELETIONS=$(git diff --numstat "$BASE_SHA".."$HEAD_SHA" | awk '{sum+=$2} END {print sum+0}')
          FILE_COUNT=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | wc -l)
          
          echo "ADDITIONS=$ADDITIONS" >> "$GITHUB_ENV"
          echo "DELETIONS=$DELETIONS" >> "$GITHUB_ENV"
          echo "FILE_COUNT=$FILE_COUNT" >> "$GITHUB_ENV"

      - name: Determine review focus based on labels
        if: steps.check_reviewed.outputs.skip != 'true'
        id: focus
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          echo "PR Labels: $PR_LABELS"
          
          # Base prompt with task list format
          BASE_PROMPT="You are a senior code reviewer with expertise in security, performance, and best practices.
          Analyze the following code changes and provide a thorough review.
          
          OUTPUT FORMAT (IMPORTANT - follow exactly):
          1. Start with a 2-3 sentence summary
          2. List issues as a Markdown checklist with severity icons:
             - [ ] :red_circle: CRITICAL: [description] - must fix before merge
             - [ ] :orange_circle: HIGH: [description] - should fix before merge
             - [ ] :yellow_circle: MEDIUM: [description] - consider fixing
             - [ ] :blue_circle: LOW: [description] - minor suggestion
          3. If no issues found, say 'No significant issues found'
          4. End with optional 'Suggestions' section for improvements
          
          Review focus: bugs, security vulnerabilities, performance issues, error handling, and code quality.
          Be concise but thorough. Do not repeat the code back."
          
          # Adjust focus based on labels
          FOCUS=""
          if [[ "$PR_LABELS" == *"ui"* ]] || [[ "$PR_LABELS" == *"frontend"* ]]; then
            FOCUS="Additional focus: React patterns, component design, CSS consistency, accessibility (a11y), responsive design, and state management."
          elif [[ "$PR_LABELS" == *"backend"* ]] || [[ "$PR_LABELS" == *"api"* ]]; then
            FOCUS="Additional focus: SQL injection, authentication/authorization, input validation, error handling, API design, and database queries."
          elif [[ "$PR_LABELS" == *"security"* ]]; then
            FOCUS="SECURITY-SENSITIVE CHANGE. Focus heavily on: authentication, authorization, input sanitization, secrets handling, OWASP Top 10, and cryptographic practices."
          elif [[ "$PR_LABELS" == *"database"* ]] || [[ "$PR_LABELS" == *"migration"* ]]; then
            FOCUS="Additional focus: migration safety, index usage, query performance, data integrity, backwards compatibility, and rollback strategy."
          elif [[ "$PR_LABELS" == *"infra"* ]] || [[ "$PR_LABELS" == *"devops"* ]]; then
            FOCUS="Additional focus: infrastructure security, secrets management, resource limits, monitoring, and deployment safety."
          fi
          
          # Combine prompts
          if [ -n "$FOCUS" ]; then
            SYSTEM_PROMPT="$BASE_PROMPT

          $FOCUS"
          else
            SYSTEM_PROMPT="$BASE_PROMPT"
          fi
          
          # Write safely
          DELIMITER=$(openssl rand -hex 16)
          {
            echo "SYSTEM_PROMPT<<$DELIMITER"
            echo "$SYSTEM_PROMPT"
            echo "$DELIMITER"
          } >> "$GITHUB_ENV"

      - name: Call Qwen API
        if: steps.check_reviewed.outputs.skip != 'true'
        id: qwen
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::group::Qwen API Call"
          echo "Starting AI code review..."
          echo "PR: #$PR_NUMBER by $PR_AUTHOR"
          echo "Commit: $HEAD_SHA"
          echo "Model: $QWEN_MODEL"
          echo "Files changed: $FILE_COUNT"
          echo "Changes: +$ADDITIONS -$DELETIONS"
          
          # Check API Key
          if [ -z "$QWEN_API_KEY" ]; then
            echo "::error::QWEN_API_KEY secret is not configured"
            echo "API_ERROR=true" >> "$GITHUB_ENV"
            echo "ERROR_MSG=QWEN_API_KEY secret is not configured. Please add it in Settings -> Secrets -> Actions." >> "$GITHUB_ENV"
            echo "::endgroup::"
            exit 0
          fi
          echo "API Key: configured (not shown for security)"
          
          # Build user content with jq (safe JSON encoding)
          USER_CONTENT=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg author "$PR_AUTHOR" \
            --arg number "$PR_NUMBER" \
            --arg files "$CHANGED_FILES" \
            --arg additions "$ADDITIONS" \
            --arg deletions "$DELETIONS" \
            --arg file_count "$FILE_COUNT" \
            --arg diff "$DIFF" \
            '"## Pull Request #" + $number + "\n\n**Title:** " + $title + "\n**Author:** @" + $author + "\n**Changes:** +" + $additions + " -" + $deletions + " in " + $file_count + " files\n\n**Description:**\n" + ($body // "No description provided") + "\n\n**Changed Files:**\n```\n" + $files + "```\n\n## Code Diff\n```diff\n" + $diff + "\n```"')
          
          # Build full payload
          PAYLOAD=$(jq -n \
            --arg model "$QWEN_MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --argjson user "$USER_CONTENT" \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ],
              temperature: 0.2,
              max_tokens: 4096
            }')
          
          echo "Sending request to Qwen API..."
          echo "Endpoint: $QWEN_API_ENDPOINT"
          echo "Timeout: 120 seconds"
          
          # Call API with error handling
          START_TIME=$(date +%s)
          HTTP_CODE=$(curl -s -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $QWEN_API_KEY" \
            -d "$PAYLOAD" \
            -o response.json \
            --max-time 120 \
            "$QWEN_API_ENDPOINT")
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "API Response Code: $HTTP_CODE"
          echo "Request duration: ${DURATION}s"
          
          # Check HTTP status
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::API request failed with HTTP $HTTP_CODE"
            if [ -f response.json ]; then
              ERROR_DETAIL=$(jq -r '.error.message // .message // "Unknown error"' response.json 2>/dev/null || echo "Could not parse error")
              echo "Error detail: $ERROR_DETAIL"
            fi
            echo "API_ERROR=true" >> "$GITHUB_ENV"
            echo "ERROR_MSG=Qwen API returned HTTP $HTTP_CODE. Please check your API key and quota." >> "$GITHUB_ENV"
            echo "::endgroup::"
            exit 0
          fi
          
          # Validate response format
          if ! jq -e '.choices[0].message.content' response.json > /dev/null 2>&1; then
            echo "::error::Invalid API response format"
            echo "API_ERROR=true" >> "$GITHUB_ENV"
            echo "ERROR_MSG=Invalid response format from Qwen API" >> "$GITHUB_ENV"
            echo "::endgroup::"
            exit 0
          fi
          
          # Log token usage if available (non-sensitive)
          if jq -e '.usage' response.json > /dev/null 2>&1; then
            PROMPT_TOKENS=$(jq -r '.usage.prompt_tokens // "N/A"' response.json)
            COMPLETION_TOKENS=$(jq -r '.usage.completion_tokens // "N/A"' response.json)
            TOTAL_TOKENS=$(jq -r '.usage.total_tokens // "N/A"' response.json)
            echo "Token usage: prompt=$PROMPT_TOKENS, completion=$COMPLETION_TOKENS, total=$TOTAL_TOKENS"
          fi
          
          # Extract and sanitize response
          AI_RESPONSE=$(jq -r '.choices[0].message.content' response.json)
          
          # Remove @mentions to prevent notification spam (insert zero-width space after @)
          # Use perl for reliable Unicode handling - only target @username patterns at word boundaries
          # This avoids modifying email addresses like foo@bar.com
          AI_RESPONSE=$(echo "$AI_RESPONSE" | perl -CSD -pe 's/(?<![a-zA-Z0-9])@([a-zA-Z0-9_-]+)/@\x{200B}$1/g' 2>/dev/null || echo "$AI_RESPONSE")
          
          # Limit output length (GitHub comment limit is 65536)
          if [ ${#AI_RESPONSE} -gt 60000 ]; then
            AI_RESPONSE="${AI_RESPONSE:0:60000}

          ... (response truncated due to length)"
          fi
          
          # Write safely
          DELIMITER=$(openssl rand -hex 16)
          {
            echo "AI_COMMENT<<$DELIMITER"
            echo "$AI_RESPONSE"
            echo "$DELIMITER"
          } >> "$GITHUB_ENV"
          
          RESPONSE_LENGTH=${#AI_RESPONSE}
          echo "AI review generated successfully (${RESPONSE_LENGTH} chars)"
          echo "::endgroup::"

      - name: Post review comment
        if: steps.check_reviewed.outputs.skip != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: qwen-ai-review
          message: |
            <!-- qwen-review-marker -->
            <!-- qwen-review-sha:${{ github.event.pull_request.head.sha }} -->
            ## :robot: Qwen AI Code Review
            
            ${{ env.API_ERROR == 'true' && format(':x: **Review Failed**

            {0}

            Please check the workflow logs for details.', env.ERROR_MSG) || env.AI_COMMENT }}
            
            ---
            <details>
            <summary>:information_source: Review Info</summary>
            
            | Item | Value |
            |------|-------|
            | Model | `${{ env.QWEN_MODEL }}` |
            | Commit | `${{ github.event.pull_request.head.sha }}` |
            | Files | ${{ env.FILE_COUNT }} |
            | Changes | +${{ env.ADDITIONS }} -${{ env.DELETIONS }} |
            ${{ env.DIFF_TRUNCATED == 'true' && '| Note | Diff was truncated due to size |' || '' }}
            ${{ env.SENSITIVE_WARNING == 'true' && '| :warning: | Potentially sensitive files detected |' || '' }}
            
            </details>
            
            > :bulb: Add `no-ai-review` label to skip AI review for this PR.
            > Push a new commit to trigger a new review.

      - name: Log skip reason
        if: steps.check_reviewed.outputs.skip == 'true'
        run: |
          echo "::notice::Skipping AI review - this commit has already been reviewed"
          echo "Commit SHA: ${{ github.event.pull_request.head.sha }}"
          echo "To trigger a new review, push a new commit to this PR"
          echo "The existing review comment will remain visible on the PR"
