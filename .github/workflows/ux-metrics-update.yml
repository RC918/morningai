name: UX Metrics Update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-metrics:
    name: Update UX Metrics Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run UX Metrics Aggregator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ux/aggregate-metrics.mjs --limit=30
      
      - name: Copy metrics to owner-console public directory
        run: |
          mkdir -p handoff/20250928/40_App/owner-console/public/metrics
          cp metrics/ux-metrics.json handoff/20250928/40_App/owner-console/public/metrics/ux-metrics.json
      
      - name: Commit and push updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add metrics/ux-metrics.json
            git add handoff/20250928/40_App/owner-console/public/metrics/ux-metrics.json
            git commit -m "chore: Update UX metrics dashboard data [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
      
      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ux-metrics
          path: metrics/ux-metrics.json
          retention-days: 90
