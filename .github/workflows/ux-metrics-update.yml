name: UX Metrics Update

# 📚 Documentation: docs/ci_matrix.md (Section 17: UX Metrics Update)
# 
# This workflow updates UX metrics dashboard data and creates PRs.
# 
# Key features:
# - PR mode to comply with repository rules (PR #1425)
# - Auto-sets i18n check status for metrics-only PRs (PR #1454)
# - Belt-and-suspenders approach (commit status + check run)
# 
# For troubleshooting and detailed documentation, see docs/ci_matrix.md

on:
  push:
    branches: [main]
    paths-ignore:
      - 'metrics/**'
      - 'handoff/20250928/40_App/owner-console/public/metrics/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update-metrics:
    name: Update UX Metrics Dashboard
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run UX Metrics Aggregator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ux/aggregate-metrics.mjs --limit=30
      
      - name: Copy metrics to owner-console public directory
        run: |
          mkdir -p handoff/20250928/40_App/owner-console/public/metrics
          cp metrics/ux-metrics.json handoff/20250928/40_App/owner-console/public/metrics/ux-metrics.json
      
      - name: Create or update metrics PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: Update UX metrics dashboard data [skip ci]"
          title: "chore: Update UX metrics"
          body: |
            Automated UX metrics update via GitHub Actions.
            
            This PR updates the UX metrics dashboard data based on recent merged PRs.
            
            **Changes:**
            - Updated `metrics/ux-metrics.json`
            - Updated `handoff/20250928/40_App/owner-console/public/metrics/ux-metrics.json`
            
            **Auto-merge:** This PR can be safely merged if all checks pass.
          branch: chore/ux-metrics
          base: main
          delete-branch: true
          labels: automerge
      
      - name: Locate UX Metrics PR and analyze changes
        id: analyze
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Prefer the PR number from create-pull-request. Fallback: find PR by head branch.
            let prNumber = Number('${{ steps.cpr.outputs.pull-request-number || '' }}') || null;
            let pr;
            if (prNumber) {
              core.info(`Using PR number from create-pull-request: ${prNumber}`);
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            } else {
              core.info('No PR number from create-pull-request, searching by head branch...');
              const list = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:chore/ux-metrics`, per_page: 1
              });
              pr = list.data[0];
            }

            if (!pr) {
              core.notice('No open UX Metrics PR found. Nothing to set.');
              return;
            }

            core.info(`Found PR #${pr.number} with head SHA ${pr.head.sha}`);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);

            // List changed files and decide if they are metrics-only
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });

            core.info(`PR has ${files.length} changed files`);

            const isMetricsFile = (f) => /^(metrics\/ux-metrics\.json|handoff\/.+\/40_App\/(owner-console|frontend-dashboard)\/public\/metrics\/ux-metrics\.json)$/.test(f.filename);
            const metricsFiles = files.filter(f => isMetricsFile(f));
            const nonMetricsFiles = files.filter(f => !isMetricsFile(f));
            const onlyMetrics = nonMetricsFiles.length === 0 && metricsFiles.length > 0;

            core.info(`Metrics files: ${metricsFiles.length}, Non-metrics files: ${nonMetricsFiles.length}`);
            core.info(`Only metrics: ${onlyMetrics}`);

            core.setOutput('only_metrics', onlyMetrics ? 'true' : 'false');
      
      - name: Set i18n required status (commit status)
        if: steps.analyze.outputs.only_metrics == 'true' && steps.analyze.outputs.head_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = '${{ steps.analyze.outputs.head_sha }}';
            
            core.info(`Setting commit status for SHA ${sha}`);
            
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'success',
              context: 'Changed Files Strict i18n Check',
              description: 'Metrics-only UX update; strict JS/TS i18n check not applicable',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            });
            
            core.info(`✅ Set commit status success for ${sha}`);
      
      - name: Create check run (belt-and-suspenders)
        if: steps.analyze.outputs.only_metrics == 'true' && steps.analyze.outputs.head_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = '${{ steps.analyze.outputs.head_sha }}';
            
            core.info(`Creating check run for SHA ${sha}`);
            
            await github.rest.checks.create({
              owner, repo,
              name: 'Changed Files Strict i18n Check',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Metrics-only change',
                summary: 'UX Metrics data-only update; no JS/TS files modified. Marking strict i18n check as not applicable.'
              }
            });
            
            core.info(`✅ Created check run for ${sha}`);
      
      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ux-metrics
          path: metrics/ux-metrics.json
          retention-days: 90
