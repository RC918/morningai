name: Deploy Storybook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/src/**/*.stories.jsx'
      - 'handoff/20250928/40_App/frontend-dashboard/src/**/*.stories.tsx'
      - 'handoff/20250928/40_App/frontend-dashboard/src/**/*.mdx'
      - 'handoff/20250928/40_App/frontend-dashboard/.storybook/**'
      - 'handoff/20250928/40_App/frontend-dashboard/package.json'
      - 'packages/shared-ui/src/**/*.stories.jsx'
      - 'packages/shared-ui/src/**/*.stories.tsx'
      - 'packages/shared-ui/src/**/*.mdx'
  pull_request:
    branches: [main]
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/src/**/*.stories.jsx'
      - 'handoff/20250928/40_App/frontend-dashboard/src/**/*.stories.tsx'
      - 'handoff/20250928/40_App/frontend-dashboard/src/**/*.mdx'
      - 'handoff/20250928/40_App/frontend-dashboard/.storybook/**'
      - 'handoff/20250928/40_App/frontend-dashboard/package.json'
      - 'packages/shared-ui/src/**/*.stories.jsx'
      - 'packages/shared-ui/src/**/*.stories.tsx'
      - 'packages/shared-ui/src/**/*.mdx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared-ui package
        run: pnpm --filter @morningai/shared-ui build
      
      - name: Build Storybook
        run: pnpm --filter frontend-dashboard build-storybook
      
      - name: Prepare publish directory with redirect
        run: |
          mkdir -p storybook_publish/storybook
          cp -r handoff/20250928/40_App/frontend-dashboard/storybook-static/* storybook_publish/storybook/
          
          # Sanity check: ensure only one iframe bundle exists (multiple = corrupted build)
          count=$(ls storybook_publish/storybook/assets/iframe-*.js 2>/dev/null | wc -l)
          if [ "$count" -gt 1 ]; then
            echo "Error: Expected 1 iframe bundle, found $count. Build may be corrupted."
            exit 1
          fi
          echo "Sanity check passed: found $count iframe bundle(s)"
          
          # Generate dashboard redirect to /storybook/
          mkdir -p storybook_publish/dashboard
          cat > storybook_publish/dashboard/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=/storybook/">
            <title>Redirecting to Storybook...</title>
          </head>
          <body>
            <p>Redirecting to <a href="/storybook/">Storybook</a>...</p>
          </body>
          </html>
          EOF
          
          # Add vercel.json to skip install/build for pre-built static files
          cat > storybook_publish/vercel.json << 'EOF'
          {
            "installCommand": "echo 'skip install - pre-built static files'",
            "buildCommand": "echo 'skip build - pre-built static files'",
            "outputDirectory": "storybook"
          }
          EOF
      
      - name: Deploy to GitHub Pages (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook_publish
          publish_branch: gh-pages-storybook
          cname: storybook.gm365.me
          enable_jekyll: false
          # keep_files: false ensures clean builds - using 'true' causes accumulation
          # of old assets from multiple builds, leading to corrupted Storybook
          # (e.g., multiple iframe-*.js files causing __STORYBOOK_MODULE_PREVIEW_API__ errors)
          keep_files: false
      
      - name: Upload Storybook artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: handoff/20250928/40_App/frontend-dashboard/storybook-static
          retention-days: 7
      
      - name: Comment PR with Storybook preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = context.runId;
            const prNumber = context.payload.pull_request.number;
            
            const comment = `## 📚 Storybook Preview
            
            Storybook has been built successfully for this PR!
            
            **Artifact**: [Download Storybook Static Files](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})
            
            To view locally:
            1. Download the artifact
            2. Extract and serve: \`npx http-server storybook-static\`
            3. Open http://localhost:8080
            
            ---
            *This comment is automatically generated by the Storybook Deploy workflow.*`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
