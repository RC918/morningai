name: lighthouse-ci

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at 00:00 UTC (non-blocking signal collection)
  workflow_dispatch:  # Manual trigger for testing

jobs:
  lhci-pr:
    if: false  # Disabled during stabilization period - will re-enable after 5 consecutive nightly passes
    runs-on: ubuntu-latest
    concurrency:
      group: lhci-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: handoff/20250928/40_App/frontend-dashboard
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-ui package
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @morningai/shared-ui build

      - name: Build application
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm preview --port 4173 &
          echo $! > preview.pid

      - name: Wait for server
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:4173 > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/60: Server not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Server failed to start within 120 seconds"
          exit 1

      - name: Debug preview server
        run: |
          echo "Testing preview server response..."
          curl -sS http://localhost:4173/ | head -c 1000 || echo "Failed to fetch homepage"
          echo ""
          echo "Checking asset URLs..."
          curl -sS http://localhost:4173/ | sed 's/</\n</g' | grep -Eo 'src="/[^"]+\.js"|href="/[^"]+\.css"' | sed -E 's/^(src|href)=//;s/"//g' | head -10 | while read asset; do
            echo "Testing asset: $asset"
            curl -I "http://localhost:4173$asset" 2>&1 | head -2
          done

      - name: Check for hidden CSS patterns
        run: |
          echo "Checking for CSS patterns that might prevent FCP..."
          grep -RniE 'body\s*\{|visibility\s*:\s*hidden|opacity\s*:\s*0|display\s*:\s*none' dist 2>/dev/null | head -20 || echo "No problematic CSS patterns found"

      - name: Verify server before Playwright
        run: |
          echo "Verifying preview server is still responsive..."
          curl -I http://localhost:4173/ || echo "Homepage check failed"
          curl -I http://localhost:4173/login || echo "Login page check failed"

      - name: Setup Playwright authentication
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          mkdir -p playwright/.auth
          echo "Working directory: $(pwd)"
          pnpm exec playwright install chromium
          pnpm exec playwright test tests/auth.setup.spec.ts --trace on-first-retry
        working-directory: handoff/20250928/40_App/frontend-dashboard

      - name: Upload Playwright test results (PR)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-pr
          path: |
            handoff/20250928/40_App/frontend-dashboard/test-results/
            handoff/20250928/40_App/frontend-dashboard/playwright-report/

      - name: Run Lighthouse CI (PR - fast)
        env:
          DEBUG: lighthouse:*
        run: pnpm dlx @lhci/cli collect --url=http://localhost:4173/ --url=http://localhost:4173/login --url=http://localhost:4173/pricing --numberOfRuns=1 --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-features=PaintHolding" --settings.maxWaitForFcp=60000 --settings.maxWaitForLoad=120000 --settings.throttlingMethod=provided --settings.formFactor=desktop --settings.screenEmulation.mobile=false --logLevel=verbose

      - name: Upload LHCI artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhci-artifacts-pr
          path: handoff/20250928/40_App/frontend-dashboard/.lighthouseci

      - name: Generate PR comment
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/make-lhci-pr-comment.js

      - name: Read PR comment
        if: always()
        id: read_comment
        run: |
          if [ -f .lhci-diff.md ]; then
            {
              echo 'COMMENT<<EOF'
              cat .lhci-diff.md
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "COMMENT=⚠️ Lighthouse CI 報告生成失敗" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.read_comment.outputs.COMMENT }}

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true
          fi

  lhci-main:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: lhci-main
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        working-directory: handoff/20250928/40_App/frontend-dashboard
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-ui package
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @morningai/shared-ui build

      - name: Build application
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm preview --port 4173 &
          echo $! > preview.pid

      - name: Wait for server
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:4173 > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/60: Server not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Server failed to start within 120 seconds"
          exit 1

      - name: Debug preview server
        run: |
          echo "Testing preview server response..."
          curl -sS http://localhost:4173/ | head -c 1000 || echo "Failed to fetch homepage"
          echo ""
          echo "Checking asset URLs..."
          curl -sS http://localhost:4173/ | sed 's/</\n</g' | grep -Eo 'src="/[^"]+\.js"|href="/[^"]+\.css"' | sed -E 's/^(src|href)=//;s/"//g' | head -10 | while read asset; do
            echo "Testing asset: $asset"
            curl -I "http://localhost:4173$asset" 2>&1 | head -2
          done

      - name: Verify server before Playwright
        run: |
          echo "Verifying preview server is still responsive..."
          curl -I http://localhost:4173/ || echo "Homepage check failed"
          curl -I http://localhost:4173/login || echo "Login page check failed"

      - name: Setup Playwright authentication
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          mkdir -p playwright/.auth
          echo "Working directory: $(pwd)"
          pnpm exec playwright install chromium
          pnpm exec playwright test tests/auth.setup.spec.ts --trace on-first-retry
        working-directory: handoff/20250928/40_App/frontend-dashboard

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: |
            handoff/20250928/40_App/frontend-dashboard/test-results/
            handoff/20250928/40_App/frontend-dashboard/playwright-report/

      - name: Verify storage state file
        run: |
          echo "Working directory: $(pwd)"
          echo "Checking for storage state file..."
          ls -la playwright/.auth/ || echo "Auth directory not found"
          if [ -f playwright/.auth/storageState.json ]; then
            echo "✅ Storage state file exists"
            node -e "const fs=require('fs');const p='playwright/.auth/storageState.json';const s=JSON.parse(fs.readFileSync(p,'utf8'));console.log('Origins:',s.origins?.length||0);console.log('localStorage keys:',(s.origins||[]).flatMap(o=>o.localStorage?.map(i=>i.name)||[]).join(', '));"
          else
            echo "❌ Storage state file not found"
            exit 1
          fi

      - name: Generate LHCI cookie
        working-directory: ${{ github.workspace }}
        run: node scripts/make-lhci-cookie.js

      - name: Run Lighthouse CI (main - nightly signal collection)
        continue-on-error: true
        run: pnpm dlx @lhci/cli collect --url=http://localhost:4173/ --url=http://localhost:4173/login --url=http://localhost:4173/pricing --url=http://localhost:4173/dashboard --url=http://localhost:4173/settings --numberOfRuns=1 --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage"

      - name: Upload LHCI artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhci-artifacts-main
          path: handoff/20250928/40_App/frontend-dashboard/.lighthouseci

      - name: Update baseline and trend
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/update-baseline-and-trend.js

      - name: Commit baseline updates
        if: always()
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update LHCI baseline & trend [skip ci]"
          file_pattern: ".lhci-baseline.json trend.csv"

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true
          fi
