name: lighthouse-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/**'
      - 'handoff/20250928/40_App/owner-console/**'
      - 'packages/shared-ui/**'
      - 'lighthouserc.json'
  push:
    branches:
      - main
    paths:
      - 'handoff/20250928/40_App/frontend-dashboard/**'
      - 'handoff/20250928/40_App/owner-console/**'
      - 'packages/shared-ui/**'
      - 'lighthouserc.json'
  schedule:
    - cron: '0 0 * * *'  # Daily at 00:00 UTC (non-blocking signal collection)
  workflow_dispatch:  # Manual trigger for testing

jobs:
  lhci-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: lhci-${{ github.head_ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: handoff/20250928/40_App/frontend-dashboard
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-ui package
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @morningai/shared-ui build

      - name: Setup Python for backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}
        run: |
          cd handoff/20250928/40_App/api-backend
          pip install -r requirements.txt

      - name: Start backend API with mock users
        working-directory: ${{ github.workspace }}
        run: |
          cd handoff/20250928/40_App/api-backend
          export FLASK_APP=src.main:app
          export ENABLE_MOCK_USERS=true
          export ENABLE_ORCHESTRATOR=false
          export JWT_SECRET_KEY=test-jwt-secret-for-lhci-ci
          export FLASK_SECRET_KEY=test-flask-secret-for-lhci-ci
          export ENVIRONMENT=development
          export CORS_ORIGINS=http://localhost:4173,http://127.0.0.1:4173
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/handoff/20250928/40_App/api-backend/src:${PYTHONPATH}"
          
          # Verify critical imports work before starting Flask
          python - <<'PY'
          import sys, importlib
          print("PYTHONPATH OK, first 5:", sys.path[:5])
          import common
          importlib.import_module('src.services.auth_service')
          print("✅ Import preflight: OK (orchestrator disabled for LHCI)")
          PY
          
          # Log environment for debugging
          echo "PYTHONPATH=$PYTHONPATH" > backend.log
          python - <<'PY' >> backend.log
          import sys
          print("sys.path (first 10):", sys.path[:10])
          PY
          
          nohup gunicorn -b 0.0.0.0:5000 'src.main:app' --workers=1 --threads=4 --timeout=120 >> backend.log 2>&1 &
          echo $! > backend.pid
          
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "✅ Backend is ready"
              curl -s http://localhost:5000/health | head -20
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          
          if ! curl -sf http://localhost:5000/health > /dev/null; then
            echo "❌ Backend failed to start"
            cat backend.log
            exit 1
          fi

      - name: Build application
        run: |
          echo "VITE_API_BASE_URL=http://localhost:5000" > .env.production
          pnpm build

      - name: Start preview server
        run: |
          pnpm preview --port 4173 &
          echo $! > preview.pid

      - name: Wait for server
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:4173 > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/60: Server not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Server failed to start within 120 seconds"
          exit 1

      - name: Debug preview server
        run: |
          echo "Testing preview server response..."
          curl -sS http://localhost:4173/ | head -c 1000 || echo "Failed to fetch homepage"
          echo ""
          echo "Checking asset URLs..."
          curl -sS http://localhost:4173/ | sed 's/</\n</g' | grep -Eo 'src="/[^"]+\.js"|href="/[^"]+\.css"' | sed -E 's/^(src|href)=//;s/"//g' | head -10 | while read asset; do
            echo "Testing asset: $asset"
            curl -I "http://localhost:4173$asset" 2>&1 | head -2
          done

      - name: Check for hidden CSS patterns
        run: |
          echo "Checking for CSS patterns that might prevent FCP..."
          grep -RniE 'body\s*\{|visibility\s*:\s*hidden|opacity\s*:\s*0|display\s*:\s*none' dist 2>/dev/null | head -20 || echo "No problematic CSS patterns found"

      - name: Verify server before Playwright
        run: |
          echo "Verifying preview server is still responsive..."
          curl -I http://localhost:4173/ || echo "Homepage check failed"
          curl -I http://localhost:4173/login || echo "Login page check failed"

      - name: Setup Playwright authentication
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          mkdir -p playwright/.auth
          echo "Working directory: $(pwd)"
          pnpm exec playwright install chromium
          pnpm exec playwright test tests/auth.setup.spec.ts --trace on-first-retry
        working-directory: handoff/20250928/40_App/frontend-dashboard

      - name: Upload Playwright test results (PR)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-test-results-pr
          path: |
            handoff/20250928/40_App/frontend-dashboard/test-results/
            handoff/20250928/40_App/frontend-dashboard/playwright-report/

      - name: Run Lighthouse CI (PR - fast)
        env:
          DEBUG: lighthouse:*
        run: pnpm dlx @lhci/cli collect --config=../../../../lighthouserc.json --url=http://localhost:4173/ --url=http://localhost:4173/login --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-features=PaintHolding" --settings.maxWaitForFcp=60000 --settings.maxWaitForLoad=120000 --logLevel=verbose

      - name: Assert Lighthouse CI budgets
        run: pnpm dlx @lhci/cli assert --config=../../../../lighthouserc.json

      - name: Upload LHCI artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lhci-artifacts-pr
          path: handoff/20250928/40_App/frontend-dashboard/.lighthouseci

      - name: Generate PR comment
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/make-lhci-pr-comment.js

      - name: Read PR comment
        if: always()
        id: read_comment
        run: |
          if [ -f .lhci-diff.md ]; then
            {
              echo 'COMMENT<<EOF'
              cat .lhci-diff.md
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "COMMENT=⚠️ Lighthouse CI 報告生成失敗" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.read_comment.outputs.COMMENT }}

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-logs-lhci-pr
          path: handoff/20250928/40_App/api-backend/backend.log
          retention-days: 14

      - name: Stop backend
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f handoff/20250928/40_App/api-backend/backend.pid ]; then
            kill $(cat handoff/20250928/40_App/api-backend/backend.pid) || true
          fi

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true
          fi

  lhci-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lhci-main
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        working-directory: handoff/20250928/40_App/frontend-dashboard
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-ui package
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @morningai/shared-ui build

      - name: Setup Python for backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}
        run: |
          cd handoff/20250928/40_App/api-backend
          pip install -r requirements.txt

      - name: Start backend API with mock users
        working-directory: ${{ github.workspace }}
        run: |
          cd handoff/20250928/40_App/api-backend
          export FLASK_APP=src.main:app
          export ENABLE_MOCK_USERS=true
          export ENABLE_ORCHESTRATOR=false
          export JWT_SECRET_KEY=test-jwt-secret-for-lhci-ci
          export FLASK_SECRET_KEY=test-flask-secret-for-lhci-ci
          export ENVIRONMENT=development
          export CORS_ORIGINS=http://localhost:4173,http://127.0.0.1:4173
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/handoff/20250928/40_App/api-backend/src:${PYTHONPATH}"
          
          # Verify critical imports work before starting Flask
          python - <<'PY'
          import sys, importlib
          print("PYTHONPATH OK, first 5:", sys.path[:5])
          import common
          importlib.import_module('src.services.auth_service')
          print("✅ Import preflight: OK (orchestrator disabled for LHCI)")
          PY
          
          # Log environment for debugging
          echo "PYTHONPATH=$PYTHONPATH" > backend.log
          python - <<'PY' >> backend.log
          import sys
          print("sys.path (first 10):", sys.path[:10])
          PY
          
          nohup gunicorn -b 0.0.0.0:5000 'src.main:app' --workers=1 --threads=4 --timeout=120 >> backend.log 2>&1 &
          echo $! > backend.pid
          
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "✅ Backend is ready"
              curl -s http://localhost:5000/health | head -20
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          
          if ! curl -sf http://localhost:5000/health > /dev/null; then
            echo "❌ Backend failed to start"
            cat backend.log
            exit 1
          fi

      - name: Build application
        run: |
          echo "VITE_API_BASE_URL=http://localhost:5000" > .env.production
          pnpm build

      - name: Start preview server
        run: |
          pnpm preview --port 4173 &
          echo $! > preview.pid

      - name: Wait for server
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:4173 > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/60: Server not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Server failed to start within 120 seconds"
          exit 1

      - name: Debug preview server
        run: |
          echo "Testing preview server response..."
          curl -sS http://localhost:4173/ | head -c 1000 || echo "Failed to fetch homepage"
          echo ""
          echo "Checking asset URLs..."
          curl -sS http://localhost:4173/ | sed 's/</\n</g' | grep -Eo 'src="/[^"]+\.js"|href="/[^"]+\.css"' | sed -E 's/^(src|href)=//;s/"//g' | head -10 | while read asset; do
            echo "Testing asset: $asset"
            curl -I "http://localhost:4173$asset" 2>&1 | head -2
          done

      - name: Verify server before Playwright
        run: |
          echo "Verifying preview server is still responsive..."
          curl -I http://localhost:4173/ || echo "Homepage check failed"
          curl -I http://localhost:4173/login || echo "Login page check failed"

      - name: Setup Playwright authentication
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          mkdir -p playwright/.auth
          echo "Working directory: $(pwd)"
          pnpm exec playwright install chromium
          pnpm exec playwright test tests/auth.setup.spec.ts --trace on-first-retry
        working-directory: handoff/20250928/40_App/frontend-dashboard

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-test-results
          path: |
            handoff/20250928/40_App/frontend-dashboard/test-results/
            handoff/20250928/40_App/frontend-dashboard/playwright-report/
          retention-days: 14

      - name: Verify storage state file
        continue-on-error: true
        run: |
          echo "Working directory: $(pwd)"
          echo "Checking for storage state file..."
          ls -la playwright/.auth/ || echo "Auth directory not found"
          if [ -f playwright/.auth/storageState.json ]; then
            echo "✅ Storage state file exists"
            node -e "const fs=require('fs');const p='playwright/.auth/storageState.json';const s=JSON.parse(fs.readFileSync(p,'utf8'));console.log('Origins:',s.origins?.length||0);console.log('localStorage keys:',(s.origins||[]).flatMap(o=>o.localStorage?.map(i=>i.name)||[]).join(', '));"
          else
            echo "⚠️ Storage state file not found - LHCI will test public pages only"
          fi

      - name: Debug LHCI config resolution
        run: |
          echo "=== LHCI Config Debug ==="
          echo "Current working directory: $(pwd)"
          echo "Config path (relative): ../../../../lighthouserc.main.json"
          echo "Config path (absolute): $(realpath ../../../../lighthouserc.main.json)"
          echo ""
          echo "=== Config file contents ==="
          cat ../../../../lighthouserc.main.json
          echo ""
          echo "=== Verifying puppeteerScript path ==="
          node -e "const fs=require('fs');const path=require('path');const cfgPath=path.resolve(process.cwd(),'../../../../lighthouserc.main.json');console.log('Config file path:', cfgPath);const cfg=JSON.parse(fs.readFileSync(cfgPath,'utf8'));const puppeteerScript=cfg.ci?.collect?.puppeteerScript;console.log('puppeteerScript (from config):', puppeteerScript);if(puppeteerScript){const absScript=path.resolve(path.dirname(cfgPath), puppeteerScript);console.log('puppeteerScript (absolute):', absScript);console.log('puppeteerScript exists:', fs.existsSync(absScript));}else{console.log('puppeteerScript not configured');}"

      - name: Run Lighthouse CI (main - nightly signal collection)
        if: always()
        continue-on-error: true
        run: pnpm dlx @lhci/cli collect --config=../../../../lighthouserc.main.json --url=http://localhost:4173/ --url=http://localhost:4173/login --url=http://localhost:4173/pricing --url=http://localhost:4173/dashboard --url=http://localhost:4173/settings --numberOfRuns=1 --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage"

      - name: Upload LHCI artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lhci-artifacts-main
          path: handoff/20250928/40_App/frontend-dashboard/.lighthouseci
          retention-days: 14

      - name: Update baseline and trend
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/update-baseline-and-trend.js

      - name: Commit baseline updates
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(ci): update LHCI baseline & trend [skip ci]"
          file_pattern: ".lhci-baseline.json trend.csv"
          branch: ${{ github.ref_name }}

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-logs-lhci-main
          path: handoff/20250928/40_App/api-backend/backend.log
          retention-days: 14

      - name: Stop backend
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f handoff/20250928/40_App/api-backend/backend.pid ]; then
            kill $(cat handoff/20250928/40_App/api-backend/backend.pid) || true
          fi

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true
          fi
