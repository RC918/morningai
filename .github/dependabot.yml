# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions - monthly updates for workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    # Group minor/patch updates together
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python dependencies for api-backend (FastAPI 後端，對應 requirements.txt)
  # 路徑說明：若目錄結構調整，需同步更新此處
  - package-ecosystem: "pip"
    directory: "/handoff/20250928/40_App/api-backend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    # Ignore MAJOR updates - tracked in #3470 for quarterly upgrade windows
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python dependencies for orchestrator (AI Agent 服務，對應 requirements.txt)
  # 路徑說明：若目錄結構調整，需同步更新此處
  - package-ecosystem: "pip"
    directory: "/handoff/20250928/40_App/orchestrator"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    # Ignore MAJOR updates - tracked in #3470 for quarterly upgrade windows
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # npm dependencies for owner-console (店家後台前端)
  # 路徑說明：若目錄結構調整，需同步更新此處
  - package-ecosystem: "npm"
    directory: "/handoff/20250928/40_App/owner-console"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    # Ignore MAJOR updates - tracked in #3470 for quarterly upgrade windows
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group minor/patch updates together
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies for shared-ui (共用 UI 元件庫)
  # 路徑說明：若目錄結構調整，需同步更新此處
  - package-ecosystem: "npm"
    directory: "/packages/shared-ui"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    # Ignore MAJOR updates - tracked in #3470 for quarterly upgrade windows
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group minor/patch updates together
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
