# =============================================================================
# Render IaC Configuration for MorningAI
# =============================================================================
# IMPORTANT: The following secrets must be manually configured in Render Dashboard
# before deployment (sync: false means they are not auto-generated):
#
# Required secrets (min 32 characters):
#   - FLASK_SECRET_KEY: Flask session secret key
#   - ENCRYPTION_MASTER_KEY: Master key for data encryption
#   - JWT_SECRET_KEY: JWT token signing key (auto-generated if not set)
#
# External service credentials:
#   - DATABASE_URL: PostgreSQL connection string
#   - REDIS_URL: Redis connection string
#   - SENTRY_DSN: Sentry error tracking DSN
#   - GITHUB_TOKEN / AGENT_GITHUB_TOKEN: GitHub API tokens
#   - OPENAI_API_KEY: OpenAI API key
#   - SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY: Supabase credentials
#   - CORS_ORIGINS: Comma-separated list of allowed CORS origins (e.g., https://admin.gm365.me)
#   - ORCHESTRATOR_CORS_ORIGINS: Comma-separated list of allowed CORS origins for the orchestrator API
#
# Configure these in Render Dashboard > Environment Groups or per-service Environment
# =============================================================================

services:
  - type: web
    name: morningai-backend-v2
    env: python
    runtime: python
    autoDeploy: false  # Disabled to prevent Dashboard settings from being overridden (#2897)
    buildCommand: |
      pip install --upgrade pip &&
      pip uninstall -y jwt || true &&
      pip install -r handoff/20250928/40_App/api-backend/requirements.txt \
                  -r handoff/20250928/40_App/orchestrator/requirements.txt &&
      pip install -e handoff/20250928/40_App/orchestrator --no-deps &&
      pip check &&
      python -c "import jwt; assert hasattr(jwt, 'decode'), 'Wrong jwt package'" &&
      python -c "import httpx, websockets, supabase; print(f'httpx={httpx.__version__}, websockets={websockets.__version__}, supabase={supabase.__version__}')"
    startCommand: cd handoff/20250928/40_App/api-backend && gunicorn -c gunicorn.conf.py src.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/handoff/20250928/40_App:/opt/render/project/src/handoff/20250928/40_App/api-backend/src
      - key: FLASK_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: AGENT_GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: RC918/morningai
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SANDBOX_ENABLED
        value: false
      - key: RQ_QUEUE_NAME
        value: orchestrator
      # USE_LANGGRAPH removed in Issue #2651 - LangGraph is now the only orchestrator mode
      - key: ENABLE_MOCK_USERS
        value: false
      - key: APP_VERSION
        value: "8.0.0"
      - key: CORS_ORIGINS
        sync: false
      # === Production Feature Flags (P1.1) ===
      - key: COOKIE_SAMESITE
        value: "None"
      - key: COOKIE_SECURE
        value: "true"
      # === Production Rate Limiting (P1.2) ===
      - key: RATE_LIMIT_BY_USER
        value: "false"
      - key: RATE_LIMIT_FAIL_FAST
        value: "true"
      - key: RATE_LIMIT_REDIS_MAX_RETRIES
        value: "3"
      - key: RATE_LIMIT_REDIS_RETRY_DELAY
        value: "1"
      - key: RATE_LIMIT_REQUESTS
        value: "100"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      # === Production Worker Settings (P1.2) ===
      - key: GUNICORN_WORKERS
        value: "2"

  - type: worker
    name: morningai-agent-worker
    env: python
    runtime: python
    autoDeploy: false  # Disabled to prevent Dashboard settings from being overridden (#2897)
    buildCommand: |
      cd handoff/20250928/40_App/orchestrator &&
      pip install --upgrade pip &&
      pip uninstall -y jwt || true &&
      pip install -r requirements.txt &&
      pip install -e . --no-deps &&
      pip check &&
      python -c "import httpx, websockets, supabase; print(f'httpx={httpx.__version__}, websockets={websockets.__version__}, supabase={supabase.__version__}')"
    startCommand: cd handoff/20250928/40_App/orchestrator && python redis_queue/worker.py
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src:/opt/render/project/src/handoff/20250928/40_App:/opt/render/project/src/handoff/20250928/40_App/api-backend/src:/opt/render/project/src/agents/dev_agent
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DEMO_MODE
        value: false
      - key: RQ_QUEUE_NAME
        value: orchestrator
      - key: ENVIRONMENT
        value: production
      - key: GITHUB_TOKEN
        sync: false
      - key: AGENT_GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: RC918/morningai
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SANDBOX_ENABLED
        value: false
      - key: ORCHESTRATOR_TEST_MODE
        value: false
      - key: ENABLE_MOCK_USERS
        value: false
      - key: RQ_MAX_JOBS
        value: "50"
      - key: DATABASE_URL
        sync: false
      - key: USE_POSTGRES_CHECKPOINTER
        value: "true"
      - key: USE_LLM_PLANNER
        value: "true"
      - key: USE_LLM_REVIEWER
        value: "true"
      - key: SLACK_WEBHOOK_URL
        sync: false
      # === Production Feature Flags (P1.1) - TRUE flags ===
      - key: CROSS_PROVIDER_FALLBACK_ENABLED
        value: "true"
      - key: DRIFT_RETRY_ENABLED
        value: "true"
      - key: ENABLE_DYNAMIC_ROUTING
        value: "true"
      - key: ENABLE_GITHUB_REVIEW_POSTING
        value: "true"
      - key: ENABLE_MEMORY_CONSOLIDATION
        value: "true"
      - key: ENABLE_MEMORY_V2
        value: "true"
      - key: ENABLE_REVIEW_FEEDBACK_LOOP
        value: "true"
      - key: ENABLE_REVIEW_PATTERN_RETRIEVAL
        value: "true"
      - key: ENABLE_SELF_CRITIQUE
        value: "true"
      - key: ENABLE_SIMPLE_CODER
        value: "true"
      - key: REFACTOR_AGENT_AUTO_PR
        value: "true"
      - key: REGRESSION_PIPELINE_AUTO_GENERATE
        value: "true"
      - key: REGRESSION_TEST_ENABLE_LLM
        value: "true"
      - key: REGRESSION_TEST_WRITE_TO_DISK
        value: "true"
      - key: USE_DEBATE_ENGINE
        value: "true"
      - key: USE_DEPENDENCY_ANALYSIS
        value: "true"
      - key: USE_MULTI_SPECIALIST_REVIEW
        value: "true"
      - key: USE_REGRESSION_PIPELINE
        value: "true"
      - key: USE_REVIEW_CONSOLIDATION
        value: "true"
      - key: USE_SELF_REFINEMENT
        value: "true"
      - key: USE_TEST_COVERAGE_FLAGGING
        value: "true"
      # === Production Feature Flags (P1.1) - FALSE flags ===
      - key: ENABLE_FAILURE_LEARNING_CONTEXT
        value: "false"
      - key: GITHUB_REVIEW_POSTING_DRY_RUN
        value: "false"
      - key: PR_DEDUP_DRY_RUN
        value: "false"
      - key: ROUTING_FORCE_TIER_FLOOR
        value: "false"
      # === Production Numeric Settings (P1.2) ===
      - key: DEGRADED_CHECKPOINT_MAX_PER_THREAD
        value: "5"
      - key: DEGRADED_CHECKPOINT_MEMORY_HARD_LIMIT_MB
        value: "512"
      - key: LLM_PROVIDER
        value: "gemini"
      - key: ROUTING_ALLOWED_PROVIDERS
        value: "gemini,alicloud,openai"
      - key: ROUTING_MAX_ESCALATIONS
        value: "1"

  - type: web
    name: braintrust-processor
    runtime: docker
    dockerfilePath: ./monitoring/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COST_ALERT_THRESHOLD
        value: "10.0"
      - key: LATENCY_ALERT_THRESHOLD
        value: "500.0"
      - key: REPO_ROOT
        value: /app
      - key: PYTHONPATH
        value: /app
      - key: DEBUG_IMPORTS
        value: "false"
    autoDeploy: false  # Disabled to reduce bandwidth/pipeline costs (#2897)

  - type: web
    name: morningai-orchestrator-api
    runtime: docker
    dockerfilePath: ./orchestrator/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ORCHESTRATOR_JWT_SECRET
        generateValue: true
      - key: ORCHESTRATOR_API_KEYS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ORCHESTRATOR_CORS_ORIGINS
        sync: false
      - key: ORCHESTRATOR_RATE_LIMIT_TASKS
        value: "10"
      - key: ORCHESTRATOR_RATE_LIMIT_EVENTS
        value: "20"
      - key: ORCHESTRATOR_RATE_LIMIT_APPROVALS
        value: "5"
      - key: ORCHESTRATOR_RATE_LIMIT_STATS
        value: "30"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ORCHESTRATOR_QUEUE_PREFIX
        value: orchestrator
      - key: ORCHESTRATOR_TASK_TTL
        value: "86400"
      - key: ORCHESTRATOR_APPROVAL_TIMEOUT
        value: "86400"
      - key: ORCHESTRATOR_APPROVAL_HISTORY_TTL
        value: "2592000"
      - key: ORCHESTRATOR_MAX_APPROVAL_HISTORY
        value: "1000"
    autoDeploy: false  # Disabled to reduce bandwidth/pipeline costs (#2897)

  - type: web
    name: morningai-worker-dashboard
    env: python
    runtime: python
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r agents/ops_agent/dashboard/requirements.txt
    startCommand: cd agents/ops_agent/dashboard && python app.py
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DASHBOARD_PORT
        value: "8080"
      - key: DASHBOARD_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://morningai-worker-dashboard.onrender.com
    autoDeploy: false  # Disabled to reduce bandwidth/pipeline costs (#2897)

  - type: worker
    name: morningai-ops-agent-worker
    env: python
    runtime: python
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r agents/ops_agent/requirements.txt
    startCommand: cd agents/ops_agent && python worker.py
    envVars:
      - key: REDIS_URL
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: ORCHESTRATOR_API_URL
        value: https://morningai-orchestrator-api.onrender.com
      - key: ORCHESTRATOR_API_KEY
        sync: false
      - key: POLL_INTERVAL
        value: "5"
      - key: ENVIRONMENT
        value: production
    autoDeploy: false  # Disabled to reduce bandwidth/pipeline costs (#2897)

  # CI Failure Scanner - Webhook backup mechanism (Issue #3519)
  # Runs every 15 minutes to catch CI failures missed by webhooks
  - type: cron
    name: morningai-ci-failure-scanner
    env: python
    runtime: python
    schedule: "*/15 * * * *"  # Every 15 minutes
    buildCommand: |
      cd handoff/20250928/40_App/orchestrator &&
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      pip install -e . --no-deps
    startCommand: cd handoff/20250928/40_App/orchestrator && python -m scanner.ci_failure_scanner
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src:/opt/render/project/src/handoff/20250928/40_App:/opt/render/project/src/handoff/20250928/40_App/api-backend/src
      - key: REDIS_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: RC918/morningai
      - key: ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        sync: false
    autoDeploy: false  # Disabled to reduce bandwidth/pipeline costs (#2897)
