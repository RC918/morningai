[pytest]
# Explicit test discovery configuration for orchestrator
# All test directories must be listed here to ensure CI coverage
# Issue #3251: CI validation - prevent silent test discovery failures

testpaths =
    tests
    coder/tests
    tools/tests
    hitl/tests
    deepwiki/tests
    webhooks/tests
    meta_agent/tests
    project_engineer/tests
    governance_agent/tests
    redis_queue/tests
    pm_agent/tests
    refactor_agent/tests
    security_agent/tests
    ops_agent/tests
    governance/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Strict markers to catch typos in marker names
addopts = --strict-markers

# Custom markers for test categorization
markers =
    concurrency: Tests for concurrent/parallel execution scenarios
    integration: Integration tests that may require external services
    slow: Tests that take longer to run
    unit: Unit tests that run quickly in isolation

# Minimum pytest version required
minversion = 6.0

# Async mode for pytest-asyncio
asyncio_mode = auto

# Timeout for individual tests (seconds)
timeout = 300
