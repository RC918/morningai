[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests (fast, isolated, use mocks)
    integration: Integration tests (slower, use real dependencies)
    e2e: End-to-end tests (slowest, full system tests)
    slow: Tests that take more than 1 second
    redis: Tests that require Redis
    database: Tests that require database

# Coverage settings
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -v

# Test paths
testpaths = tests

# Minimum coverage (can be increased gradually)
# --cov=src
# --cov-report=term-missing
# --cov-fail-under=80
