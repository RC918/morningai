openapi: 3.0.3
info:
  title: Morning AI API
  description: Comprehensive AI Agent Ecosystem API
  version: 1.0.0
  contact:
    name: Morning AI Team
    email: api@morningai.com

servers:
  - url: http://localhost:5001/api
    description: Local development server
  - url: https://morningai-backend-v2.onrender.com/api
    description: Production server

paths:
  /auth/verify:
    get:
      summary: Verify authentication token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: User login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /billing/plans:
    get:
      summary: Get billing plans
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of billing plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'

  /billing/checkout/session:
    post:
      summary: Create checkout session
      tags: [Billing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionRequest'
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'

  /settings:
    get:
      summary: Get user settings
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
    
    post:
      summary: Save user settings
      tags: [Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Settings saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /dashboard/data:
    get:
      summary: Get dashboard data (legacy)
      deprecated: true
      description: |
        **DEPRECATED**: Use `/phase7/monitoring/dashboard` instead for real-time metrics with degradation markers.
        
        This legacy endpoint returns comprehensive dashboard data including system health, metrics, circuit breakers, and saga orchestrator status.
        
        **Example Response**:
        ```json
        {
          "timestamp": "2025-11-04T16:53:22.509781",
          "system_health": "healthy",
          "system_metrics": {...},
          "circuit_breakers": {...},
          "bulkheads": {...},
          "saga_orchestrator": {...},
          "storage_stats": {...},
          "task_execution": {...},
          "trends": {...},
          "alerts": []
        }
        ```
      tags: [Dashboard]
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'

  /phase7/monitoring/dashboard:
    get:
      summary: Get monitoring dashboard with real metrics
      description: |
        Returns real-time monitoring dashboard data with intelligent degradation handling.
        
        **Degradation Behavior**:
        - When Redis is unavailable: Returns fallback data with `available: false`, `source: 'fallback'`, `error: 'Redis unavailable'`
        - When Database is unavailable: Returns degraded status with alerts
        - When both are unavailable: Returns HTTP 503 Service Unavailable
        
        **Example Response (Normal)**:
        ```json
        {
          "system_health": {
            "overall_status": "healthy",
            "error_rate": 0.01,
            "avg_latency": 0.15,
            "open_circuit_breakers": 0
          },
          "metrics": {
            "queue_depth": {
              "current": 5,
              "unit": "tasks",
              "trend": "stable"
            },
            "active_agents": {
              "current": 3,
              "unit": "agents",
              "trend": "up"
            }
          },
          "agents": [],
          "alerts": []
        }
        ```
        
        **Example Response (Redis Degraded)**:
        ```json
        {
          "system_health": {
            "overall_status": "healthy",
            ...
          },
          "metrics": {
            "queue_depth": {
              "current": 0,
              "unit": "tasks",
              "trend": "unknown",
              "available": false,
              "source": "fallback",
              "error": "Redis unavailable"
            }
          },
          "agents": [],
          "alerts": [
            {
              "id": "redis_error",
              "severity": "warning",
              "message": "Redis connection unavailable",
              "timestamp": "2025-11-04T16:45:58.648953"
            }
          ]
        }
        ```
      tags: [Monitoring]
      responses:
        '200':
          description: Monitoring dashboard data with real metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringDashboardData'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unavailable (dependencies down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
        role:
          type: string
        tenant_id:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
        expires_in:
          type: integer

    BillingPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        currency:
          type: string
        interval:
          type: string
        features:
          type: array
          items:
            type: string

    CheckoutSessionRequest:
      type: object
      required:
        - plan_id
      properties:
        plan_id:
          type: string
        success_url:
          type: string
        cancel_url:
          type: string

    CheckoutSessionResponse:
      type: object
      properties:
        session_id:
          type: string
        checkout_url:
          type: string
        expires_at:
          type: string
          format: date-time

    UserSettings:
      type: object
      properties:
        profile:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            avatar:
              type: string
              format: uri
            role:
              type: string
        preferences:
          type: object
          properties:
            language:
              type: string
            theme:
              type: string
            notifications:
              type: object
              properties:
                email:
                  type: boolean
                desktop:
                  type: boolean
                aiSuggestions:
                  type: boolean

    DashboardData:
      type: object
      properties:
        metrics:
          type: object
        charts:
          type: array
          items:
            type: object
        alerts:
          type: array
          items:
            type: object

    MonitoringDashboardData:
      type: object
      properties:
        system_health:
          type: object
          properties:
            overall_status:
              type: string
              enum: [healthy, degraded, unhealthy]
            error_rate:
              type: number
            avg_latency:
              type: number
            open_circuit_breakers:
              type: integer
        metrics:
          type: object
          properties:
            api_request_rate:
              $ref: '#/components/schemas/MetricValue'
            agent_task_success_rate:
              $ref: '#/components/schemas/MetricValue'
            queue_depth:
              $ref: '#/components/schemas/MetricValue'
            active_agents:
              $ref: '#/components/schemas/MetricValue'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentMetrics'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertItem'

    MetricValue:
      type: object
      required:
        - current
        - unit
      properties:
        current:
          type: number
        previous:
          type: number
        unit:
          type: string
        trend:
          type: string
          enum: [up, down, stable, unknown]
        available:
          type: boolean
        source:
          type: string
        error:
          type: string

    AgentMetrics:
      type: object
      required:
        - agent_id
        - agent_type
        - status
        - reputation_score
        - task_success_rate
        - active_tasks
      properties:
        agent_id:
          type: string
        agent_type:
          type: string
        status:
          type: string
        reputation_score:
          type: number
        task_success_rate:
          type: number
        active_tasks:
          type: integer
        computed:
          type: boolean

    AlertItem:
      type: object
      required:
        - id
        - severity
        - message
        - timestamp
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string

    ServiceUnavailableError:
      type: object
      required:
        - error
        - status
      properties:
        error:
          type: string
          description: Error message describing the unavailable service
        message:
          type: string
          description: Detailed error message
        status:
          type: string
          enum: [service_unavailable]
          description: Service status indicator
        request_id:
          type: string
          description: Optional request ID for tracing and observability
      example:
        error: "Core services unavailable"
        message: "Both Redis and Database connections failed"
        status: "service_unavailable"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        request_id:
          type: string
