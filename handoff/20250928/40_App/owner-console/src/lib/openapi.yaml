openapi: 3.0.3
info:
  title: Morning AI API
  description: Comprehensive AI Agent Ecosystem API
  version: 1.0.0
  contact:
    name: Morning AI Team
    email: api@morningai.com

servers:
  - url: http://localhost:5001
    description: Local development server
  - url: https://morningai-backend-v2.onrender.com
    description: Production server

paths:
  /api/auth/verify:
    get:
      summary: Verify authentication token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      summary: User login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/billing/plans:
    get:
      summary: Get billing plans
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of billing plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'

  /api/billing/checkout/session:
    post:
      summary: Create checkout session
      tags: [Billing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionRequest'
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'

  /api/settings:
    get:
      summary: Get user settings
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
    
    post:
      summary: Save user settings
      tags: [Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Settings saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/dashboard/data:
    get:
      summary: Get dashboard data
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'

  /api/admin/system/health:
    get:
      summary: Get system health status
      description: Returns overall system health including status, uptime, and service checks. Requires Owner role.
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /api/admin/system/metrics:
    get:
      summary: Get system metrics
      description: Returns system resource usage metrics (CPU, memory, disk, requests). Requires Owner role.
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorWithStatus'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /api/admin/system/logs:
    get:
      summary: Get system logs
      description: Returns recent system logs with filtering options. Requires Owner role.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
          description: Filter by log level
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Number of logs to return
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: ISO timestamp to get logs since
      responses:
        '200':
          description: System logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogs'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /api/admin/agents:
    get:
      summary: Get all agents
      description: Returns list of all agents with status and metadata. Requires Owner role.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: all
          description: Filter by status (active, paused, all)
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
          description: Number of agents to return
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentsResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /api/governance/events:
    get:
      summary: Get reputation events history
      description: Returns reputation events with optional filtering by agent
      tags: [Governance]
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
          description: Filter by agent ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of events to return
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceEventsResponse'
        '503':
          description: Governance system unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceError'

  /api/governance/violations:
    get:
      summary: Get policy violation records
      description: Returns policy violations with optional filtering by agent
      tags: [Governance]
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
          description: Filter by agent ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Number of violations to return
      responses:
        '200':
          description: List of violations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceViolationsResponse'
        '503':
          description: Governance system unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceError'

  /api/governance/statistics:
    get:
      summary: Get overall governance system statistics
      description: Returns reputation and cost statistics
      tags: [Governance]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Governance statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceStatistics'
        '503':
          description: Governance system unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceError'

  /api/tenant/info:
    get:
      summary: Get detailed tenant information
      description: Returns tenant details including member and task counts
      tags: [Tenant]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantError'

  /api/tenant/members:
    get:
      summary: Get list of members in tenant
      description: Returns paginated list of tenant members with profile info
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Max number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMembersResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantError'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
        role:
          type: string
        tenant_id:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
        expires_in:
          type: integer

    BillingPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        currency:
          type: string
        interval:
          type: string
        features:
          type: array
          items:
            type: string

    CheckoutSessionRequest:
      type: object
      required:
        - plan_id
      properties:
        plan_id:
          type: string
        success_url:
          type: string
        cancel_url:
          type: string

    CheckoutSessionResponse:
      type: object
      properties:
        session_id:
          type: string
        checkout_url:
          type: string
        expires_at:
          type: string
          format: date-time

    UserSettings:
      type: object
      properties:
        profile:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            avatar:
              type: string
              format: uri
            role:
              type: string
        preferences:
          type: object
          properties:
            language:
              type: string
            theme:
              type: string
            notifications:
              type: object
              properties:
                email:
                  type: boolean
                desktop:
                  type: boolean
                aiSuggestions:
                  type: boolean

    DashboardData:
      type: object
      properties:
        metrics:
          type: object
        charts:
          type: array
          items:
            type: object
        alerts:
          type: array
          items:
            type: object

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        request_id:
          type: string

    SystemHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        uptime_seconds:
          type: integer
        uptime_hours:
          type: number
        services:
          type: object
          properties:
            database:
              type: string
            redis:
              type: string
            api:
              type: string
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    SystemMetrics:
      type: object
      properties:
        cpu:
          type: object
          properties:
            usage_percent:
              type: number
            count:
              type: integer
        memory:
          type: object
          properties:
            usage_percent:
              type: number
            used_gb:
              type: number
            total_gb:
              type: number
        disk:
          type: object
          properties:
            usage_percent:
              type: number
            used_gb:
              type: number
            total_gb:
              type: number
        requests:
          type: object
          properties:
            total_requests_1h:
              type: integer
            avg_response_time_ms:
              type: integer
            error_rate_percent:
              type: integer
            note:
              type: string
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    SystemLogs:
      type: object
      properties:
        logs:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              level:
                type: string
              message:
                type: string
              source:
                type: string
              metadata:
                type: object
                additionalProperties: true
        count:
          type: integer
        filters:
          type: object
          properties:
            level:
              type: string
            limit:
              type: integer
            since:
              type: string
        timestamp:
          type: string
          format: date-time

    AdminAgent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        reputation_score:
          type: integer
        total_executions:
          type: integer
        success_rate:
          type: number
        last_execution:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminAgentsResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AdminAgent'
        count:
          type: integer
        using_mock:
          type: boolean
        filters:
          type: object
          properties:
            status:
              type: string
            limit:
              type: integer
        timestamp:
          type: string
          format: date-time

    AdminError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    AdminErrorWithStatus:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: string

    GovernanceEvent:
      type: object
      properties:
        event_id:
          type: string
        event_type:
          type: string
        created_at:
          type: string
          format: date-time
        reason:
          type: string
        delta:
          type: integer
        trace_id:
          type: string
      additionalProperties: true

    GovernanceEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceEvent'
        count:
          type: integer

    GovernanceViolation:
      type: object
      properties:
        violation_id:
          type: string
        violation_type:
          type: string
        detected_at:
          type: string
          format: date-time
        description:
          type: string
        severity:
          type: string
        resolved:
          type: boolean
      additionalProperties: true

    GovernanceViolationsResponse:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceViolation'
        count:
          type: integer

    GovernanceStatistics:
      type: object
      properties:
        reputation:
          type: object
          properties:
            total_agents:
              type: integer
            average_score:
              type: number
          additionalProperties: true
        costs:
          type: object
          properties:
            daily:
              type: object
              properties:
                usage:
                  type: object
                  properties:
                    usd:
                      type: number
                  additionalProperties: true
              additionalProperties: true
          additionalProperties: true
        timestamp:
          type: object
          additionalProperties: true

    GovernanceError:
      type: object
      properties:
        error:
          type: string

    TenantInfo:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        member_count:
          type: integer
        task_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
          nullable: true

    TenantMembersResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/TenantMember'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    TenantError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
