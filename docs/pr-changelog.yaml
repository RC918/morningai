# PR Changelog - Single Source of Truth
# This file is the canonical source for PR changelog entries across all documentation files.
# Run `python scripts/generate-docs-changelog.py` to regenerate documentation from this file.
#
# Schema:
#   config:                    # Optional global configuration
#     troubleshooting_keywords: ["Backend", "Infrastructure", ...]  # Keywords for troubleshooting doc filtering
#
#   changelog:
#     - period: "Date range string (e.g., 'Dec 7 - Dec 9, 2025')"
#       period_zh: "Chinese date range (e.g., '2025-12-07 至 2025-12-09')"
#       categories:
#         - name: "Category name in English"
#           name_zh: "Category name in Chinese"
#           prs:
#             - number: PR number (integer)
#               title: "PR title"
#               path: "Primary file path (optional)"
#               path_note: "Note about path (e.g., 'new file', 'major update')"
#               change: "What was changed (optional, defaults to impact)"
#               impact: "Impact/benefit description in English"
#               impact_zh: "Impact description in Chinese"
#               merged: "Merge date (YYYY-MM-DD)"
#               related_issues: [list of related issue numbers]
#
# HTML Comment Markers (add to docs for reliable insertion points):
#   <!-- CHANGELOG_INSERT_POINT:onboarding -->
#   <!-- CHANGELOG_INSERT_POINT:project_structure -->
#   <!-- CHANGELOG_INSERT_POINT:environments -->
#   <!-- CHANGELOG_INSERT_POINT:troubleshooting -->

